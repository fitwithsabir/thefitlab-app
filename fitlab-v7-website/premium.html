<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Premium — The Fit Lab</title>
<meta name="description" content="Fit Lab Premium: get hired faster, grow your practice, or hire the right people. 14-day free trial, no automatic renewals.">
<script src="assets/theme.js"></script>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fit Lab">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .p-hero{padding:26px 24px 8px;text-align:center}
  .p-hero .crown{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:14px;background:var(--gold);color:var(--gold-ink)}
  .p-hero h1{font:700 clamp(24px,3.4vw,32px)/1.2 var(--body);margin:12px 0 6px;letter-spacing:0;text-transform:none}
  .p-hero p{margin:0 auto;max-width:560px;color:var(--ash);line-height:1.55}
  .seg2{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;margin:18px auto 4px;gap:2px;background:var(--panel-2)}
  .seg2 button{border:0;background:none;color:var(--ash);font:600 14px var(--body);padding:7px 16px;border-radius:999px;cursor:pointer}
  .seg2 button.on{background:var(--lime);color:var(--on-lime)}
  .save-tag{font-size:11px;font-weight:700;color:var(--gold);margin-left:4px}
  .plan .cta{display:grid;gap:8px;margin-top:6px}
  .plan .note{font-size:12px;color:var(--ash);text-align:center}
  .mine{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 20px}
  .mine .ic{width:44px;height:44px;border-radius:12px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;flex:none}
  .freebox ul{list-style:none;padding:0 20px 18px;margin:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .freebox li{display:flex;gap:8px;font-size:13.5px;line-height:1.4}
  .freebox li svg{color:var(--lime);flex:none;margin-top:1px}
  .faq details{border-top:1px solid var(--line);padding:12px 20px}
  .faq summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px}
  .faq summary::-webkit-details-marker{display:none}
  .faq details p{margin:8px 0 0;color:var(--ash);font-size:14px;line-height:1.6}
  .switch{position:relative;width:46px;height:26px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
  .switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:.2s}
  .switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch input:checked + span{background:var(--gold)}
  .switch input:checked + span::after{transform:translateX(20px)}
  .work{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 20px 14px}
  .work a,.work div.k{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel-2);color:var(--bone);display:block}
  .work a:hover{border-color:var(--gold);text-decoration:none}
  .work b{display:block;font:700 22px/1.1 var(--body)}
  .work span{font-size:12.5px;color:var(--ash)}
  .perk-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .perk-row .t-sm{color:var(--ash)}
  .team-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;padding:0 20px 20px}
  @media (max-width:760px){ .team-grid{grid-template-columns:1fr} }
  .team-grid ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
  .team-grid li{display:flex;gap:10px;font-size:14px;line-height:1.45}
  .team-grid li svg{color:var(--lime);flex:none;margin-top:2px}
  .tbuy{border:1px solid var(--line-2);border-radius:14px;padding:16px;background:var(--panel-2)}
  .tbuy .row2{gap:10px}
  .tprice{font:700 26px/1.1 var(--body);margin:6px 0 2px}
  .tprice small{font-size:13px;color:var(--ash);font-weight:600}
  .seat{display:flex;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line)}
  .seat .ent-main{flex:1;min-width:0}
  .addseat{display:flex;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .addseat input{flex:1;min-width:200px}
</style>
</head>
<body data-page="me">
<main class="page" style="max-width:1080px">
  <div class="stack" id="main"><div class="box skeleton" style="height:420px"></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/track.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = FL.esc, I = FL.icon;
  const session = await FL.session();
  let me = null;
  if (session) {
    try { me = await FL.getProfile(); } catch (e) { return FL.toast(FL.friendly(e), 'err'); }
    if (!me.profile_completed) return location.replace('register.html');
  }
  FL.renderHeader(me);
  const [{ data: plans }, prem, use0] = await Promise.all([sb.rpc('premium_plans_list'), me ? sb.rpc('my_premium').then((r) => r.data) : Promise.resolve(null),
    me ? sb.rpc('premium_usage').then((r) => r.data) : Promise.resolve(null)]);
  let use = use0;
  let team = me ? await sb.rpc('team_info').then((r) => r.data, () => null) : null;
  let tPlan = (plans || []).some((p) => p.code === 'pro') ? 'pro' : ((plans || [])[0] || {}).code, tSeats = 5;
  let st = prem, period = 'month';
  const want = FL.param('plan');
  // suggest a plan from the member's situation
  const suggested = want || (me && ['recruiter', 'gym_owner', 'gym_manager'].includes(me.profession) ? 'recruiter'
    : me && me.open_to_work ? 'pro' : me && me.profession && !['student', 'athlete'].includes(me.profession) ? 'business' : 'pro');
  const login = () => { location.href = 'index.html?next=' + encodeURIComponent('premium.html' + location.search); };
  const fmtDay = (d) => new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

  function mine() {
    if (!me || !st) return '';
    if (st.active) {
      const trial = st.source === 'trial', u = use || {}, rank = { pro: 1, business: 2, recruiter: 3 }[st.plan] || 0;
      const left = Math.max(0, (u.inmail_total || 0) - (u.inmail_used || 0));
      return `<div class="box"><div class="mine"><span class="ic">${I('crown', 24)}</span>
        <div style="flex:1;min-width:200px"><b style="font-size:16px">You're on ${esc(st.name)}${trial ? ' (free trial)' : ''}</b>
          <div class="t-sm muted">${st.source === 'team' ? 'Team plan · ' : ''}${trial ? 'Trial ends' : 'Active until'} ${fmtDay(st.expires_at)}${u.days_left != null ? ` · ${u.days_left} day${u.days_left === 1 ? '' : 's'} left` : ''} · nothing renews automatically</div></div></div>
        <div class="box-head" style="padding-top:0"><h3 style="font-size:15px">Your Premium at work · last 30 days</h3></div>
        <div class="work">
          <a href="insights.html"><b>${u.views_30d ?? 0}</b><span>profile views</span></a>
          <a href="insights.html"><b>${u.employer_views_30d ?? 0}</b><span>verified employers &amp; recruiters viewed you — see who</span></a>
          <a href="feed.html"><b>${u.post_views_30d ?? 0}</b><span>views on your posts</span></a>
          <div class="k"><b>${left}<small style="font-size:13px;color:var(--ash)"> / ${u.inmail_total || 0}</small></b><span>InMail left this month</span></div>
          <a href="messaging.html"><b>${u.open_profile_chats ?? 0}</b><span>people messaged you through Open Profile</span></a>
          <a href="jobs.html?tab=applied"><b>${u.featured_applications ?? 0}</b><span>applications shown to employers first</span></a>
          ${rank >= 3 ? `<a href="hiring.html?tab=pipeline"><b>${u.pipeline ?? 0}</b><span>candidates in your talent pipeline</span></a>` : ''}
        </div>
        <div class="perk-row"><div><b>Open Profile</b><div class="t-sm">Anyone on The Fit Lab can message you for free — great for winning new clients.</div></div>
          <span class="switch"><input type="checkbox" id="openp" ${u.open_profile ? 'checked' : ''} aria-label="Open Profile"><span></span></span></div>
        <div class="perk-row"><div><b>Premium badge</b><div class="t-sm">The ${esc(st.name)} badge next to your name.</div></div>
          <span class="switch"><input type="checkbox" id="badge" ${st.show_badge ? 'checked' : ''} aria-label="Show my Premium badge"><span></span></span></div>
        <div class="perk-row"><div><b>Shortcuts</b><div class="t-sm">Everything Premium unlocks, one tap away.</div></div>
          <span style="display:flex;gap:8px;flex-wrap:wrap"><a class="pill sm" href="insights.html">${I('eye', 15)}Who viewed you</a>
            <a class="pill sm" href="jobs.html">${I('briefcase', 15)}Jobs &amp; salary insights</a>
            ${rank >= 3 ? `<a class="pill sm" href="hiring.html?tab=candidates">${I('search', 15)}Find candidates</a>` : ''}
            ${rank >= 2 ? `<a class="pill sm" href="company.html">${I('chart', 15)}Page analytics</a>` : ''}</span></div>
        ${trial ? `<div class="notice" style="margin:12px 20px 16px">${I('clock', 18)}<div class="t-sm">Your trial doesn't renew by itself and nothing will be charged. Buy a month or a year below to keep Premium after ${fmtDay(st.expires_at)}.</div></div>` : '<div style="height:8px"></div>'}</div>`;
    }
    if (st.last_plan) return `<div class="box"><div class="mine"><span class="ic" style="background:var(--line-2);color:var(--bone)">${I('crown', 24)}</span>
      <div><b style="font-size:16px">Your Premium ended on ${fmtDay(st.expires_at)}</b><div class="t-sm muted">Pick a plan below to switch it back on — your InMail threads and insights are still here.</div></div></div></div>`;
    return '';
  }

  function planCard(p) {
    const yearly = period === 'year';
    const price = yearly ? p.price_year : p.price_month;
    const perMonth = yearly ? Math.round(p.price_year / 12) : p.price_month;
    const current = st && st.active && st.plan === p.code;
    const canTrial = !me || (st && st.trial_available && !st.active);
    return `<div class="plan ${p.code === suggested ? 'best' : ''}">${p.code === suggested ? `<span class="tag">${want ? 'Selected' : 'Recommended for you'}</span>` : ''}
      <h3>${I('crown', 20)}${esc(p.name)}</h3><div class="t-sm muted" style="margin-top:-4px">${esc(p.tagline || '')}</div>
      <div class="price">${FL.paise(price)}<small> / ${yearly ? 'year' : 'month'}</small></div>
      ${yearly ? `<div class="t-xs muted" style="margin-top:-6px">${FL.paise(perMonth)} a month, paid yearly</div>` : ''}
      <ul>${(p.features || []).map((f) => `<li>${I('check', 16)}<span>${esc(f)}</span></li>`).join('')}</ul>
      <div class="cta">
        ${current ? `<button class="pill gold-o block" disabled>Your current plan</button><button class="pill ghost block" data-buy="${p.code}">Extend by a ${yearly ? 'year' : 'month'}</button>`
          : canTrial ? `<button class="pill gold block lg" data-trial="${p.code}">Start 14-day free trial</button><button class="pill ghost block" data-buy="${p.code}">Buy now · ${FL.paise(price)}</button>`
          : `<button class="pill gold block lg" data-buy="${p.code}">${st && st.active ? 'Switch to ' + esc(p.name) : 'Get ' + esc(p.name)} · ${FL.paise(price)}</button>`}
        <div class="note">${canTrial ? 'No card needed for the trial · ' : ''}No automatic renewal</div></div></div>`;
  }

  // ---------------------------------------------------------------- gym team plan
  const teamPrice = (code, seats) => {
    const p = (plans || []).find((x) => x.code === code); if (!p || !(seats >= 2 && seats <= 50)) return null;
    const each = period === 'year' ? p.price_year : p.price_month;
    return { each, list: each * seats, total: Math.round(each * seats * (seats >= 3 ? 0.8 : 1) / 100) * 100, off: seats >= 3, name: p.name };
  };
  function teamBuyer() {
    const q = teamPrice(tPlan, tSeats);
    return `<div class="tbuy"><div class="row2">
        <div class="field" style="margin:0"><label for="tPlan">Plan for every seat</label><select id="tPlan">${(plans || []).map((p) => `<option value="${p.code}" ${p.code === tPlan ? 'selected' : ''}>${esc(p.name)} — ${esc(p.tagline || '')}</option>`).join('')}</select></div>
        <div class="field" style="margin:0"><label for="tSeats">Seats (2–50)</label><input id="tSeats" type="number" inputmode="numeric" min="2" max="50" value="${tSeats}"></div></div>
      <div id="tQuote">${q ? `<div class="tprice">${FL.paise(q.total)}<small> / ${period === 'year' ? 'year' : 'month'} for ${tSeats} seats</small></div>
        <div class="t-sm muted">${q.off ? `<s>${FL.paise(q.list)}</s> · 20% off · ` : ''}${FL.paise(Math.round(q.total / tSeats))} per seat${q.off ? '' : ' · 20% off from 3 seats'}</div>` : '<div class="t-sm muted" style="margin:10px 0">Choose 2 to 50 seats.</div>'}</div>
      <button class="pill gold block lg" id="tBuy" style="margin-top:12px" ${q ? '' : 'disabled'}>${team && team.is_owner ? 'Renew team plan' : 'Buy team plan'}${q ? ' · ' + FL.paise(q.total) : ''}</button>
      <div class="t-xs muted" style="margin-top:8px;text-align:center">${period === 'year' ? 'Yearly' : 'Monthly'} — switch above · no automatic renewal${team && team.is_owner ? ' · adds time to your current team plan' : ''}</div></div>`;
  }
  function teamBox() {
    if (team && !team.is_owner) {
      return `<div class="box" id="team"><div class="mine"><span class="ic">${I('users', 22)}</span>
        <div><b style="font-size:16px">You're on ${esc(team.owner.full_name)}'s team plan</b>
        <div class="t-sm muted">${esc(team.plan_name)} · ${team.active ? 'until ' + fmtDay(team.expires_at) : 'ended ' + fmtDay(team.expires_at)} · paid by your gym</div></div></div></div>`;
    }
    const head = `<div class="box-head"><div><h2>Team plan for gyms &amp; studios</h2><div class="sub">Premium for your whole staff on one payment · 20% off from 3 seats</div></div></div>`;
    if (team && team.is_owner) {
      const free = team.seats - team.used;
      return `<div class="box" id="team">${head}
        <div class="mine" style="padding-top:0"><span class="ic">${I('users', 22)}</span><div style="flex:1;min-width:200px">
          <b style="font-size:16px">${team.seats} × ${esc(team.plan_name)}</b><div class="t-sm muted">${team.active ? 'Active until ' + fmtDay(team.expires_at) : 'Ended ' + fmtDay(team.expires_at) + ' — renew below'} · ${team.used} of ${team.seats} seats in use</div></div></div>
        ${(team.members || []).map((m) => `<div class="seat">${FL.ringAvatar(m, 'avatar sm')}<div class="ent-main"><b class="ent-name" style="font-size:14px">${esc(m.full_name)}</b>
            <div class="ent-meta">@${esc(m.username)}${m.user_id === me.id ? ' · you' : ''}</div></div>
            ${m.user_id === me.id ? '' : `<button class="pill ghost sm" data-unseat="${m.user_id}" data-name="${esc(m.full_name)}">Remove</button>`}</div>`).join('')}
        ${team.active ? `<form class="addseat" id="addSeat"><input id="seatH" maxlength="60" placeholder="${free > 0 ? 'Staff member\'s @username or Fit Lab ID' : 'All seats are in use'}" ${free > 0 ? '' : 'disabled'} aria-label="Add a staff member">
          <button class="pill solid" ${free > 0 ? '' : 'disabled'}>${I('userplus', 15)}Give a seat</button></form>` : ''}
        <div class="team-grid" style="padding-top:12px"><div><b>Renew or change seats</b><p class="t-sm muted" style="line-height:1.55;margin:6px 0 0">Buying again adds a ${period === 'year' ? 'year' : 'month'} to your team plan and sets the number of seats. With fewer seats, the most recently added staff lose theirs first.</p></div>${teamBuyer()}</div></div>`;
    }
    return `<div class="box" id="team">${head}<div class="team-grid"><ul>
        <li>${I('check', 16)}<span>One payment covers your trainers, coaches and front desk — each seat gets every feature of the plan.</span></li>
        <li>${I('check', 16)}<span>You hold the first seat. Give the others to staff by their @username — they're told straight away.</span></li>
        <li>${I('check', 16)}<span>Staff leave? Remove them and give the seat to someone new.</span></li>
        <li>${I('check', 16)}<span>A seat never shortens Premium a member already pays for.</span></li>
        <li>${I('check', 16)}<span>No automatic renewal — pay for a month or a year at a time.</span></li></ul>
      ${teamBuyer()}</div></div>`;
  }
  async function refreshTeam() {
    team = (await sb.rpc('team_info')).data; st = (await sb.rpc('my_premium')).data; use = (await sb.rpc('premium_usage')).data;
  }

  function render() {
    const saving = (plans || []).length ? Math.round(100 - (plans[0].price_year / (plans[0].price_month * 12)) * 100) : 0;
    $('main').innerHTML = `${mine()}
      <div class="box"><div class="p-hero"><span class="crown">${I('crown', 30)}</span>
        <h1>Fit Lab Premium</h1>
        <p>Get hired faster, grow your coaching or clinical practice, or hire the right people — built for the health and fitness industry.</p>
        <div class="seg2" role="group" aria-label="Billing period"><button data-per="month" class="${period === 'month' ? 'on' : ''}">Monthly</button>
          <button data-per="year" class="${period === 'year' ? 'on' : ''}">Yearly${saving > 0 ? `<span class="save-tag">save ${saving}%</span>` : ''}</button></div></div>
        <div class="plans" id="plans">${(plans || []).map(planCard).join('')}</div></div>
      ${teamBox()}

      <div class="box freebox"><div class="box-head"><div><h2>Free for everyone, always</h2><div class="sub">The basics that other networks charge for, or don't do at all</div></div></div>
        <ul><li>${I('rupee', 16)}<span>Pay is shown on every job — no guessing</span></li>
          <li>${I('shield', 16)}<span>No job can ask you for a fee or deposit</span></li>
          <li>${I('check', 16)}<span>Live status on every application: Viewed → Shortlisted → Interview → Offer</span></li>
          <li>${I('clock', 16)}<span>Jobs close after 30 days, and closing tells every applicant — no ghosting</span></li>
          <li>${I('tick', 16)}<span>Apply for the verified tick — free, with no ID documents stored</span></li>
          <li>${I('briefcase', 16)}<span>Post jobs from your page — 2 free, 10 once your page is verified</span></li>
          <li>${I('network', 16)}<span>Connect, message your connections, post and follow pages</span></li>
          <li>${I('courses', 16)}<span>Fit Lab Academy courses and QR-verified certificates</span></li>
          <li>${I('bell', 16)}<span>Pop-up notifications on your phone and computer</span></li>
          <li>${I('link', 16)}<span>Share your phone, WhatsApp, Instagram, YouTube and website on your profile</span></li>
          <li>${I('chart', 16)}<span>See how many people viewed each of your posts</span></li>
          <li>${I('tag', 16)}<span>Sort your connections by how you know them</span></li></ul></div>

      <div class="box faq"><div class="box-head"><h2>Questions</h2></div>
        <details><summary>Will I be charged automatically? ${I('down', 16)}</summary><p>No. You pay for one month or one year at a time — nothing renews by itself, so there are no surprise charges. Your plan simply ends on its date, and you can buy again whenever you like.</p></details>
        <details><summary>Do I need a card for the free trial? ${I('down', 16)}</summary><p>No. Start the 14-day trial with one tap. Each member gets one trial.</p></details>
        <details><summary>How do I pay? ${I('down', 16)}</summary><p>Payments are handled securely by Razorpay — UPI, debit and credit cards, net banking and wallets. The Fit Lab never sees your card details.</p></details>
        <details><summary>Who can see that I viewed their profile? ${I('down', 16)}</summary><p>Premium members see the names of verified employers and recruiters who viewed them. Everyone else appears only as numbers — profession and city — so you can browse freely and no one is followed around.</p></details>
        <details><summary>What is InMail? ${I('down', 16)}</summary><p>InMail lets you message someone you aren't connected to about work. Pro reaches people who are hiring; Business and Recruiter can also reach members who are open to work. They can accept or decline, and replies are free. Messaging an employer about a job you've applied to is always free.</p></details>
        <details><summary>What is Open Profile? ${I('down', 16)}</summary><p>With Premium you can switch on Open Profile so any member — a potential client, a gym, a patient's family — can message you for free without connecting first. You can switch it off any time, and you can still block or report anyone.</p></details>
        <details><summary>How does the team plan work? ${I('down', 16)}</summary><p>A gym or studio buys several seats in one payment — 20% off from 3 seats. The buyer holds the first seat and gives the rest to staff by @username. Removing someone frees the seat for another person, and their team Premium ends.</p></details>
        <details><summary>Can I switch plans? ${I('down', 16)}</summary><p>Yes — buying a different plan switches you to it straight away, and any paid time left is added on.</p></details>
      </div>`;
  }
  render();
  if (location.hash === '#team' && $('team')) setTimeout(() => $('team').scrollIntoView(), 50);

  async function checkout(plan) {
    if (!me) return login();
    const btns = document.querySelectorAll(`[data-buy="${plan}"]`); btns.forEach((b) => FL.busy(b, true, 'Opening…'));
    const { data, error } = await FL.fn('premium-checkout', { action: 'order', plan, period, meta: window.FLTrack ? FLTrack.meta('premium') : {} });
    btns.forEach((b) => FL.busy(b, false));
    if (error) return FL.toast('Payments couldn\'t be opened. Please try again.', 'err');
    if (!data || !data.ok) {
      if (data && data.code === 'not_configured') {
        const m = FL.modal({ title: 'Online payments are coming soon', body: `<p style="margin:0;line-height:1.55">${esc(data.message)}</p>`,
          foot: st && st.trial_available ? `<button class="pill ghost" data-no>Close</button><button class="pill gold" data-t>Start free trial</button>` : `<button class="pill solid" data-no>OK</button>` });
        m.q('[data-no]').onclick = m.close;
        const t = m.q('[data-t]'); if (t) t.onclick = () => { m.close(); trial(plan); };
        return;
      }
      return FL.toast((data && data.message) || 'Payments couldn\'t be opened.', 'err');
    }
    openPay(data, `premium-${plan}-${period}`, 1, async () => {
      FL.toast('Welcome to Premium!', 'ok'); st = (await sb.rpc('my_premium')).data; use = (await sb.rpc('premium_usage')).data;
      FL.renderHeader(me); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
  async function checkoutTeam() {
    if (!me) return login();
    const b = $('tBuy'); FL.busy(b, true, 'Opening…');
    const { data, error } = await FL.fn('premium-checkout', { action: 'team_order', plan: tPlan, period, seats: tSeats, meta: window.FLTrack ? FLTrack.meta('premium-team') : {} });
    FL.busy(b, false);
    if (error) return FL.toast('Payments couldn\'t be opened. Please try again.', 'err');
    if (!data || !data.ok) return FL.toast((data && data.message) || 'Payments couldn\'t be opened.', 'err');
    openPay(data, `premium-${tPlan}-${period}-team`, data.seats || tSeats, async () => {
      FL.toast('Your team plan is active — now give seats to your staff', 'ok'); await refreshTeam();
      FL.renderHeader(me); render(); $('team').scrollIntoView({ behavior: 'smooth' });
    });
  }
  // one Razorpay window for single and team purchases
  async function openPay(data, cid, items, done) {
    try { await loadRazorpay(); } catch (e) { return FL.toast('Couldn\'t load the payment window. Check your connection and try again.', 'err'); }
    window.FLTrack && FLTrack.event('InitiateCheckout', { content_name: data.name, content_ids: [cid], content_type: 'product', value: data.amount / 100, currency: 'INR', num_items: items });
    const rz = new window.Razorpay({
      key: data.key_id, amount: data.amount, currency: data.currency, order_id: data.order_id,
      name: 'The Fit Lab', description: `${data.name} · ${data.description}`, prefill: data.prefill,
      theme: { color: getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() || '#e0b341' },
      modal: { ondismiss: () => FL.toast('Payment cancelled. You weren\'t charged.') },
      handler: async (resp) => {
        FL.toast('Confirming your payment…');
        const v = await FL.fn('premium-checkout', { action: 'verify', order_id: resp.razorpay_order_id, payment_id: resp.razorpay_payment_id, signature: resp.razorpay_signature });
        if (v.data && v.data.ok) { window.FLTrack && FLTrack.event('Purchase', { content_name: data.name, content_ids: [cid], content_type: 'product', value: data.amount / 100, currency: 'INR', num_items: items }, resp.razorpay_order_id); await done(); }
        else FL.toast((v.data && v.data.message) || 'We couldn\'t confirm the payment yet. If money was taken, Premium switches on within a few minutes.', 'err');
      },
    });
    rz.on('payment.failed', (r) => FL.toast((r && r.error && r.error.description) || 'Payment failed. No money was taken.', 'err'));
    rz.open();
  }
  function loadRazorpay() {
    if (window.Razorpay) return Promise.resolve();
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://checkout.razorpay.com/v1/checkout.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  async function trial(plan) {
    if (!me) return login();
    const r = await FL.call('start_trial', { p_plan: plan });
    if (!r) return;
    st = (await sb.rpc('my_premium')).data; use = (await sb.rpc('premium_usage')).data;
    FL.toast('Your 14-day trial has started', 'ok'); FL.renderHeader(me); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $('main').addEventListener('click', (e) => {
    const p = e.target.closest('[data-per]'); if (p) { period = p.dataset.per; render(); return; }
    const b = e.target.closest('[data-buy]'); if (b) return checkout(b.dataset.buy);
    const t = e.target.closest('[data-trial]'); if (t) return trial(t.dataset.trial);
    if (e.target.closest('#tBuy')) return checkoutTeam();
    const u = e.target.closest('[data-unseat]');
    if (u) return (async () => {
      if (!(await FL.confirm(`Remove ${u.dataset.name}?`, 'Their team Premium ends now and the seat is free for someone else.', 'Remove', true))) return;
      const r = await FL.call('team_remove_seat', { p_user: u.dataset.unseat });
      if (r) { FL.toast('Seat freed', 'ok'); await refreshTeam(); render(); $('team').scrollIntoView(); }
    })();
  });
  $('main').addEventListener('submit', async (e) => {
    if (e.target.id !== 'addSeat') return;
    e.preventDefault();
    const h = $('seatH').value.trim(); if (!h) return;
    const btn = e.target.querySelector('button'); FL.busy(btn, true, 'Adding…');
    const r = await FL.call('team_add_seat', { p_handle: h });
    FL.busy(btn, false);
    if (r) { FL.toast('Seat given — they\'ve been told', 'ok'); await refreshTeam(); render(); $('team').scrollIntoView(); }
  });
  $('main').addEventListener('input', (e) => {
    if (e.target.id !== 'tSeats') return;
    tSeats = Math.max(0, Math.min(50, Math.floor(+e.target.value || 0)));
    const q = $('tQuote'), html = document.createElement('div'); html.innerHTML = teamBuyer();
    q.innerHTML = html.querySelector('#tQuote').innerHTML; $('tBuy').outerHTML = html.querySelector('#tBuy').outerHTML;
  });
  $('main').addEventListener('change', async (e) => {
    if (e.target.id === 'tPlan') { tPlan = e.target.value; const y = scrollY; render(); scrollTo(0, y); return; }
    if (e.target.id === 'openp') {
      const r = await FL.call('set_open_profile', { p_on: e.target.checked });
      if (!r) { e.target.checked = !e.target.checked; return; }
      FL.toast(r.open_profile ? 'Open Profile is on — anyone can message you free' : 'Open Profile is off', 'ok'); return;
    }
    if (e.target.id !== 'badge') return;
    const on = e.target.checked;
    const { error } = await sb.from('profiles').update({ show_premium_badge: on }).eq('id', me.id);
    if (error) { e.target.checked = !on; return FL.toast(FL.friendly(error), 'err'); }
    FL.toast(on ? 'Your Premium badge is showing' : 'Premium badge hidden', 'ok');
  });
})();
</script>
</body>
</html>
