<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home — The Fit Lab</title>
<script src="assets/theme.js"></script>
<script src="assets/i18n.js"></script>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fit Lab">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="home">
<main class="page">
  <div class="layout l-three">
    <aside class="col-left"><div class="sticky-col" id="left"><div class="box skeleton" style="height:260px"></div></div></aside>

    <section class="stack" id="center" aria-label="Feed">
      <div id="notice"></div>
      <section id="today" aria-label="Today"></section>
      <div class="box composer" id="compose">
        <div class="row" id="cmpRow"><div class="avatar md skeleton"></div><button class="fake" id="btnCompose">Start a post</button></div>
        <div class="tools">
          <button class="txt-btn" data-compose><span id="icImg"></span>Photo</button>
          <button class="txt-btn" data-compose><span id="icIdea"></span>Coaching tip</button>
          <button class="txt-btn" data-compose><span id="icWin"></span>Client win</button>
        </div>
      </div>
      <div class="box" id="scopeBox" style="padding:0"><div class="utabs" id="scope" style="border:0"><button data-sc="all" class="on">All</button><button data-sc="network">My network</button><button data-sc="pages">Pages I follow</button><button data-sc="saved">Saved</button></div></div>
      <div class="box" id="tagBox" hidden></div>
      <div id="single" hidden></div>
      <div class="stack" id="feed"><div class="box skeleton" style="height:220px"></div><div class="box skeleton" style="height:220px"></div></div>
      <div id="more" class="empty" hidden></div>
      <button class="fab" id="fab" aria-label="Create a post"></button>
    </section>

    <aside class="col-right"><div class="sticky-col" id="right"></div></aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/posts.js"></script>
<script src="assets/today.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const session = await FL.requireAuth(); if (!session) return;
  let me; try { me = await FL.getProfile(); } catch (e) { return FL.toast(FL.friendly(e), 'err'); }
  if (!me.profile_completed) return location.replace('register');
  FL.renderHeader(me);
  $('icImg').innerHTML = FL.icon('image', 20); $('icIdea').innerHTML = FL.icon('insightful', 20); $('icWin').innerHTML = FL.icon('celebrate', 20);
  $('cmpRow').innerHTML = `<a href="profile?u=${encodeURIComponent(me.username)}">${FL.avatarHtml(me, 'avatar md')}</a><button class="fake" id="btnCompose">Start a post</button>`;
  $('notice').innerHTML = FL.communityNotice(me);
  FL.push.nudge($('center')).catch(() => {});
  FL.lookNudge($('center'));

  // what the top of home and the side columns need — asked once, shared by both
  const once = (q) => Promise.resolve(q).catch((error) => ({ data: null, error }));
  const qEnr = once(sb.from('enrollments').select('course_id, status, courses(title, slug, total_days)').eq('user_id', me.id));
  const qCnt = once(sb.rpc('connection_count', { p_user: me.id }));
  const qJobs = once(sb.rpc('recommended_jobs', { p_limit: 3 }));
  const qProg = qEnr.then(({ data }) => (data || []).length ? once(sb.from('lesson_progress').select('course_id').eq('user_id', me.id)) : { data: [] });
  const todayData = Promise.all([qEnr, qProg, qJobs, qCnt]).then(([{ data: enr }, { data: prog }, { data: jobs }, cnt]) => {
    const list = (enr || []).filter((c) => c.courses).map((c) => {
      const done = (prog || []).filter((p) => p.course_id === c.course_id).length, total = c.courses.total_days || 1;
      return { id: c.course_id, title: c.courses.title, slug: c.courses.slug, done: Math.min(done, total), total, pct: Math.round(Math.min(done, total) / total * 100) };
    });
    return { course: list.find((c) => c.done < c.total) || list[0] || null, jobs: jobs || [], cnt: (cnt && cnt.data) || 0 };
  });

  const feed = $('feed');
  let oldest = null, loading = false, done = false, scope = 'all';
  const tag = (FL.param('tag') || '').replace(/^#/, '').toLowerCase().replace(/[^a-z0-9_]/g, '') || null;
  if (tag) { $('scopeBox').hidden = true; $('tagBox').hidden = false;
    $('tagBox').innerHTML = `<div class="box-head"><div><h2>${FL.icon('hash', 20)} ${FL.esc(tag)}</h2><div class="sub">Posts with #${FL.esc(tag)}</div></div><a class="pill ghost sm" href="feed">Back to Home</a></div>`; }
  $('fab').innerHTML = FL.icon('edit', 24);
  $('fab').onclick = () => openComposer();
  $('scope').onclick = (e) => { const b = e.target.closest('[data-sc]'); if (!b || b.dataset.sc === scope) return; scope = b.dataset.sc;
    document.querySelectorAll('#scope button').forEach((x) => x.classList.toggle('on', x === b));
    oldest = null; done = false; feed.innerHTML = '<div class="box skeleton" style="height:220px"></div>'; loadMore(); };

  const onPosted = (p) => {
    const tmp = document.createElement('div'); tmp.innerHTML = FLPosts.render(p);
    const empty = feed.querySelector('.empty'); if (empty) empty.remove();
    feed.prepend(tmp.firstElementChild);
  };
  const openComposer = () => FLPosts.composer(me, { onDone: onPosted });
  document.addEventListener('click', (e) => { if (e.target.closest('#btnCompose,[data-compose]')) openComposer(); });
  if (location.hash === '#compose') { history.replaceState(null, '', 'feed'); setTimeout(openComposer, 300); }
  // "Share to Fit Lab" from another app (see sw.js)
  if (FL.param('shared') && 'caches' in window) {
    history.replaceState(null, '', 'feed');
    (async () => {
      try {
        const c = await caches.open('fl-share');
        const t = await c.match('shared-text'), i = await c.match('shared-image');
        const info = t ? await t.json() : {};
        const blob = i ? await i.blob() : null;
        await c.delete('shared-text'); await c.delete('shared-image');
        if (!info.text && !blob) return;
        const file = blob ? new File([blob], 'shared.jpg', { type: blob.type || 'image/jpeg' }) : null;
        FLPosts.composer(me, { initText: info.text || '', initFile: file, onDone: onPosted });
      } catch (_) {}
    })();
  }
  document.querySelector('[data-bb="post"]')?.addEventListener('click', (e) => { e.preventDefault(); openComposer(); });

  if (!FL.param('post') && !tag) FLToday.mount($('today'), me, todayData); else $('today').hidden = true;

  FLPosts.mount(document.getElementById('center'), { me });
  FLPosts.trackViews(document.getElementById('center'));

  // ---- single post (shared link / notification) ----
  const single = FL.param('post');
  if (single) {
    const { data: p } = await sb.rpc('get_post', { p_id: single });
    $('single').hidden = false;
    $('single').innerHTML = p ? FLPosts.render(p, { expanded: true }) + `<p style="text-align:center;margin:14px 0 4px"><a class="pill ghost sm" href="feed">Back to the full feed</a></p>`
                              : `<div class="box empty"><b>This post isn't available</b>It may have been deleted or hidden.<br><br><a class="pill sm" href="feed">Go to your feed</a></div>`;
    feed.hidden = true; $('compose').hidden = true; $('scopeBox').hidden = true;
    if (p) setTimeout(() => $('single').querySelector('[data-act=comments]')?.click(), 50);
  } else {
    await loadMore();
    const io = new IntersectionObserver((ents) => { if (ents.some((x) => x.isIntersecting)) loadMore(); }, { rootMargin: '600px' });
    io.observe($('more'));
  }

  async function loadMore() {
    if (loading || done) return;
    loading = true;
    const { data, error } = tag ? await sb.rpc('posts_by_tag', { p_tag: tag, p_before: oldest, p_limit: 12 })
      : scope === 'saved' ? await sb.rpc('saved_posts_list', { p_before: oldest, p_limit: 12 })
      : await sb.rpc('get_home_feed', { p_before: oldest, p_scope: scope, p_limit: 12 });
    loading = false;
    if (!oldest) feed.innerHTML = '';
    if (error) { feed.insertAdjacentHTML('beforeend', `<div class="box empty">${FL.esc(FL.friendly(error))}</div>`); return; }
    const posts = data || [];
    if (!posts.length && !oldest && (tag || scope === 'saved')) {
      feed.innerHTML = tag ? `<div class="box empty"><b>No posts with #${FL.esc(tag)} yet</b>Be the first — add #${FL.esc(tag)} to your next post.</div>`
        : `<div class="box empty"><b>Nothing saved yet</b>Tap ⋯ on any post and choose “Save post” to keep it here.</div>`;
    } else if (!posts.length && !oldest && scope !== 'all') {
      feed.innerHTML = scope === 'pages' ? `<div class="box empty"><b>No page posts yet</b>Follow gyms, clinics and brands to see their updates and jobs here.<div style="margin-top:14px"><a class="pill sm" href="company">Find pages to follow</a></div></div>`
        : `<div class="box empty"><b>Nothing from your network yet</b>Connect with people you work with to see their posts here.<div style="margin-top:14px"><a class="pill sm" href="network">Grow your network</a></div></div>`;
    } else if (!posts.length && !oldest) {
      feed.innerHTML = `<div class="box empty"><b>Your feed is ready</b>Share a coaching insight, or connect with other coaches to see their posts here.
        <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="pill solid sm" id="btnFirst">Write the first post</button><a class="pill sm" href="network">Find coaches</a></div></div>`;
      $('btnFirst').onclick = openComposer;
    }
    feed.insertAdjacentHTML('beforeend', posts.map((p) => FLPosts.render(p)).join(''));
    if (posts.length) oldest = scope === 'saved' && !tag ? posts[posts.length - 1].saved_at : posts[posts.length - 1].created_at;
    if (posts.length < 12) { done = true; $('more').hidden = !oldest; $('more').textContent = oldest ? 'You\'re all caught up.' : ''; }
    else $('more').hidden = false;
  }

  // ---- left: mini profile + learning ----
  const [{ data: enr }, cnt] = await Promise.all([qEnr, qCnt]);
  const courses = (enr || []).filter((c) => c.courses);
  let learn = '';
  if (courses.length) {
    const { data: prog } = await qProg;
    learn = `<div class="box"><div class="box-head" style="padding-bottom:8px"><h3 style="font-size:15px">Your learning</h3></div>
      ${courses.map((c) => { const done = (prog || []).filter((p) => p.course_id === c.course_id).length, tot = c.courses.total_days, pct = Math.round(done / tot * 100);
        return `<a class="ent" href="courses?c=${encodeURIComponent(c.courses.slug)}" style="padding:10px 16px;color:var(--bone)"><span class="sq">${FL.icon('courses', 20)}</span>
          <span class="ent-main"><b class="t-sm" style="display:block;line-height:1.3">${FL.esc(c.courses.title)}</b>
          <span class="cprog" style="margin:6px 0 0"><span class="progress"><i style="width:${pct}%"></i></span><span class="t-xs muted">${done}/${tot}</span></span></span></a>`; }).join('')}</div>`;
  }
  $('left').innerHTML = FL.miniProfile(me, { connections: cnt.data ?? 0, courses: courses.length }) + learn;

  // ---- right: suggestions + academy ----
  const [{ data: sugg }, { data: pgs }, { data: jobs }, { data: trend }] = await Promise.all([
    sb.rpc('suggest_people', { p_limit: 3, p_offset: 0 }),
    sb.rpc('suggested_pages', { p_limit: 3 }),
    qJobs,
    sb.rpc('trending_tags', { p_days: 14, p_limit: 8 })]);
  $('right').innerHTML = `
    <div class="box"><div class="box-head" style="padding-bottom:4px"><h3 style="font-size:16px">Grow your network</h3></div>
      ${(sugg || []).length ? sugg.map((p) => `<div class="ent" data-u="${FL.esc(p.username)}" style="padding:10px 16px">
          <a href="profile?u=${encodeURIComponent(p.username)}">${FL.ringAvatar(p, 'avatar sm')}</a>
          <div class="ent-main"><a class="ent-name" style="font-size:14px" href="profile?u=${encodeURIComponent(p.username)}">${FL.esc(p.full_name)}${FL.tags(p)}</a>
          <div class="ent-sub" style="font-size:12px">${FL.esc(p.headline || '')}</div>
          ${(p.reasons || [])[0] ? `<div class="t-xs muted" style="margin-top:2px">${FL.esc(p.reasons[0])}</div>` : ''}
          <div class="ent-act" style="margin-top:6px"><button class="pill ghost sm" data-connect="${FL.esc(p.username)}" data-name="${FL.esc(p.full_name)}">${FL.icon('plus', 16)}Connect</button></div></div></div>`).join('')
        : '<p class="t-sm muted" style="padding:0 16px 14px">You\'re connected with everyone we\'d suggest right now.</p>'}
      <div class="box-foot"><a href="network">View all suggestions →</a></div></div>
    ${(jobs || []).length ? `<div class="box"><div class="box-head" style="padding-bottom:4px"><h3 style="font-size:16px">Jobs for you</h3></div>
      ${jobs.map((j) => `<a class="ent" href="jobs?job=${j.id}" style="padding:10px 16px;color:inherit">${FL.pageLogo(j.page, 'co-logo sm')}<div class="ent-main">
        <b style="font-size:14px;color:var(--lime);display:block;line-height:1.3">${FL.esc(j.title)}</b><div class="ent-sub" style="font-size:12px">${FL.esc(j.page.name)}${j.city ? ' · ' + FL.esc(j.city) : ''}</div>
        <div class="t-xs" style="font-weight:700;margin-top:2px">${FL.pay(j)}</div>${j.why ? `<div class="t-xs muted">${FL.esc(j.why)}</div>` : ''}</div></a>`).join('')}
      <div class="box-foot"><a href="jobs?tab=foryou">See all jobs for you →</a></div></div>` : ''}
    ${(pgs || []).length ? `<div class="box"><div class="box-head" style="padding-bottom:4px"><h3 style="font-size:16px">Pages to follow</h3></div>
      ${pgs.map((g) => `<div class="ent" style="padding:10px 16px"><a href="company?p=${encodeURIComponent(g.slug)}">${FL.pageLogo(g, 'co-logo sm')}</a><div class="ent-main">
        <a class="ent-name" style="font-size:14px" href="company?p=${encodeURIComponent(g.slug)}">${FL.esc(g.name)}${FL.tick(g.verified, 14)}</a>
        <div class="ent-sub" style="font-size:12px">${FL.esc(g.reason || (g.kind_label + ' · ' + g.followers + ' follower' + (g.followers === 1 ? '' : 's')))}</div>
        <div class="ent-act" style="margin-top:6px"><button class="pill ghost sm" data-follow="${g.page_id}">${FL.icon('plus', 16)}Follow</button></div></div></div>`).join('')}
      <div class="box-foot"><a href="company">Browse pages →</a></div></div>` : ''}
    ${(trend || []).length ? `<div class="box"><div class="box-head" style="padding-bottom:4px"><h3 style="font-size:16px">Trending topics</h3></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 16px">${trend.map((t) => `<a class="chip" href="feed?tag=${encodeURIComponent(t.tag)}">#${FL.esc(t.tag)} <span class="muted">${t.posts}</span></a>`).join('')}</div></div>` : ''}
    <div class="box box-pad"><div class="eyebrow" style="font-size:10px">The Fit Lab Academy</div>
      <p class="t-sm" style="margin:8px 0 12px;line-height:1.5">Earn verified certificates, climb the star ratings and get found by gyms on the Hire-a-Coach portal.</p>
      <a class="pill sm" href="courses">Browse courses</a></div>
    ${FL.siteFootHtml(true)}`;
  FL.wireCommon($('right'));
  $('right').addEventListener('click', async (e) => {
    const f = e.target.closest('[data-follow]');
    if (f) { const r = await FL.call('follow_page', { p_page: f.dataset.follow }); if (r) { f.innerHTML = r.following ? 'Following' : FL.icon('plus', 16) + 'Follow'; } return; }
    const b = e.target.closest('[data-connect]'); if (!b) return;
    const r = await FL.connect(b.dataset.connect, b.dataset.name);
    if (r) b.outerHTML = `<span class="chip">${FL.icon('clock', 14)}Pending</span>`;
  });

  FL.showEntryPopups(courses.length ? courses[0].course_id : null);
})();
</script>
</body>
</html>
