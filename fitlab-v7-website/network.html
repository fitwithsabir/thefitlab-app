<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Network — The Fit Lab</title>
<script src="assets/theme.js"></script>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fit Lab">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .mn a{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;color:var(--ash);font-size:14px;font-weight:600}
  .mn a:hover{background:var(--hover);color:var(--bone);text-decoration:none}
  .mn a.on{color:var(--lime);background:var(--accent-soft)}
  .mn a b{color:var(--bone);font-weight:700}
  .inv-note{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--panel-2);font-size:13.5px;line-height:1.5;border:1px solid var(--line)}
  .conn-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:4px 20px 12px;flex-wrap:wrap}
  .conn-tools input{max-width:280px;height:36px;font-size:14px}
  .catbar{display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
  .catbar::-webkit-scrollbar{display:none}
  .catbar button{flex:none;height:32px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--bone);font:600 13px var(--body);padding:0 12px;cursor:pointer;white-space:nowrap}
  .catbar button.on{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
  .catbar button i{font-style:normal;opacity:.7;margin-left:4px}
  .pcard .x{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;cursor:pointer}
  .pcard{position:relative}
  .pcard .why{display:flex;flex-direction:column;gap:2px}
  .pcard .why span{display:block}
  .sug-sec h3{font-size:16px;margin:0}
  .inv-tag{height:32px;font-size:13px;width:auto;max-width:190px;padding-top:0;padding-bottom:0}
  @media (max-width:767px){ .mn-mobile{display:block} .col-nav{display:none} }
  @media (min-width:768px){ .mn-mobile{display:none} }
</style>
</head>
<body data-page="network">
<main class="page">
  <div class="layout l-side-main">
    <aside class="col-nav"><div class="sticky-col">
      <div class="box mn"><div class="box-head" style="padding-bottom:8px"><h3 style="font-size:16px">Manage my network</h3></div>
        <a href="#invitations" data-v="invitations">Invitations <b id="nInv">0</b></a>
        <a href="#connections" data-v="connections">Connections <b id="nConn">0</b></a>
        <a href="#sent" data-v="sent">Sent <b id="nSent">0</b></a>
        <a href="#requests" data-v="requests">Service requests <b id="nReq">0</b></a>
        <a href="#grow" data-v="grow">Grow your network</a>
        <a href="company.html">Pages</a>
        <a href="settings.html#blocked">Blocked members</a>
      </div>
      <div id="footL"></div>
    </div></aside>

    <section class="stack">
      <div class="box mn-mobile"><div class="utabs" id="mtabs">
        <a href="#grow" data-v="grow">Grow</a><a href="#invitations" data-v="invitations">Invitations</a>
        <a href="#connections" data-v="connections">Connections</a><a href="#requests" data-v="requests">Requests</a><a href="#sent" data-v="sent">Sent</a><a href="company.html">Pages</a></div></div>
      <div id="notice"></div>
      <div id="view"><div class="box skeleton" style="height:320px"></div></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = FL.esc;
  const session = await FL.requireAuth(); if (!session) return;
  let me; try { me = await FL.getProfile(); } catch (e) { return FL.toast(FL.friendly(e), 'err'); }
  if (!me.profile_completed) return location.replace('register.html');
  FL.renderHeader(me);
  $('notice').innerHTML = FL.communityNotice(me);
  $('footL').innerHTML = FL.siteFootHtml(true); FL.wireCommon($('footL'));

  let pending = [], accepted = [], reqs = { incoming: [], outgoing: [] };
  const view = $('view');
  const plink = (u) => `profile.html?u=${encodeURIComponent(u)}`;

  async function loadLists() {
    const [p, a, r] = await Promise.all([sb.rpc('list_connections', { p_status: 'pending' }), sb.rpc('list_connections', { p_status: 'accepted' }), sb.rpc('my_service_requests')]);
    pending = p.data || []; accepted = a.data || []; reqs = r.data || { incoming: [], outgoing: [] };
    $('nReq').textContent = reqs.incoming.filter((x) => x.status === 'new').length;
    $('nInv').textContent = pending.filter((c) => c.direction === 'incoming').length;
    $('nSent').textContent = pending.filter((c) => c.direction === 'outgoing').length;
    $('nConn').textContent = accepted.length;
  }

  const row = (c, actions, extra = '') => `<div class="ent">
      <a href="${plink(c.username)}">${FL.avatarHtml(c, 'avatar')}</a>
      <div class="ent-main"><a class="ent-name" href="${plink(c.username)}">${esc(c.full_name || '@' + c.username)}</a>
        <div class="ent-sub">${esc(c.headline || '')}</div>
        <div class="ent-meta">${c.city ? esc(c.city) + ' · ' : ''}${FL.timeAgo(c.created_at)} ago</div>${extra}</div>
      <div class="ent-act" style="margin:0">${actions}</div></div>`;

  async function show(v) {
    document.querySelectorAll('[data-v]').forEach((a) => a.classList.toggle('on', a.dataset.v === v));
    if (v === 'invitations') {
      const inc = pending.filter((c) => c.direction === 'incoming');
      view.innerHTML = `<div class="box"><div class="box-head"><h2>Invitations</h2><span class="sub">${inc.length}</span></div>
        ${inc.length ? inc.map((c) => row(c, `<select class="inv-tag" data-invtag="${c.connection_id}" aria-label="How do you know them?">${FL.tagOptions('', 'How you know them')}</select><button class="txt-btn" data-dec="${c.connection_id}">Ignore</button><button class="pill sm" data-acc="${c.connection_id}" data-uid="${c.user_id}">Accept</button>`,
            c.note ? `<div class="inv-note">“${esc(c.note)}”</div>` : '')).join('')
          : '<div class="empty"><b>No pending invitations</b>When coaches invite you to connect, you\'ll see them here.</div>'}</div>`;
    } else if (v === 'requests') {
      const ST = { new: 'Waiting for a reply', accepted: 'Accepted', declined: 'Declined' };
      const inc = reqs.incoming, out = reqs.outgoing;
      const card = (x, mine) => `<div class="ent"><a href="${plink(x.member.username)}">${FL.ringAvatar(x.member, 'avatar')}</a>
          <div class="ent-main"><a class="ent-name" href="${plink(x.member.username)}">${esc(x.member.full_name)}${FL.tags(x.member)}</a>
            <div class="ent-sub">${esc(x.member.headline || '')}</div>
            <div class="ent-meta">${esc(x.service)} · ${FL.timeAgo(x.created_at)} ago · ${ST[x.status]}</div>
            <div class="inv-note">“${esc(x.goal)}”${x.preferred ? `<br><span class="t-xs muted">Preferred: ${esc(x.preferred)}</span>` : ''}</div>
            ${!mine && x.status === 'new' ? `<div class="ent-act"><button class="pill sm" data-racc="${x.id}">Accept</button><button class="txt-btn" data-rdec="${x.id}">Decline</button></div>`
              : x.status === 'accepted' ? `<div class="ent-act"><a class="pill sm" href="messaging.html?u=${encodeURIComponent(x.member.username)}">Message</a></div>` : ''}</div></div>`;
      view.innerHTML = `<div class="box"><div class="box-head"><div><h2>Service requests</h2><div class="sub">Clients asking about the services on your profile. Accepting opens a conversation.</div></div></div>
          ${inc.length ? inc.map((x) => card(x, false)).join('') : `<div class="empty"><b>No requests yet</b>Add services to your profile — training packages, consultations, diet plans — and clients can request them here. <a href="profile.html">Add a service</a></div>`}</div>
        ${out.length ? `<div class="box"><div class="box-head"><h2>Requests you sent</h2></div>${out.map((x) => card(x, true)).join('')}</div>` : ''}`;
    } else if (v === 'sent') {
      const out = pending.filter((c) => c.direction === 'outgoing');
      view.innerHTML = `<div class="box"><div class="box-head"><h2>Sent invitations</h2><span class="sub">${out.length} of 50 allowed</span></div>
        ${out.length ? out.map((c) => row(c, `<button class="pill ghost sm" data-wd="${c.connection_id}">Withdraw</button>`)).join('')
          : '<div class="empty"><b>No invitations waiting</b>Invitations you send appear here until they\'re answered.</div>'}</div>`;
    } else if (v === 'connections') {
      view.innerHTML = `<div class="box"><div class="box-head"><h2>${accepted.length} connection${accepted.length === 1 ? '' : 's'}</h2></div>
        <div class="catbar" id="cats"></div>
        <div class="conn-tools"><input id="cq" type="search" placeholder="Search by name, city or headline">
          <select id="csort" class="inv-tag" aria-label="Sort"><option value="recent">Recently added</option><option value="name">Name</option></select></div>
        <div id="clist"><div class="skeleton" style="height:60px;margin:14px"></div></div></div>`;
      let tag = null;
      const drawCats = async () => {
        const { data: ct } = await sb.rpc('connection_tag_counts');
        const t = (ct && ct.tags) || {};
        $('cats').innerHTML = [['', 'All', ct ? ct.all : accepted.length]].concat(FL.CONN_TAGS.filter(([k]) => t[k]).map(([k, l]) => [k, l, t[k]]))
          .concat(ct && ct.none && ct.none !== ct.all ? [['none', 'No category', ct.none]] : [])
          .map(([k, l, n]) => `<button data-cat="${k}" class="${(tag || '') === k ? 'on' : ''}">${esc(l)}<i>${n}</i></button>`).join('');
      };
      const draw = async () => {
        const { data } = await sb.rpc('list_network', { p_tag: tag, p_q: $('cq').value.trim() || null, p_sort: $('csort').value });
        const list = data || [];
        $('clist').innerHTML = list.length ? list.map((c) => `<div class="ent">
            <a href="${plink(c.username)}">${FL.ringAvatar(c, 'avatar')}</a>
            <div class="ent-main"><a class="ent-name" href="${plink(c.username)}">${esc(c.full_name)}${FL.tags(c)}</a>
              <div class="ent-sub">${esc(c.headline || '')}</div>
              <div class="ent-meta">${c.city ? esc(c.city) + ' · ' : ''}connected ${FL.timeAgo(c.since)} ago</div>
              <button class="txt-btn tagbtn" data-settag="${c.user_id}" data-name="${esc(c.full_name)}" data-cur="${esc(c.tag || '')}">${FL.icon('tag', 13)}${c.tag_label ? esc(c.tag_label) : 'Add category'}</button></div>
            <div class="ent-act" style="margin:0"><a class="pill sm" href="messaging.html?u=${encodeURIComponent(c.username)}">Message</a>
              <button class="icon-btn" data-cm="${c.connection_id}" data-name="${esc(c.full_name)}" aria-label="Remove connection">${FL.icon('more', 20)}</button></div></div>`).join('')
          : `<div class="empty">${tag || $('cq').value.trim() ? 'No connections match.' : '<b>No connections yet</b>Start with the suggestions under “Grow your network”.'}</div>`;
      };
      $('cats').onclick = (e) => { const b = e.target.closest('[data-cat]'); if (!b) return; tag = b.dataset.cat || null; drawCats(); draw(); };
      let tmr; $('cq').oninput = () => { clearTimeout(tmr); tmr = setTimeout(draw, 250); };
      $('csort').onchange = draw;
      view._redraw = () => { drawCats(); draw(); };
      drawCats(); draw();
    } else {
      view.innerHTML = `<div id="sugs"><div class="box"><div class="box-head"><h2>Grow your network</h2></div><div class="pgrid">${'<div class="pcard skeleton" style="height:250px"></div>'.repeat(4)}</div></div></div>
        <div class="box" id="pagesBox" hidden><div class="box-head"><div><h2>Pages to follow</h2><div class="sub">Gyms, clinics and brands picked for you</div></div><a class="txt-btn" href="company.html">See all</a></div><div id="sugPages"></div></div>`;
      const [{ data }, { data: pg }] = await Promise.all([sb.rpc('suggest_people', { p_limit: 40, p_offset: 0 }), sb.rpc('suggested_pages', { p_limit: 5 })]);
      const list = data || [];
      const GROUPS = [['candidates', 'Candidates for your open roles', 'Open to work and a fit for the jobs you\'re hiring for'],
        ['hiring', 'Hiring in your field', 'Gyms, clinics and recruiters with roles that fit you'],
        ['workplace', 'From your workplace', 'People at the gyms and clinics you work with'],
        ['partners', 'Professionals to partner with', 'People whose work fits with yours — for referrals and teamwork'],
        ['people', 'People you may know', 'Mutual connections, your city and the Academy']];
      const card = (p) => `<div class="pcard" data-card="${esc(p.username)}">
          <button class="x" data-dismiss="${p.user_id}" aria-label="Not now" title="Not now">${FL.icon('close', 15)}</button>
          <div class="cov" ${p.cover_url ? `style="background-image:url('${esc(p.cover_url)}')"` : ''}></div>
          <a href="${plink(p.username)}">${FL.ringAvatar(p, 'avatar')}</a>
          <a class="nm" href="${plink(p.username)}">${esc(p.full_name)}${FL.tags(p)}</a>
          <p class="hl">${esc(p.headline || p.profession_label || 'Fit Lab member')}</p>
          <p class="why">${(p.reasons || []).slice(0, 2).map((r) => `<span>${esc(r)}</span>`).join('') || '<span>Fit Lab member</span>'}</p>
          <button class="pill" data-connect="${esc(p.username)}" data-name="${esc(p.full_name)}">${FL.icon('userplus', 17)}Connect</button>
        </div>`;
      const by = (g) => list.filter((p) => (['mutual', 'local', 'classmates', 'more'].includes(p.group) ? 'people' : p.group) === g);
      const html = GROUPS.map(([g, h, sub]) => { const xs = by(g); return xs.length ? `<div class="box sug-sec"><div class="box-head"><div><h3>${h}</h3><div class="sub">${sub}</div></div></div>
          <div class="pgrid">${xs.slice(0, g === 'people' ? 24 : 8).map(card).join('')}</div></div>` : ''; }).join('');
      $('sugs').innerHTML = html || '<div class="box"><div class="empty"><b>No new suggestions</b>Use the search bar at the top to find people by name, profession, city or skill.</div></div>';
      if ((pg || []).length) {
        $('pagesBox').hidden = false;
        $('sugPages').innerHTML = pg.map((g) => `<div class="ent"><a href="company.html?p=${encodeURIComponent(g.slug)}">${FL.pageLogo(g)}</a>
          <div class="ent-main"><a class="ent-name" href="company.html?p=${encodeURIComponent(g.slug)}">${esc(g.name)}${FL.tick(g.verified, 14)}</a>
            <div class="ent-sub">${esc(g.reason || '')}</div><div class="ent-meta">${esc([g.kind_label, g.city].filter(Boolean).join(' · '))} · ${g.followers} follower${g.followers === 1 ? '' : 's'}</div></div>
          <div class="ent-act" style="margin:0"><button class="pill sm" data-follow="${g.page_id}">${FL.icon('plus', 15)}Follow</button>
            <button class="icon-btn" data-dismiss="${g.page_id}" data-kind="page" aria-label="Not now">${FL.icon('close', 16)}</button></div></div>`).join('');
      }
    }
  }

  view.addEventListener('click', async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.dismiss) {
      await FL.call('dismiss_suggestion', { p_target: t.dataset.dismiss, p_kind: t.dataset.kind || 'person' }, { quiet: true });
      const el = t.closest('.pcard,.ent'); if (el) { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }
      return;
    }
    if (t.dataset.follow) { const r = await FL.call('follow_page', { p_page: t.dataset.follow }); if (r) { t.classList.toggle('ghost', r.following); t.innerHTML = r.following ? 'Following' : FL.icon('plus', 15) + 'Follow'; } return; }
    if (t.dataset.settag) { const r = await FL.tagConnection(t.dataset.settag, t.dataset.name, t.dataset.cur || null); if (r && view._redraw) view._redraw(); return; }
    if (t.dataset.racc || t.dataset.rdec) {
      const accept = !!t.dataset.racc;
      FL.busy(t, true, '');
      const r = await FL.call('respond_service_request', { p_id: t.dataset.racc || t.dataset.rdec, p_accept: accept });
      FL.busy(t, false);
      if (!r) return;
      FL.toast(accept ? 'Accepted — you can now message each other' : 'Declined — they\'ve been told kindly', 'ok');
      await loadLists(); show('requests'); FL.refreshCounts(); return;
    }
    if (t.dataset.acc || t.dataset.dec) {
      const accept = !!t.dataset.acc;
      FL.busy(t, true, '');
      const r = await FL.call('respond_connection_request', { p_id: t.dataset.acc || t.dataset.dec, p_accept: accept });
      FL.busy(t, false);
      if (!r) return;
      if (accept) { const sel = view.querySelector(`[data-invtag="${t.dataset.acc}"]`); if (sel && sel.value) await FL.call('set_connection_tag', { p_other: t.dataset.uid, p_tag: sel.value }, { quiet: true }); }
      FL.toast(accept ? 'Connected' : 'Invitation ignored', 'ok');
      await loadLists(); show('invitations'); FL.refreshCounts();
    } else if (t.dataset.wd) {
      const r = await FL.call('cancel_connection_request', { p_id: t.dataset.wd });
      if (r) { FL.toast('Invitation withdrawn', 'ok'); await loadLists(); show('sent'); }
    } else if (t.dataset.connect) {
      const r = await FL.connect(t.dataset.connect, t.dataset.name);
      if (r) { t.outerHTML = `<span class="chip" style="margin:12px auto 14px">${FL.icon('clock', 14)}Pending</span>`; await loadLists(); }
    } else if (t.dataset.cm) {
      const ok = await FL.confirm('Remove connection', `Remove ${t.dataset.name} from your connections? You won't be able to message each other until you reconnect.`, 'Remove', true);
      if (!ok) return;
      const r = await FL.call('remove_connection', { p_id: t.dataset.cm });
      if (r) { FL.toast('Connection removed', 'ok'); await loadLists(); show('connections'); }
    }
  });

  await loadLists();
  const route = () => {
    let v = (location.hash || '').slice(1);
    if (!['invitations', 'connections', 'sent', 'grow', 'requests'].includes(v)) v = pending.some((c) => c.direction === 'incoming') ? 'invitations' : reqs.incoming.some((x) => x.status === 'new') ? 'requests' : 'grow';
    show(v);
  };
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
