<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Profile — The Fit Lab</title>
<script src="assets/theme.js"></script>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fit Lab">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .acts-menu{position:relative}
  .add-sec{position:relative}
  .ent .ed{margin-left:auto}
  .cred-img{width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
  .act-posts .post{border:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line)}
  .fl-cert-sq{background:var(--accent-soft)!important;color:var(--lime)!important;border-color:var(--accent-line)!important}
  .skill-add{display:flex;gap:8px;padding:0 20px 14px}
  .skill-add input{height:38px;font-size:14px}
  .vis-note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ash);line-height:1.5}
  .pv-unavail{padding:40px 20px;text-align:center}
  .ph-prof{margin:4px 0 0;font-size:14px;color:var(--ash)}
  .spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .ph-views{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;font-weight:600}
  .svc-list{padding:0 20px 18px}
  .svc .meta{font-size:12.5px;color:var(--ash)}
  .svc .price{font-weight:700;color:var(--bone)}
  .org-row{display:flex;gap:12px;padding:10px 20px;border-top:1px solid var(--line);align-items:center}
</style>
</head>
<body data-page="profile">
<main class="page">
  <div class="layout l-main-side">
    <section class="stack" id="main"><div class="box skeleton" style="height:380px"></div><div class="box skeleton" style="height:160px"></div></section>
    <aside><div class="sticky-col" id="side"></div></aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/bookings.js"></script>
<script src="assets/posts.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = FL.esc, I = FL.icon;
  const session = await FL.requireAuth(); if (!session) return;
  let me; try { me = await FL.getProfile(); } catch (e) { return FL.toast(FL.friendly(e), 'err'); }
  if (!me.profile_completed) return location.replace('register');
  FL.renderHeader(me);
  const target = (FL.param('u') || me.username || '').replace(/^@/, '').trim();
  let p = null, posts = [], orgPages = [];
  const PROFS = await FL.professions();

  // ------------------------------------------------------------ helpers
  const monthVal = (d) => d ? String(d).slice(0, 7) : '';
  const monthToDate = (m) => m ? m + '-01' : null;
  const isSelf = () => p && p.is_self;
  const editBtn = (act, id = '', label = 'Edit') => isSelf() ? `<button class="icon-btn" data-ed="${act}" data-id="${id}" aria-label="${label}" title="${label}">${I('edit', 19)}</button>` : '';
  const addBtn = (act, label) => isSelf() ? `<button class="icon-btn" data-ed="${act}" aria-label="${label}" title="${label}">${I('plus', 22)}</button>` : '';

  // generic form modal
  function formModal({ title, fields, values = {}, onSave, onDelete, wide = false }) {
    const fieldHtml = (f) => {
      const v = values[f.k] ?? f.def ?? '';
      const lbl = `<label for="f_${f.k}" class="${f.req ? 'req' : ''}">${esc(f.label)}</label>`;
      let input;
      if (f.type === 'textarea') input = `<textarea id="f_${f.k}" maxlength="${f.max || 2000}" placeholder="${esc(f.ph || '')}" style="min-height:${f.rows || 120}px">${esc(v)}</textarea>`;
      else if (f.type === 'select') input = `<select id="f_${f.k}">${f.optionsHtml || f.options.map(([ov, ol]) => `<option value="${esc(ov)}" ${String(v) === String(ov) ? 'selected' : ''}>${esc(ol)}</option>`).join('')}</select>`;
      else if (f.type === 'checkbox') return `<label class="check" style="margin-bottom:12px;color:var(--bone)"><input type="checkbox" id="f_${f.k}" ${v ? 'checked' : ''}><span>${esc(f.label)}</span></label>`;
      else input = `<input id="f_${f.k}" type="${f.type || 'text'}" value="${esc(v)}" maxlength="${f.max || 200}" placeholder="${esc(f.ph || '')}" ${f.min ? `min="${f.min}"` : ''} ${f.maxv ? `max="${f.maxv}"` : ''}>`;
      return `<div class="field" ${f.half ? 'data-half' : ''}>${lbl}${input}${f.help ? `<span class="help">${esc(f.help)}</span>` : ''}</div>`;
    };
    // pair up "half" fields into two-column rows
    let body = '', buf = [];
    for (const f of fields) { if (f.half) { buf.push(fieldHtml(f)); if (buf.length === 2) { body += `<div class="row2">${buf.join('')}</div>`; buf = []; } } else { if (buf.length) { body += `<div class="row2">${buf.join('')}</div>`; buf = []; } body += fieldHtml(f); } }
    if (buf.length) body += `<div class="row2">${buf.join('')}</div>`;
    const m = FL.modal({ title, wide, body: `<p class="t-xs muted" style="margin:0 0 12px">* Indicates required</p>${body}<div class="err hidden" id="fErr"></div>`,
      foot: `${onDelete ? `<button class="pill ghost left" data-del style="color:var(--danger-text);border-color:var(--line-2)">Delete</button>` : ''}<button class="pill solid" data-save>Save</button>` });
    const read = () => Object.fromEntries(fields.map((f) => { const el = m.q('#f_' + f.k); return [f.k, f.type === 'checkbox' ? el.checked : el.value.trim()]; }));
    m.q('[data-save]').onclick = async (e) => {
      const vals = read(); const err = m.q('#fErr');
      const missing = fields.find((f) => f.req && !vals[f.k]);
      if (missing) { err.textContent = `${missing.label} is required.`; err.classList.remove('hidden'); return; }
      FL.busy(e.target, true, 'Saving…');
      try { const ok = await onSave(vals, m); if (ok !== false) { m.close(); FL.toast('Saved', 'ok'); await reload(); } }
      catch (ex) { err.textContent = FL.friendly(ex); err.classList.remove('hidden'); }
      finally { FL.busy(e.target, false); }
    };
    if (onDelete) m.q('[data-del]').onclick = async () => {
      if (!(await FL.confirm('Delete?', 'This entry will be removed from your profile.', 'Delete', true))) return;
      try { await onDelete(); FL.toast('Deleted', 'ok'); m.close(); await reload(); } catch (ex) { FL.toast(FL.friendly(ex), 'err'); }
    };
    return m;
  }
  const must = ({ error }) => { if (error) throw error; };

  // ------------------------------------------------------------ editors
  const EMP = [['', 'Please select'], ['Full-time', 'Full-time'], ['Part-time', 'Part-time'], ['Self-employed', 'Self-employed'], ['Freelance', 'Freelance'], ['Contract', 'Contract'], ['Internship', 'Internship'], ['Apprenticeship', 'Apprenticeship']];
  const editors = {
    intro() {
      formModal({ title: 'Edit intro', wide: true, values: { ...me, open_to_work: me.open_to_work, specialties: (me.specialties || []).join(', ') }, fields: [
        { k: 'full_name', label: 'Full name', req: true, max: 80, help: 'As it should appear on your certificate.' },
        { k: 'headline', label: 'Headline', req: true, max: 160, ph: 'e.g. Strength & Conditioning Coach · PCOS & fat-loss specialist' },
        { k: 'profession', label: 'Profession', req: true, type: 'select', optionsHtml: FL.professionOptions(PROFS, me.profession), half: true },
        { k: 'specialties', label: 'Specialties', max: 300, ph: 'e.g. PCOS, Post-natal, Sports rehab', help: 'Up to 10, separated by commas.', half: true },
        { k: 'username', label: 'Username', max: 30, help: 'Letters and numbers only. Used for your profile link, search and sign-in.', half: true },
        { k: 'occupation', label: 'Current position', max: 120, ph: 'e.g. Head Coach at Shaan Fitness', half: true },
        { k: 'city', label: 'City', max: 60, half: true }, { k: 'district', label: 'District', max: 60, half: true },
        { k: 'country', label: 'Country/Region', max: 60, half: true },
        { k: 'experience_level', label: 'Coaching experience', type: 'select', options: [['', 'Select'], ['beginner', 'Beginner / aspiring coach'], ['1-3 years', '1–3 years'], ['3+ years', '3+ years']], half: true },
        { k: 'date_of_birth', label: 'Date of birth (private)', type: 'date', half: true },
        { k: 'phone', label: 'Mobile (private — only the Academy sees it)', type: 'tel', max: 20, half: true },
        { k: 'open_to_work', label: 'Show #OpenToWork — I\'m looking for a role (green photo frame, and I appear in employers\' searches)', type: 'checkbox' },
        { k: 'hiring', label: 'Show #Hiring — I\'m recruiting for my team (purple photo frame)', type: 'checkbox' },
      ], onSave: async (v) => {
        const un = v.username.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (un && un !== me.username) {
          const { data: av } = await sb.rpc('username_available', { p_username: un });
          if (av && !av.ok) throw new Error('Username: ' + av.reason);
        }
        must(await sb.from('profiles').update({ full_name: v.full_name, headline: v.headline, username: un || undefined, occupation: v.occupation || null,
          city: v.city || null, district: v.district || null, country: v.country || null, experience_level: v.experience_level || null,
          date_of_birth: v.date_of_birth || null, phone: v.phone || null, open_to_work: v.open_to_work, hiring: v.hiring,
          profession: v.profession || null, specialties: [...new Set(v.specialties.split(',').map((x) => x.trim()).filter(Boolean).map((x) => x.slice(0, 40)))].slice(0, 10) }).eq('id', me.id));
        me = await FL.getProfile(true);
        if (un && un !== target) history.replaceState(null, '', 'profile?u=' + encodeURIComponent(me.username));
      } });
    },
    about() {
      formModal({ title: 'Edit about', wide: true, values: { bio: me.bio }, fields: [
        { k: 'bio', label: 'About', type: 'textarea', max: 2000, rows: 220, ph: 'Who you coach, how you coach, what results you get — and your goal for this course.',
          help: 'Your daily course emails are personalised from what you write here.' }],
        onSave: async (v) => { must(await sb.from('profiles').update({ bio: v.bio || null }).eq('id', me.id)); me = await FL.getProfile(true); } });
    },
    exp(id) {
      const x = (p.experience || []).find((e) => e.id === id) || {};
      if (x.page) orgPages = [x.page];
      const m = formModal({ title: id ? 'Edit experience' : 'Add experience', wide: true,
        values: { ...x, start_date: monthVal(x.start_date), end_date: monthVal(x.end_date), current: id ? !x.end_date : true }, fields: [
        { k: 'title', label: 'Title', req: true, max: 100, ph: 'e.g. Personal Trainer' },
        { k: 'employment_type', label: 'Employment type', type: 'select', options: EMP, half: true },
        { k: 'organization', label: 'Gym / clinic / company', req: true, max: 120, ph: 'e.g. Shaan Fitness', half: true, help: 'Pick the organisation\'s page from the list to show its logo and appear on its People tab.' },
        { k: 'location', label: 'Location', max: 100, ph: 'e.g. Kakinada, Andhra Pradesh' },
        { k: 'current', label: 'I currently work in this role', type: 'checkbox' },
        { k: 'start_date', label: 'Start date', type: 'month', req: true, half: true },
        { k: 'end_date', label: 'End date', type: 'month', half: true, help: 'Leave empty if current.' },
        { k: 'description', label: 'Description', type: 'textarea', max: 1500, ph: 'Clients you coach, programmes you run, results.' }],
        onSave: async (v) => {
          const pageHit = orgPages.find((x) => x.name.toLowerCase() === v.organization.toLowerCase());
          const row = { title: v.title, organization: v.organization, employment_type: v.employment_type || null, location: v.location || null,
            start_date: monthToDate(v.start_date), end_date: v.current ? null : monthToDate(v.end_date), description: v.description || null,
            page_id: pageHit ? pageHit.page_id : null };
          if (row.end_date && row.end_date < row.start_date) throw new Error('End date can\'t be before the start date.');
          must(id ? await sb.from('work_experience').update(row).eq('id', id) : await sb.from('work_experience').insert({ ...row, user_id: me.id }));
        },
        onDelete: id ? async () => must(await sb.from('work_experience').delete().eq('id', id)) : null });
      // suggest organisation pages as you type
      const org = m.q('#f_organization');
      org.setAttribute('list', 'orgList'); org.insertAdjacentHTML('afterend', '<datalist id="orgList"></datalist>');
      let tmr;
      const suggest = async () => {
        const q = org.value.trim(); if (q.length < 2) return;
        const { data } = await sb.rpc('search_pages', { p_q: q, p_kind: null, p_city: null, p_limit: 8 });
        orgPages = data || [];
        m.q('#orgList').innerHTML = orgPages.map((g) => `<option value="${esc(g.name)}">${esc([g.kind_label, g.city].filter(Boolean).join(' · '))}</option>`).join('');
      };
      org.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(suggest, 250); });
      if (org.value) suggest();
    },
    edu(id) {
      const x = (p.education || []).find((e) => e.id === id) || {};
      const yr = new Date().getFullYear();
      formModal({ title: id ? 'Edit education' : 'Add education', wide: true, values: x, fields: [
        { k: 'school', label: 'School / university / institute', req: true, max: 150, ph: 'e.g. Andhra University' },
        { k: 'degree', label: 'Degree / certificate', max: 120, ph: 'e.g. B.Sc, Diploma in Sports Nutrition', half: true },
        { k: 'field', label: 'Field of study', max: 120, ph: 'e.g. Physical Education', half: true },
        { k: 'start_year', label: 'Start year', type: 'number', min: 1950, maxv: yr + 6, half: true },
        { k: 'end_year', label: 'End year (or expected)', type: 'number', min: 1950, maxv: yr + 8, half: true },
        { k: 'grade', label: 'Grade', max: 40 },
        { k: 'description', label: 'Description', type: 'textarea', max: 1500 }],
        onSave: async (v) => {
          const row = { school: v.school, degree: v.degree || null, field: v.field || null, start_year: v.start_year ? +v.start_year : null,
            end_year: v.end_year ? +v.end_year : null, grade: v.grade || null, description: v.description || null };
          if (row.start_year && row.end_year && row.end_year < row.start_year) throw new Error('End year can\'t be before the start year.');
          must(id ? await sb.from('education').update(row).eq('id', id) : await sb.from('education').insert({ ...row, user_id: me.id }));
        },
        onDelete: id ? async () => must(await sb.from('education').delete().eq('id', id)) : null });
    },
    cred(id) {
      const x = (p.credentials || []).find((e) => e.id === id) || {};
      formModal({ title: id ? 'Edit license or certification' : 'Add license or certification', wide: true,
        values: { ...x, issue_date: monthVal(x.issue_date), expiry_date: monthVal(x.expiry_date) }, fields: [
        { k: 'name', label: 'Name', req: true, max: 150, ph: 'e.g. ACE Certified Personal Trainer' },
        { k: 'issuer', label: 'Issuing organization', req: true, max: 150, ph: 'e.g. American Council on Exercise' },
        { k: 'issue_date', label: 'Issue date', type: 'month', half: true },
        { k: 'expiry_date', label: 'Expiration date', type: 'month', half: true, help: 'Leave empty if it doesn\'t expire.' },
        { k: 'credential_id', label: 'Credential ID', max: 80, half: true },
        { k: 'ce_hours', label: 'CE / CPD hours', type: 'number', min: 0, maxv: 999, half: true, help: 'Continuing-education hours this earned, if any.' },
        { k: 'credential_url', label: 'Credential URL', type: 'url', max: 300, ph: 'https://' }],
        onSave: async (v) => {
          if (v.credential_url && !/^https?:\/\//i.test(v.credential_url)) throw new Error('Credential URL must start with https://');
          const row = { name: v.name, issuer: v.issuer, issue_date: monthToDate(v.issue_date), expiry_date: monthToDate(v.expiry_date),
            credential_id: v.credential_id || null, credential_url: v.credential_url || null,
            ce_hours: v.ce_hours !== '' && v.ce_hours != null ? Math.max(0, Math.min(999, +v.ce_hours)) : null };
          must(id ? await sb.from('credentials').update(row).eq('id', id) : await sb.from('credentials').insert({ ...row, user_id: me.id }));
        },
        onDelete: id ? async () => must(await sb.from('credentials').delete().eq('id', id)) : null });
    },
    skills() {
      const list = p.skills || [];
      const SUG = ['Strength Training', 'Hypertrophy', 'Fat Loss Coaching', 'Nutrition Coaching', 'Mobility', 'HIIT', 'HYROX Training', 'CrossFit',
        'Calisthenics', 'Boxing Conditioning', 'Functional Training', 'Injury Prevention', 'PCOS Programming', 'Diabetes Exercise Programming',
        'Senior Fitness', 'Pre & Postnatal Fitness', 'Client Assessment', 'Program Design', 'Sports Conditioning', 'Endurance Training', 'Group Training'];
      const m = FL.modal({ title: 'Skills', wide: true, body: `
        <div class="field"><label for="skIn">Add a skill</label><div style="display:flex;gap:8px"><input id="skIn" maxlength="60" placeholder="e.g. Strength Training" list="skSug">
          <button class="pill solid" id="skAdd">Add</button></div><datalist id="skSug">${SUG.map((s) => `<option value="${s}">`).join('')}</datalist>
          <span class="help">Up to 50. Your connections can endorse them.</span></div>
        <div class="chipbox" style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px" id="skQuick">${SUG.filter((s) => !list.some((x) => x.name.toLowerCase() === s.toLowerCase())).slice(0, 10)
          .map((s) => `<button class="chip" data-q="${s}">${I('plus', 13)}${s}</button>`).join('')}</div>
        <div id="skList"></div>` });
      const draw = () => { m.q('#skList').innerHTML = (p.skills || []).length ? p.skills.map((s) => `<div class="skill-row" style="padding:10px 0"><span><b>${esc(s.name)}</b>
          <span class="t-xs muted"> · ${s.count} endorsement${s.count === 1 ? '' : 's'}</span></span><button class="icon-btn" data-rm="${s.id}" aria-label="Remove ${esc(s.name)}">${I('trash', 18)}</button></div>`).join('')
        : '<p class="t-sm muted">No skills yet.</p>'; };
      draw();
      const add = async (name) => {
        name = (name || '').trim(); if (!name) return;
        const { error } = await sb.from('skills').insert({ user_id: me.id, name, sort_order: (p.skills || []).length });
        if (error) return FL.toast(/duplicate|unique/i.test(error.message) ? 'You already listed that skill' : FL.friendly(error), 'err');
        m.q('#skIn').value = ''; await reload(); draw();
      };
      m.q('#skAdd').onclick = () => add(m.q('#skIn').value);
      m.q('#skIn').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); add(e.target.value); } };
      m.q('#skQuick').onclick = (e) => { const b = e.target.closest('[data-q]'); if (b) { b.remove(); add(b.dataset.q); } };
      m.q('#skList').onclick = async (e) => { const b = e.target.closest('[data-rm]'); if (!b) return;
        const { error } = await sb.from('skills').delete().eq('id', b.dataset.rm); if (error) return FL.toast(FL.friendly(error), 'err'); await reload(); draw(); };
    },
    svc(id) {
      const x = (p.services || []).find((e) => e.id === id) || {};
      formModal({ title: id ? 'Edit service' : 'Add a service', wide: true, values: { ...x, active: id ? x.active : true }, fields: [
        { k: 'title', label: 'Service', req: true, max: 80, ph: 'e.g. 1-on-1 strength coaching · 12 sessions' },
        { k: 'mode', label: 'Where', type: 'select', options: Object.entries(MODES), half: true },
        { k: 'city', label: 'City', max: 80, half: true, def: me.city || '' },
        { k: 'price_from', label: 'Price from (₹, optional)', type: 'number', min: 0, half: true },
        { k: 'price_unit', label: 'Per', type: 'select', options: [['', '—']].concat(Object.entries(UNITS)), half: true },
        { k: 'description', label: 'What\'s included', type: 'textarea', max: 600, rows: 100, ph: 'Assessment, programme, check-ins, who it suits.' },
        { k: 'bookable', label: 'Clients can book a time and pay for this package', type: 'checkbox' },
        { k: 'book_price', label: 'Package price (₹, 0 = free)', type: 'number', min: 0, half: true, def: x.book_price ?? '' },
        { k: 'sessions', label: 'Sessions in the package', type: 'number', min: 1, maxv: 60, half: true, def: x.sessions || 1 },
        { k: 'session_min', label: 'Session length', type: 'select', options: [[15, '15 min'], [20, '20 min'], [30, '30 min'], [45, '45 min'], [60, '1 hour'], [75, '1 hour 15 min'], [90, '1 hour 30 min'], [120, '2 hours']], half: true, def: x.session_min || 60 },
        { k: 'valid_days', label: 'Use sessions within', type: 'select', options: [[30, '1 month'], [60, '2 months'], [90, '3 months'], [180, '6 months'], [365, '1 year']], half: true, def: x.valid_days || 90 },
        { k: 'active', label: 'Show this service on my profile', type: 'checkbox' }],
        onSave: async (v) => {
          const r = await FL.call('save_service', { p_id: id || null, p: v });
          if (!r) return false;
        },
        onDelete: id ? async () => { const r = await FL.call('delete_service', { p_id: id }); if (!r || !r.ok) throw new Error('Could not delete'); } : null });
    },
    async feat() {
      const { data: recent } = await sb.rpc('get_feed', { p_before: null, p_author: me.id, p_limit: 20 });
      const mine = (recent || []).filter((x) => x.status === 'visible' && x.kind !== 'milestone').slice(0, 10);
      const m = FL.modal({ title: 'Add to Featured', wide: true, body: `
        <div class="utabs" style="padding:0;margin:-6px 0 14px"><button class="on" data-ft="link">A link</button><button data-ft="post">One of my posts</button></div>
        <div id="ftLink"><div class="field"><label for="ftU">Link</label><input id="ftU" type="url" maxlength="500" placeholder="https://"></div>
          <div class="field"><label for="ftT">Title</label><input id="ftT" maxlength="120" placeholder="e.g. Client transformation: 12 weeks"></div></div>
        <div id="ftPost" hidden>${mine.length ? `<div class="radio-list">${mine.map((x, i) => `<label><input type="radio" name="ftp" value="${x.id}" ${i === 0 ? 'checked' : ''}><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(x.body)}</span></label>`).join('')}</div>`
          : '<p class="t-sm muted">Your recent posts appear here once you\'ve shared something.</p>'}</div>`,
        foot: `<button class="pill solid" data-ok>Add</button>` });
      let mode = 'link';
      m.qa('[data-ft]').forEach((b) => { b.onclick = () => { mode = b.dataset.ft; m.qa('[data-ft]').forEach((x) => x.classList.toggle('on', x === b)); m.q('#ftLink').hidden = mode !== 'link'; m.q('#ftPost').hidden = mode !== 'post'; }; });
      m.q('[data-ok]').onclick = async (e) => {
        const payload = mode === 'link' ? { url: m.q('#ftU').value.trim(), title: m.q('#ftT').value.trim() } : { post_id: (m.q('input[name=ftp]:checked') || {}).value };
        if (mode === 'post' && !payload.post_id) return;
        FL.busy(e.target, true, 'Adding…');
        const r = await FL.call('save_featured', { p: payload });
        FL.busy(e.target, false);
        if (r) { m.close(); FL.toast('Added to Featured', 'ok'); reload(); }
      };
    },
    social() {
      const cur = p.social || {};
      formModal({ title: 'Contact & social links', wide: true,
        values: Object.assign({ vis: p.social_visibility || 'everyone' }, Object.fromEntries(FL.SOCIAL.map(([k]) => [k, cur[k] || '']))),
        fields: FL.SOCIAL.map(([k, l, , ph]) => ({ k, label: l, max: 300, ph, half: true }))
          .concat([{ k: 'vis', label: 'Who can see these', type: 'select', options: [['everyone', 'Everyone on The Fit Lab'], ['connections', 'Only my connections']] }]),
        onSave: async (v) => {
          const links = Object.fromEntries(FL.SOCIAL.map(([k]) => [k, (v[k] || '').trim()]));
          const { data, error } = await sb.rpc('save_social_links', { p: links, p_visibility: v.vis });
          if (error) throw error;
          if (!data.ok) throw new Error(data.message);
        } });
    },
    langs() {
      formModal({ title: 'Languages', values: { langs: (me.languages || []).join(', ') }, fields: [
        { k: 'langs', label: 'Languages you can coach in', max: 300, ph: 'e.g. English, Telugu, Hindi, Urdu', help: 'Separate with commas.' }],
        onSave: async (v) => {
          const arr = [...new Set(v.langs.split(',').map((s) => s.trim()).filter(Boolean).map((s) => s.slice(0, 30)))].slice(0, 12);
          must(await sb.from('profiles').update({ languages: arr }).eq('id', me.id)); me = await FL.getProfile(true);
        } });
    },
  };

  async function uploadPic(kind) {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      FL.toast(kind === 'cover' ? 'Uploading cover…' : 'Uploading photo…');
      try {
        const url = await FL.uploadImage(f, kind === 'cover'
          ? { bucket: 'avatars', path: `${me.id}/cover.jpg`, aspect: 4, max: 1600 }
          : { bucket: 'avatars', path: `${me.id}/avatar.jpg`, square: true, max: 800, format: 'jpeg' });
        must(await sb.from('profiles').update(kind === 'cover' ? { cover_url: url } : { photo_url: url }).eq('id', me.id));
        me = await FL.getProfile(true); FL.renderHeader(me); FL.toast('Updated', 'ok'); await reload();
      } catch (e) { FL.toast(FL.friendly(e), 'err'); }
    };
    FL.photoCheck.warm(); inp.click();
  }

  // ------------------------------------------------------------ render
  function header() {
    const self = isSelf(), c = p.connection || {};
    const loc = [p.city, p.district, p.country].filter(Boolean).join(', ');
    let acts = '';
    if (self) {
      acts = `<div class="add-sec"><button class="pill solid" id="btnAddSec">Add profile section ${I('down', 14)}</button></div>
        <button class="pill" data-ed="intro">${p.open_to_work ? '#OpenToWork · edit' : 'Open to work'}</button>
        ${p.verified ? '' : `<a class="pill" href="verification">${I('tick', 16)}Get verified</a>`}
        <button class="pill ghost" id="btnShare">${I('link', 16)}Share profile</button>`;
    } else {
      const im = p.can_inmail || {};
      if (c.state === 'connected') acts = `<a class="pill solid" href="messaging?u=${encodeURIComponent(p.username)}">${I('send', 16)}Message</a>`;
      else if (c.state === 'incoming') acts = `<button class="pill solid" data-conn="accept">Accept invitation</button><button class="pill ghost" data-conn="ignore">Ignore</button>`;
      else if (c.state === 'outgoing') acts = `<button class="pill ghost" data-conn="withdraw">${I('clock', 16)}Pending · withdraw</button>`;
      else if (!p.blocked_by_me) acts = `<button class="pill solid" data-conn="connect">${I('userplus', 17)}Connect</button>`;
      if (c.state !== 'connected' && !p.blocked_by_me) {
        if (im.existing || (im.ok && im.context === 'open')) acts += `<a class="pill" href="messaging?u=${encodeURIComponent(p.username)}">${I('send', 16)}Message${im.context === 'open' && !im.existing ? ' · free' : ''}</a>`;
        else if (im.ok) acts += `<button class="pill gold-o" id="btnInmail">${I('mail', 16)}${im.cost ? 'InMail' : 'Message about the job'}</button>`;
        else if (im.premium_needed && (p.hiring || p.open_to_work)) acts += `<button class="pill ghost" id="btnInmail">${I('lock', 15)}Message</button>`;
      }
      if (canBook()) acts = `<button class="pill solid" id="btnBookTop">${I('calendar', 16)}Book a session</button>` + acts.replace('pill solid', 'pill');
      acts += `<div class="acts-menu"><button class="pill ghost" id="btnMore">More</button></div>`;
    }
    const ring = p.hiring ? 'hiring' : p.open_to_work ? 'otw' : '';
    const avatar = p.photo_url ? `<img class="ph-avatar" src="${esc(p.photo_url)}" alt="${esc(p.full_name)}">` : `<div class="ph-avatar">${esc(FL.initials(p.full_name))}</div>`;
    return `<div class="box">
      <div class="ph-cover" ${p.cover_url ? `style="background-image:url('${esc(p.cover_url)}')"` : ''}>${self ? `<button class="icon-btn" id="btnCover" aria-label="Change cover image">${I('camera', 20)}</button>` : ''}</div>
      <div class="ph-body">
        ${self ? `<span class="ph-edit">${editBtn('intro', '', 'Edit intro')}</span>` : ''}
        <div class="ph-avatar-wrap">${ring ? `<span class="ring ${ring}" title="${ring === 'hiring' ? '#Hiring' : '#OpenToWork'}">${avatar}</span>` : avatar}
          ${self ? `<button class="icon-btn" id="btnPhoto" aria-label="Change profile photo">${I('camera', 18)}</button>` : ''}</div>
        <h1 class="ph-name">${esc(p.full_name)}${FL.tick(p.verified, 22)}${p.premium ? FL.prem(p.premium) : ''}</h1>
        <p class="ph-head">${esc(p.headline || p.occupation || (self ? '' : 'Fit Lab member'))}${self && !p.headline ? `<button class="txt-btn" data-ed="intro" style="color:var(--lime)">${I('plus', 16)}Add a headline</button>` : ''}</p>
        ${p.profession_label ? `<p class="ph-prof">${esc(p.profession_label)}${p.licence_label ? ` · <span style="color:var(--lime);font-weight:700">${I('shield', 13)} ${esc(p.licence_label)}</span>` : ''}</p>`
          : self ? `<p class="ph-prof"><button class="txt-btn" data-ed="intro" style="color:var(--lime);padding:0">${I('plus', 15)}Add your profession</button></p>` : ''}
        ${(p.specialties || []).length ? `<div class="spec">${p.specialties.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
        <p class="ph-loc">${loc ? esc(loc) + ' · ' : ''}<span class="mono" style="font-size:12px">${esc(p.unique_id || '')}</span></p>
        <p class="ph-loc"><a href="${self ? 'network#connections' : '#'}" ${self ? '' : 'onclick="return false"'}>${p.connections} connection${p.connections === 1 ? '' : 's'}</a>${!self && p.mutual ? ` · ${p.mutual} mutual` : ''}
          ${!self && c.state === 'connected' ? ` · <button class="txt-btn tagbtn" data-tag="1">${I('tag', 13)}${p.my_tag ? esc((FL.CONN_TAGS.find((x) => x[0] === p.my_tag) || [])[1] || p.my_tag) : 'Add how you know them'}</button>` : ''}
          ${!self && p.open_profile ? ` · <span class="chip acc" style="font-size:11px">${I('send', 12)}Open Profile</span>` : ''}</p>
        ${p.rating && p.rating.count ? `<p class="ph-loc"><a href="#reviews" class="ph-rating">${FLBook.ratingLine(p.rating)}</a></p>` : ''}
        ${p.social && Object.keys(p.social).length ? `<div class="socials">${FL.socialChips(p.social)}${self ? `<button class="txt-btn" data-ed="social">${I('edit', 14)}Edit</button>` : ''}</div>`
          : self ? `<div class="socials"><button class="txt-btn" data-ed="social" style="color:var(--lime)">${I('plus', 15)}Add your Instagram, YouTube, WhatsApp or website</button></div>`
          : p.social_hidden ? `<div class="socials"><span class="t-xs muted">${I('lock', 12)} Contact &amp; social links are visible to connections</span></div>` : ''}
        <div class="ph-badges">${FL.starsIf(p.star_count || 0, p.star_tier)}
          ${p.coach_level && p.coach_level !== 'trainee' ? `<span class="chip acc">${I('award', 13)}Certified ${FL.levelLabel(p.coach_level)}</span>` : ''}
          ${p.open_to_work ? `<span class="ring-lbl">${I('briefcase', 13)}#OpenToWork</span>` : ''}
          ${p.hiring ? `<span class="ring-lbl hiring">${I('userplus', 13)}#Hiring</span>` : ''}
          ${p.community_status && p.community_status !== 'active' ? `<span class="chip" style="color:var(--warn);border-color:var(--warn)">Community access ${p.community_status === 'banned' ? 'removed' : 'paused'}</span>` : ''}</div>
        ${self && p.views_90d != null ? `<a class="ph-views" href="insights">${I('eye', 16)}${p.views_90d} profile view${p.views_90d === 1 ? '' : 's'} in the last 90 days →</a>` : ''}
        <div class="ph-acts">${acts}</div>
      </div></div>`;
  }

  function strength() {
    if (!isSelf()) return '';
    const items = [
      ['Profile photo', !!p.photo_url, 'photo'], ['Headline', !!p.headline, 'intro'], ['About (50+ characters)', (p.bio || '').length >= 50, 'about'],
      ['Experience', (p.experience || []).length > 0, 'exp'], ['Education', (p.education || []).length > 0, 'edu'],
      ['3 or more skills', (p.skills || []).length >= 3, 'skills'], ['A license or certification', (p.credentials || []).length + (p.certifications || []).length > 0, 'cred'],
      ['Cover image', !!p.cover_url, 'cover'], ['Languages', (p.languages || []).length > 0, 'langs'], ['Profession', !!p.profession, 'intro']];
    const done = items.filter((x) => x[1]).length, pct = Math.round(done / items.length * 100);
    if (pct === 100) return '';
    const label = pct < 40 ? 'Beginner' : pct < 70 ? 'Intermediate' : pct < 100 ? 'Advanced' : 'All-Star';
    return `<div class="box"><div class="box-head"><h2>Profile strength: ${label}</h2><span class="sub">Private to you</span></div>
      <div class="strength"><div class="bar"><i style="width:${pct}%"></i></div>
        <p class="t-sm muted" style="margin:10px 0 0">Complete profiles rank higher in search, match more jobs and raise your verification trust score.</p>
        <ul>${items.filter((x) => !x[1]).slice(0, 4).map(([l, , k]) => `<li>${I('plus', 16)}${l}<button class="pill sm" data-ed="${k}">Add</button></li>`).join('')}</ul></div></div>`;
  }

  function about() {
    if (!p.bio && !isSelf()) return '';
    const long = (p.bio || '').length > 320;
    return `<div class="box sec-box"><div class="box-head"><h2>About</h2>${editBtn('about', '', 'Edit about')}</div>
      ${p.bio ? `<div class="about ${long ? 'clamp' : ''}" id="aboutTxt">${FL.linkify(p.bio)}</div>${long ? '<button class="morebtn" id="aboutMore">…see more</button>' : ''}`
              : `<p class="t-sm muted" style="padding:0 20px 18px;margin:0">Tell members and gyms who you coach and how. <button class="txt-btn" data-ed="about" style="color:var(--lime)">Add about</button></p>`}</div>`;
  }

  function activity() {
    const n = p.post_count || 0;
    return `<div class="box sec-box"><div class="box-head"><div><h2>Activity</h2><div class="sub">${n} post${n === 1 ? '' : 's'}</div></div>
        ${isSelf() ? `<a class="pill sm" href="feed#compose">Create a post</a>` : ''}</div>
      <div class="act-posts" id="actPosts">${posts.length ? posts.map((x) => FLPosts.render(x)).join('') : `<p class="t-sm muted" style="padding:0 20px 18px;margin:0">${isSelf() ? 'You haven\'t posted yet. Posts you share appear here.' : esc(p.full_name.split(' ')[0]) + ' hasn\'t posted yet.'}</p>`}</div>
      ${n > posts.length ? `<div class="box-foot"><button id="moreAct">Show all ${n} posts →</button></div>` : ''}</div>`;
  }

  const orgIcon = (r) => r.page ? `<a href="company?p=${encodeURIComponent(r.page.slug)}">${FL.pageLogo(r.page)}</a>` : `<span class="sq">${I('briefcase', 22)}</span>`;
  const orgName = (r) => r.page ? `<a href="company?p=${encodeURIComponent(r.page.slug)}" style="color:inherit">${esc(r.organization)}</a>${FL.tick(r.page.verified, 13)}` : esc(r.organization);

  const BADGE_IC = { verified: 'tick', licence: 'shield', premium: 'crown', certified: 'award', open_to_work: 'briefcase', hiring: 'userplus', founding: 'sparkles', voice: 'comment' };
  function badges() {
    const b = p.badges || [];
    if (!b.length) return '';
    return `<div class="box sec-box"><div class="box-head"><h2>Badges</h2></div>
      <div class="badges">${b.map((x) => `<div class="bdg ${x.code}"><i>${I(BADGE_IC[x.code] || 'award', 17)}</i><div><b>${esc(x.label)}</b><span>${esc(x.detail || '')}</span></div></div>`).join('')}</div></div>`;
  }

  const MODES = { in_person: 'In person', online: 'Online', home_visit: 'Home visits', hybrid: 'In person & online' };
  const UNITS = { session: 'session', month: 'month', package: 'package', consultation: 'consultation', hour: 'hour' };
  const canBook = () => !isSelf() && p.booking && p.booking.on && (p.services || []).some((x) => x.bookable && x.active);
  function services() {
    const sv = p.services || [];
    if (!sv.length && !isSelf()) return '';
    const bookOn = p.booking && p.booking.on;
    const priceLine = (x) => x.bookable && x.book_price != null
      ? ` · <span class="price">${x.sessions > 1 ? `${x.sessions} × ${x.session_min} min · ` : `${x.session_min} min · `}${x.book_price ? FL.inr(x.book_price) : 'Free'}</span>`
      : x.price_from != null ? ` · <span class="price">from ${FL.inr(x.price_from)}${x.price_unit ? ' / ' + UNITS[x.price_unit] : ''}</span>` : '';
    return `<div class="box sec-box" id="svcBox"><div class="box-head"><div><h2>Services</h2>${isSelf() ? `<div class="sub">${bookOn ? 'You\'re taking bookings.' : 'Mark a package as bookable and open bookings so clients can book and pay.'} <a href="bookings#settings">Booking settings</a></div>` : bookOn ? '<div class="sub">Book a free time and pay on The Fit Lab</div>' : ''}</div><span class="sec-tools">${addBtn('svc', 'Add a service')}</span></div>
      <div class="svc-list">${sv.map((x) => `<div class="svc" ${x.active ? '' : 'style="opacity:.6"'}><div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1;min-width:0">
          <b>${esc(x.title)}</b>${x.active ? '' : ' <span class="chip">Hidden</span>'}${isSelf() && x.bookable ? ' <span class="chip acc">Bookable</span>' : ''}
          <div class="meta">${esc([MODES[x.mode], x.city].filter(Boolean).join(' · '))}${priceLine(x)}</div></div>
          ${isSelf() ? editBtn('svc', x.id) : x.bookable && bookOn ? `<button class="pill solid sm" data-book="${x.id}">Book</button>` : `<button class="pill sm" data-req="${x.id}">Request</button>`}</div>
          ${x.description ? `<p class="t-sm" style="margin:6px 0 0;line-height:1.5;white-space:pre-line">${esc(x.description)}</p>` : ''}</div>`).join('')
        || `<p class="t-sm muted" style="margin:0">Coach clients, see patients or run sessions? List what you offer — training packages, physio consultations, diet plans — and clients can send you a request.</p>`}</div></div>`;
  }

  function showcase() {
    const sc = p.showcase || [];
    if (!sc.length) return '';
    return `<div class="box sec-box" id="showcase"><div class="box-head"><div><h2>Client results</h2><div class="sub">Shown with each client's permission</div></div></div>
      <div class="tf-grid">${sc.map((t) => `<div class="tf-card"><div class="tf"><figure><img src="${esc(t.before_url)}" alt="Before" loading="lazy"><figcaption>Before</figcaption></figure>
        <figure><img src="${esc(t.after_url)}" alt="After" loading="lazy"><figcaption>After</figcaption></figure></div>
        ${t.caption || t.weeks ? `<div class="t-sm">${esc(t.caption || '')}${t.weeks ? `${t.caption ? ' · ' : ''}${t.weeks} weeks` : ''}</div>` : ''}</div>`).join('')}</div></div>`;
  }
  let allReviews = null;
  function reviews() {
    const r = p.reviews; if (!r || !r.summary || !r.summary.count) return '';
    const items = allReviews || r.items || [], n = r.summary.count, st = r.stars || {};
    return `<div class="box sec-box" id="reviews"><div class="box-head"><div><h2>Reviews</h2><div class="sub">Only from clients who booked and had a session</div></div></div>
      <div class="rsum"><div><div class="big">${Number(r.summary.avg).toFixed(1)}</div>${FLBook.stars(r.summary.avg, 16)}<div class="t-xs muted">${n} review${n === 1 ? '' : 's'}</div></div>
        <div class="bars">${[5, 4, 3, 2, 1].map((k) => `<div class="bar"><span>${k}</span><i><b style="width:${Math.round(100 * (st[k] || 0) / n)}%"></b></i><span>${st[k] || 0}</span></div>`).join('')}</div></div>
      ${items.map((x) => `<div class="rv"><div class="head">${FL.avatarHtml(x.client, 'avatar')}<div style="flex:1;min-width:0"><b>${esc(x.client.full_name)}</b>
          <div class="t-xs muted">${esc(x.service || '')}${x.sessions ? ` · ${x.sessions} session${x.sessions === 1 ? '' : 's'}` : ''} · ${FL.timeAgo(x.created_at)} ago</div></div>${FLBook.stars(x.rating)}</div>
        ${x.body ? `<div>${esc(x.body)}</div>` : ''}
        ${x.coach_reply ? `<div class="reply"><b>${esc(p.full_name)} replied:</b> ${esc(x.coach_reply)}</div>` : ''}
        ${!isSelf() && !x.mine ? `<div><button class="txt-btn" data-rvreport="${x.id}">${I('flag', 13)}Report</button></div>` : ''}</div>`).join('')}
      ${n > items.length ? `<div class="pad" style="padding:6px 20px 16px"><button class="pill ghost sm" id="rvAll">Show all ${n} reviews</button></div>` : ''}</div>`;
  }

  function featured() {
    const ft = p.featured || [];
    if (!ft.length && !isSelf()) return '';
    return `<div class="box sec-box"><div class="box-head"><h2>Featured</h2><span class="sec-tools">${addBtn('feat', 'Add to Featured')}</span></div>
      ${ft.length ? `<div class="feat">${ft.map((f) => f.post ? `<div class="fpost"><div class="ft">Post${isSelf() ? ` <button class="txt-btn" data-unfeat="${f.id}" style="float:right;padding:0;font-size:11px">Remove</button>` : ''}</div><p>${esc(f.post.body)}</p>
          <div class="t-xs muted" style="margin-top:6px">${f.post.reaction_total} reaction${f.post.reaction_total === 1 ? '' : 's'} · ${f.post.comment_count} comment${f.post.comment_count === 1 ? '' : 's'}</div></div>`
        : `<a href="${esc(f.url)}" target="_blank" rel="noopener nofollow"><div class="ft">Link${isSelf() ? ` <span class="txt-btn" data-unfeat="${f.id}" role="button" style="float:right;padding:0;font-size:11px">Remove</span>` : ''}</div>
          <p style="font-weight:700">${esc(f.title || f.url)}</p><div class="t-xs muted" style="margin-top:4px">${esc(f.url.replace(/^https?:\/\//, '').split('/')[0])} ${I('external', 12)}</div></a>`).join('')}</div>`
        : `<p class="t-sm muted" style="padding:0 20px 18px;margin:0">Pin your best posts, a client transformation, an article or your website — up to 6 items.</p>`}</div>`;
  }

  function orgs() {
    const pg = p.pages || [];
    if (!pg.length) return '';
    return `<div class="box sec-box"><div class="box-head"><h2>Organisations</h2>${isSelf() ? '<a class="txt-btn" href="company?new=1">' + I('plus', 15) + 'New page</a>' : ''}</div>
      ${pg.map((g) => `<a class="org-row" href="company?p=${encodeURIComponent(g.slug)}" style="color:inherit">${FL.pageLogo(g, 'co-logo sm')}<div style="flex:1;min-width:0">
        <b>${esc(g.name)}</b>${FL.tick(g.verified, 14)}<div class="t-xs muted">${esc(g.kind_label)} · ${g.role === 'owner' ? 'Owner' : g.role === 'admin' ? 'Admin' : 'Recruiter'}${g.open_jobs ? ` · ${g.open_jobs} open job${g.open_jobs === 1 ? '' : 's'}` : ''}</div></div></a>`).join('')}</div>`;
  }

  function experience() {
    const ex = p.experience || [];
    if (!ex.length && !isSelf()) return '';
    const groups = []; const byOrg = new Map();
    for (const r of ex) { const k = (r.organization || '').toLowerCase().trim();
      if (!byOrg.has(k)) { const g = { org: r.organization, roles: [] }; byOrg.set(k, g); groups.push(g); } byOrg.get(k).roles.push(r); }
    const span = (r) => `${FL.fmtMonth(r.start_date)} – ${r.end_date ? FL.fmtMonth(r.end_date) : 'Present'} · ${FL.duration(r.start_date, r.end_date)}`;
    const body = groups.map((g) => {
      if (g.roles.length === 1) { const r = g.roles[0];
        return `<div class="ent">${orgIcon(r)}<div class="ent-main"><b class="ent-name">${esc(r.title)}</b>
          <div class="t-sm">${orgName(r)}${r.employment_type ? ' · ' + esc(r.employment_type) : ''}</div>
          <div class="ent-meta">${span(r)}</div>${r.location ? `<div class="ent-meta">${esc(r.location)}</div>` : ''}
          ${r.description ? `<p class="t-sm" style="margin:8px 0 0;white-space:pre-line;line-height:1.55">${FL.linkify(r.description)}</p>` : ''}</div>${editBtn('exp', r.id)}</div>`; }
      const first = g.roles[g.roles.length - 1], last = g.roles[0];
      return `<div class="ent exp-group" style="display:block"><div style="display:flex;gap:12px">${orgIcon(last)}
        <div><b class="ent-name">${orgName(last)}</b><div class="ent-meta">${FL.duration(first.start_date, last.end_date)}</div></div></div>
        <div class="roles" style="margin-top:8px">${g.roles.map((r) => `<div class="role" style="display:flex;gap:8px"><div style="flex:1;min-width:0"><b>${esc(r.title)}</b>
          <div class="ent-meta">${r.employment_type ? esc(r.employment_type) + ' · ' : ''}${span(r)}</div>${r.location ? `<div class="ent-meta">${esc(r.location)}</div>` : ''}
          ${r.description ? `<p>${FL.linkify(r.description)}</p>` : ''}</div>${editBtn('exp', r.id)}</div>`).join('')}</div></div>`;
    }).join('');
    return `<div class="box sec-box"><div class="box-head"><h2>Experience</h2><span class="sec-tools">${addBtn('exp', 'Add experience')}</span></div>
      ${body || '<p class="t-sm muted" style="padding:0 20px 18px;margin:0">Add the gyms, studios and roles you\'ve coached in. Promotions at the same place group together automatically.</p>'}</div>`;
  }

  function education() {
    const ed = p.education || [];
    if (!ed.length && !isSelf()) return '';
    return `<div class="box sec-box"><div class="box-head"><h2>Education</h2><span class="sec-tools">${addBtn('edu', 'Add education')}</span></div>
      ${ed.map((e) => `<div class="ent"><span class="sq">${I('school', 22)}</span><div class="ent-main"><b class="ent-name">${esc(e.school)}</b>
        <div class="t-sm">${[e.degree, e.field].filter(Boolean).map(esc).join(', ')}</div>
        ${e.start_year || e.end_year ? `<div class="ent-meta">${e.start_year || ''}${e.end_year ? ' – ' + e.end_year : ''}</div>` : ''}
        ${e.grade ? `<div class="ent-meta">Grade: ${esc(e.grade)}</div>` : ''}
        ${e.description ? `<p class="t-sm" style="margin:8px 0 0;white-space:pre-line;line-height:1.55">${FL.linkify(e.description)}</p>` : ''}</div>${editBtn('edu', e.id)}</div>`).join('')
      || '<p class="t-sm muted" style="padding:0 20px 18px;margin:0">Add your degree, diploma or sports-science qualifications.</p>'}</div>`;
  }

  function credentials() {
    const fl = p.certifications || [], ext = p.credentials || [];
    if (!fl.length && !ext.length && !isSelf()) return '';
    const flRows = fl.map((c) => `<div class="ent"><span class="sq fl-cert-sq">${I('award', 24)}</span><div class="ent-main"><b class="ent-name">${esc(c.course)}</b>
      <div class="t-sm">The Fit Lab Academy</div><div class="ent-meta">Issued ${FL.fmtMonth(c.issued_at)}</div>
      <div class="ent-meta">Credential ID <span class="mono">${esc(c.verification_code || '')}</span></div>
      <div class="ent-act"><a class="pill ghost sm" href="verify?id=${encodeURIComponent(p.unique_id)}">Show credential ${I('link', 14)}</a><span class="chip acc">${I('shield', 13)}Verified</span></div></div></div>`).join('');
    const extRows = ext.map((c) => `<div class="ent"><span class="sq">${I('award', 22)}</span><div class="ent-main"><b class="ent-name">${esc(c.name)}</b>
      <div class="t-sm">${esc(c.issuer)}</div>${c.issue_date ? `<div class="ent-meta">Issued ${FL.fmtMonth(c.issue_date)}${c.expiry_date ? ' · Expires ' + FL.fmtMonth(c.expiry_date) : ''}</div>` : ''}
      ${c.credential_id ? `<div class="ent-meta">Credential ID ${esc(c.credential_id)}</div>` : ''}${c.ce_hours ? `<div class="ent-meta">${c.ce_hours} CE hours</div>` : ''}
      ${c.credential_url ? `<div class="ent-act"><a class="pill ghost sm" href="${esc(c.credential_url)}" target="_blank" rel="noopener nofollow">Show credential ${I('link', 14)}</a></div>` : ''}</div>${editBtn('cred', c.id)}</div>`).join('');
    return `<div class="box sec-box"><div class="box-head"><div><h2>Licenses &amp; certifications</h2>${p.ce_hours_year > 0 ? `<div class="sub">${p.ce_hours_year} CE hours this year</div>` : ''}</div><span class="sec-tools">${addBtn('cred', 'Add license or certification')}</span></div>
      ${flRows + extRows || '<p class="t-sm muted" style="padding:0 20px 18px;margin:0">Add certifications like ACE, NASM, ACSM, K11, first-aid / CPR. Fit Lab certificates appear here automatically.</p>'}</div>`;
  }

  function skills(all = false) {
    const sk = p.skills || [];
    if (!sk.length && !isSelf()) return '';
    const canEndorse = !isSelf() && p.connection && p.connection.state === 'connected';
    const shown = all ? sk : sk.slice(0, 5);
    return `<div class="box sec-box" id="skills"><div class="box-head"><h2>Skills</h2><span class="sec-tools">${isSelf() ? `<button class="icon-btn" data-ed="skills" aria-label="Edit skills">${I('edit', 19)}</button>` : ''}</span></div>
      ${shown.map((s) => `<div class="skill-row"><div><b>${esc(s.name)}</b>
          <div class="ent-meta">${s.count ? `${I('usercheck', 15)}${s.count} endorsement${s.count === 1 ? '' : 's'}` : (isSelf() ? 'No endorsements yet' : '')}</div></div>
        ${canEndorse ? `<button class="pill ${s.endorsed_by_me ? 'solid' : 'ghost'} sm" data-endorse="${s.id}">${s.endorsed_by_me ? I('check', 15) + 'Endorsed' : 'Endorse'}</button>` : ''}</div>`).join('')
      || '<p class="t-sm muted" style="padding:0 20px 18px;margin:0">Add the skills you coach — strength, HIIT, PCOS programming… <button class="txt-btn" data-ed="skills" style="color:var(--lime)">Add skills</button></p>'}
      ${!isSelf() && !canEndorse && sk.length ? '<p class="t-xs muted" style="padding:0 20px 12px;margin:0">Connect to endorse skills.</p>' : ''}
      ${sk.length > 5 && !all ? `<div class="box-foot"><button id="allSkills">Show all ${sk.length} skills →</button></div>` : ''}</div>`;
  }

  function courses() {
    const cs = p.courses || [];
    if (!cs.length) return '';
    return `<div class="box sec-box"><div class="box-head"><h2>Fit Lab Academy</h2></div>
      ${cs.map((c) => `<div class="ent"><span class="sq">${I('courses', 22)}</span><div class="ent-main"><b class="ent-name">${esc(c.title)}</b>
        <div class="ent-meta">${c.status === 'certified' ? 'Certified' : c.status === 'completed' ? 'Exam passed' : `${c.done} of ${c.total} days`}</div>
        ${c.status === 'active' ? `<div class="cprog" style="max-width:280px"><span class="progress"><i style="width:${Math.round(c.done / c.total * 100)}%"></i></span></div>` : ''}</div>
        ${isSelf() ? `<a class="pill ghost sm" href="courses?c=${encodeURIComponent(c.slug)}">Open</a>` : ''}</div>`).join('')}</div>`;
  }

  function languages() {
    const ls = p.languages || [];
    if (!ls.length && !isSelf()) return '';
    return `<div class="box sec-box"><div class="box-head"><h2>Languages</h2>${editBtn('langs', '', 'Edit languages')}</div>
      <div class="lang-list">${ls.map((l) => `<span class="chip">${I('globe', 13)}${esc(l)}</span>`).join('') || '<span class="t-sm muted">Which languages can you coach in?</span>'}</div></div>`;
  }

  async function side() {
    const { data: sugg } = await sb.rpc('people_you_may_know', { p_limit: 5 });
    $('side').innerHTML = `
      ${isSelf() ? `<div class="box box-pad"><b style="display:flex;gap:8px;align-items:center">${I('chart', 18)}Profile insights</b>
        <p class="t-sm muted" style="margin:6px 0 10px;line-height:1.5">${p.views_90d || 0} view${p.views_90d === 1 ? '' : 's'} in 90 days. See which employers and recruiters looked.</p>
        <a class="pill sm" href="insights">Open insights</a></div>
      <div class="box box-pad"><div class="vis-note">${I('eye', 18)}<div><b style="color:var(--bone)">Who sees your profile</b><br>
        Fit Lab members see your full profile. Gyms on the hire portal see it once you're certified. Your phone, email and date of birth are never shown.
        <a href="settings#privacy">Privacy settings</a></div></div></div>` : ''}
      <div class="box"><div class="box-head" style="padding-bottom:4px"><h3 style="font-size:16px">People you may know</h3></div>
        ${(sugg || []).map((s) => `<div class="ent" style="padding:10px 16px"><a href="profile?u=${encodeURIComponent(s.username)}">${FL.avatarHtml(s, 'avatar sm')}</a>
          <div class="ent-main"><a class="ent-name" style="font-size:14px" href="profile?u=${encodeURIComponent(s.username)}">${esc(s.full_name)}${FL.tags(s)}</a>
          <div class="ent-sub" style="font-size:12px">${esc(s.headline || '')}</div>
          <div class="ent-act" style="margin-top:6px"><a class="pill ghost sm" href="profile?u=${encodeURIComponent(s.username)}">View profile</a></div></div></div>`).join('')
        || '<p class="t-sm muted" style="padding:0 16px 14px">No suggestions right now.</p>'}
        <div class="box-foot"><a href="network">Show all →</a></div></div>
      ${FL.siteFootHtml(true)}`;
    FL.wireCommon($('side'));
  }

  function requestService(id) {
    const x = (p.services || []).find((e) => e.id === id); if (!x) return;
    const m = FL.modal({ title: `Request: ${x.title}`, body: `
      <p class="t-sm muted" style="margin:0 0 12px;line-height:1.5">${esc(p.full_name.split(' ')[0])} gets your request on The Fit Lab. If they accept, you can message each other to plan the details.</p>
      <div class="field"><label for="rqG" class="req">What are you looking for?</label><textarea id="rqG" maxlength="600" style="min-height:110px" placeholder="e.g. I'm 34, want to lose 8 kg and fix my knee pain. I can train 3 mornings a week."></textarea></div>
      <div class="field"><label for="rqP">Preferred days or times</label><input id="rqP" maxlength="120" placeholder="e.g. Weekday mornings"></div>`,
      foot: `<button class="pill ghost" data-no>Cancel</button><button class="pill solid" data-ok>Send request</button>` });
    m.q('[data-no]').onclick = m.close;
    m.q('[data-ok]').onclick = async (e) => {
      const g = m.q('#rqG').value.trim();
      if (g.length < 10) return FL.toast('Tell them briefly what you\'re looking for', 'err');
      FL.busy(e.target, true, 'Sending…');
      const r = await FL.call('request_service', { p_service: id, p_goal: g, p_preferred: m.q('#rqP').value.trim() || null });
      FL.busy(e.target, false);
      if (r) { m.close(); FL.toast('Request sent — you\'ll be notified when they reply', 'ok'); }
    };
  }

  function render() {
    if (p.visibility === 'unavailable') {
      $('main').innerHTML = `<div class="box pv-unavail"><div class="ic-circle" style="margin:0 auto 12px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2)">${I('lock', 26)}</div>
        <h2 style="margin:0 0 6px;font:700 20px var(--body)">This profile isn't available</h2><p class="muted t-sm">@${esc(p.username)}</p>
        ${p.blocked_by_me ? `<button class="pill" id="btnUnblock">Unblock</button>` : `<a class="pill" href="feed">Back to home</a>`}</div>`;
      const ub = $('btnUnblock'); if (ub) ub.onclick = async () => { await FL.call('unblock_member', { p_user_id: p.user_id }); reload(); };
      return;
    }
    document.title = `${p.full_name} — The Fit Lab`;
    $('main').innerHTML = header() + strength() + about() + featured() + activity() + services() + showcase() + reviews() + experience() + education() + credentials() + skills() + badges() + courses() + orgs() + languages();
    const am = $('aboutMore'); if (am) am.onclick = () => { $('aboutTxt').classList.remove('clamp'); am.remove(); };
    const asb = $('allSkills'); if (asb) asb.onclick = () => { $('skills').outerHTML = skills(true); };
  }

  async function reload() {
    const uname = (FL.param('u') || me.username).replace(/^@/, '');
    let { data, error } = await sb.rpc('get_profile_v10', { p_username: uname });
    if ((error && /get_profile_v10|function/i.test(error.message || '')) || (!error && !data)) ({ data, error } = await sb.rpc('get_profile_v9', { p_username: uname }));
    if (error) { $('main').innerHTML = `<div class="box empty"><b>Member not found</b>${esc(FL.friendly(error))}<br><br><a class="pill sm" href="search">Search members</a></div>`; return; }
    const first = !p;
    p = data;
    if (first && !p.is_self && p.visibility === 'full') sb.rpc('log_profile_view', { p_user: p.user_id }).then(() => {}, () => {});
    if (p.visibility !== 'unavailable') {
      const { data: fp } = await sb.rpc('get_feed', { p_before: null, p_author: p.user_id, p_limit: 3 });
      posts = fp || [];
    }
    render();
  }

  // ------------------------------------------------------------ events
  const main = $('main');
  FLPosts.mount(main, { me }); FLPosts.trackViews(main);
  main.addEventListener('click', async (e) => {
    const ed = e.target.closest('[data-ed]');
    if (ed) { const k = ed.dataset.ed, id = ed.dataset.id || null;
      if (k === 'photo') return uploadPic('photo'); if (k === 'cover') return uploadPic('cover');
      return editors[k] && editors[k](id); }
    const uf = e.target.closest('[data-unfeat]');
    if (uf) { e.preventDefault(); const r = await FL.call('delete_featured', { p_id: uf.dataset.unfeat }); if (r) reload(); return; }
    const t = e.target.closest('button,a'); if (!t) return;
    if (t.id === 'btnInmail') {
      const im = p.can_inmail || {};
      if (im.ok) { const r = await FL.inmail(p, im); if (r) reload(); return; }
      return FL.upsell('Message ' + p.full_name.split(' ')[0], im.reason || 'Connect first, or use Premium InMail for job-related messages.', 'pro');
    }
    if (t.dataset.tag) { const r = await FL.tagConnection(p.user_id, p.full_name, p.my_tag); if (r) { p.my_tag = r.tag; render(); } return; }
    if (t.dataset.req) return requestService(t.dataset.req);
    if (t.dataset.book) return FLBook.open(t.dataset.book);
    if (t.id === 'btnBookTop') { const bk = (p.services || []).filter((x) => x.bookable && x.active); if (bk.length === 1) return FLBook.open(bk[0].id); const sb2 = $('svcBox'); if (sb2) sb2.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (t.dataset.rvreport) return FL.report('review', t.dataset.rvreport);
    if (t.id === 'rvAll') { const { data } = await sb.rpc('coach_reviews_list', { p_coach: p.user_id, p_before: null, p_limit: 30 }); if (data) { allReviews = data.items; render(); const rv = $('reviews'); if (rv) rv.scrollIntoView({ block: 'start' }); } return; }
    if (t.id === 'btnPhoto') return uploadPic('photo');
    if (t.id === 'btnCover') return uploadPic('cover');
    if (t.id === 'btnShare') { const url = new URL('profile?u=' + encodeURIComponent(p.username), location.href).href;
      try { await navigator.clipboard.writeText(url); FL.toast('Profile link copied', 'ok'); } catch (_) { FL.toast(url); } return; }
    if (t.id === 'btnAddSec') {
      const old = main.querySelector('.add-sec .menu-pop'); if (old) return old.remove();
      const pop = document.createElement('div'); pop.className = 'menu-pop'; pop.style.left = '0'; pop.style.right = 'auto';
      pop.innerHTML = [['about', 'About', 'edit'], ['exp', 'Experience', 'briefcase'], ['edu', 'Education', 'school'], ['cred', 'License or certification', 'award'],
        ['skills', 'Skills', 'sparkles'], ['svc', 'Services', 'briefcase'], ['feat', 'Featured', 'bookmark'], ['langs', 'Languages', 'globe'], ['social', 'Contact & social links', 'link'], ['photo', 'Profile photo', 'camera'], ['cover', 'Cover image', 'image']]
        .map(([k, l, ic]) => `<button data-ed="${k}">${I(ic, 18)}${l}</button>`).join('');
      t.parentElement.appendChild(pop); return;
    }
    if (t.id === 'btnMore') {
      const old = main.querySelector('.acts-menu .menu-pop'); if (old) return old.remove();
      const pop = document.createElement('div'); pop.className = 'menu-pop'; pop.style.left = '0'; pop.style.right = 'auto';
      pop.innerHTML = `<button data-more="link">${I('link', 18)}Copy profile link</button>
        ${p.connection && p.connection.state === 'connected' ? `<button data-more="remove">${I('close', 18)}Remove connection</button>` : ''}
        <button data-more="report">${I('flag', 18)}Report profile</button>
        <button data-more="${p.blocked_by_me ? 'unblock' : 'block'}" class="danger">${I('block', 18)}${p.blocked_by_me ? 'Unblock' : 'Block'}</button>`;
      t.parentElement.appendChild(pop); return;
    }
    if (t.dataset.more) {
      t.closest('.menu-pop').remove();
      const k = t.dataset.more;
      if (k === 'link') { const url = new URL('profile?u=' + encodeURIComponent(p.username), location.href).href; try { await navigator.clipboard.writeText(url); FL.toast('Link copied', 'ok'); } catch (_) { FL.toast(url); } }
      if (k === 'report') FL.report('profile', p.user_id, { userId: p.user_id, name: p.full_name, onDone: reload });
      if (k === 'block' && await FL.confirm(`Block ${p.full_name}?`, 'They won\'t be able to see your profile or posts, message you or connect. They aren\'t told.', 'Block', true)) { await FL.call('block_member', { p_user_id: p.user_id }); FL.toast('Blocked', 'ok'); reload(); }
      if (k === 'unblock') { await FL.call('unblock_member', { p_user_id: p.user_id }); reload(); }
      if (k === 'remove' && await FL.confirm('Remove connection', `Remove ${p.full_name} from your connections?`, 'Remove', true)) { await FL.call('remove_connection', { p_id: p.connection.id }); reload(); }
      return;
    }
    if (t.dataset.conn) {
      const k = t.dataset.conn; let r;
      if (k === 'connect') r = await FL.connect(p.username, p.full_name);
      else if (k === 'withdraw') r = await FL.call('cancel_connection_request', { p_id: p.connection.id });
      else r = await FL.call('respond_connection_request', { p_id: p.connection.id, p_accept: k === 'accept' });
      if (r) { if (k === 'accept') FL.toast('Connected', 'ok'); FL.refreshCounts(); reload(); }
      return;
    }
    if (t.dataset.endorse) {
      FL.busy(t, true, '');
      const r = await FL.call('endorse_skill', { p_skill_id: t.dataset.endorse });
      FL.busy(t, false);
      if (r) { const s = p.skills.find((x) => x.id === t.dataset.endorse); s.endorsed_by_me = r.endorsed; s.count = r.count;
        $('skills').outerHTML = skills(main.querySelectorAll('#skills .skill-row').length > 5); }
      return;
    }
    if (t.id === 'moreAct') {
      FL.busy(t, true, 'Loading…');
      const { data } = await sb.rpc('get_feed', { p_before: null, p_author: p.user_id, p_limit: 50 });
      $('actPosts').innerHTML = (data || []).map((x) => FLPosts.render(x)).join(''); t.closest('.box-foot').remove();
    }
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.add-sec,.acts-menu')) main.querySelectorAll('.add-sec .menu-pop,.acts-menu .menu-pop').forEach((m) => m.remove()); });

  await reload();
  side();
  if (isSelf() && FL.param('edit') === '1') editors.intro();
  if (isSelf() && FL.param('edit') === 'social') editors.social();
})();
</script>
</body>
</html>
