<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notifications — The Fit Lab</title>
<script src="assets/theme.js"></script>
<link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="notifications">
<main class="page">
  <div class="layout l-three">
    <aside class="col-left"><div class="sticky-col" id="left"></div></aside>
    <section class="stack">
      <div class="box">
        <div class="box-head"><h2>Notifications</h2><button class="txt-btn" id="markAll">Mark all as read</button></div>
        <div class="utabs" id="tabs"><button data-f="all" class="on">All</button><button data-f="posts">My posts</button><button data-f="network">Network</button><button data-f="jobs">Jobs</button><button data-f="academy">Updates</button></div>
        <div id="list"><div class="skeleton" style="height:64px;margin:14px"></div><div class="skeleton" style="height:64px;margin:14px"></div></div>
      </div>
    </section>
    <aside class="col-right"><div class="sticky-col" id="right"></div></aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = FL.esc, I = FL.icon;
  const session = await FL.requireAuth(); if (!session) return;
  let me; try { me = await FL.getProfile(); } catch (e) { return FL.toast(FL.friendly(e), 'err'); }
  if (!me.profile_completed) return location.replace('register.html');
  FL.renderHeader(me);

  const { data: cnt } = await sb.rpc('connection_count', { p_user: me.id });
  $('left').innerHTML = FL.miniProfile(me, { connections: cnt ?? 0, courses: '—' });
  $('right').innerHTML = `<div class="box box-pad"><b style="font-size:15px">Stay in the loop</b>
    <p class="t-sm muted" style="margin:8px 0 0;line-height:1.5">Reactions and comments on your posts, invitations, job updates, InMails and Academy announcements all arrive here. Course reminders also come by email.</p></div>${FL.siteFootHtml(true)}`;
  FL.wireCommon($('right'));

  const { data, error } = await sb.rpc('list_notifications', { p_limit: 100 });
  if (error) { $('list').innerHTML = `<div class="empty">${esc(FL.friendly(error))}</div>`; return; }
  const all = data || [];
  const group = (n) => ['reaction', 'comment'].includes(n.kind) ? 'posts' : ['connection', 'endorsement', 'inmail', 'service', 'page'].includes(n.kind) ? 'network' : n.kind === 'job' ? 'jobs' : 'academy';
  const icFor = (n) => ({ reaction: 'like', comment: 'comment', connection: 'userplus', endorsement: 'usercheck', launch: 'courses', system: 'shield', motivation: 'sparkles',
    job: 'briefcase', page: 'building', premium: 'crown', verification: 'tick', inmail: 'mail', service: 'briefcase' })[n.kind] || 'bell';
  let filter = 'all';

  function draw() {
    const list = all.filter((n) => filter === 'all' || group(n) === filter);
    $('list').innerHTML = list.length ? list.map((n) => `<a class="notif ${n.is_read ? '' : 'unread'}" href="${esc(n.link_url || '#')}" data-id="${n.id}">
        ${n.actor ? FL.avatarHtml(n.actor, 'avatar') : `<span class="ic-circle">${I(icFor(n), 22)}</span>`}
        <div style="flex:1;min-width:0"><p>${n.actor ? `<b>${esc(n.actor.full_name)}</b> ` + esc(n.title.replace(/^@\S+\s/, '')) : `<b>${esc(n.title)}</b>`}</p>
          ${n.body ? `<span class="q">${esc(n.body)}</span>` : ''}</div>
        <time datetime="${n.created_at}">${FL.timeAgo(n.created_at)}</time></a>`).join('')
      : `<div class="empty"><b>Nothing here yet</b>${filter === 'posts' ? 'Reactions and comments on your posts will show up here.' : filter === 'network' ? 'Invitations, endorsements, InMails and service requests will show up here.' : filter === 'jobs' ? 'Application updates, new applicants and jobs from pages you follow will show up here.' : 'You\'re all caught up.'}</div>`;
  }
  $('tabs').onclick = (e) => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b)); draw(); };
  $('list').addEventListener('click', async (e) => {
    const a = e.target.closest('[data-id]'); if (!a) return;
    const n = all.find((x) => x.id === a.dataset.id);
    if (n && !n.is_read) { e.preventDefault(); n.is_read = true; await sb.rpc('mark_notifications_read', { p_ids: [n.id] }); location.href = a.getAttribute('href'); }
  });
  $('markAll').onclick = async () => { await sb.rpc('mark_notifications_read', { p_ids: null }); all.forEach((n) => { n.is_read = true; }); draw(); FL.refreshCounts(); };
  draw();
  // opening the page counts as seeing them (badge clears), but rows stay highlighted until clicked
  setTimeout(async () => { await sb.rpc('mark_notifications_read', { p_ids: all.filter((n) => !n.is_read && !n.link_url).map((n) => n.id) }); FL.refreshCounts(); }, 1500);
})();
</script>
</body>
</html>
