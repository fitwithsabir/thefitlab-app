<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Search — The Fit Lab</title>
<script src="assets/theme.js"></script>
<link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="search">
<main class="page">
  <div class="layout l-main-side">
    <section class="stack">
      <div class="box">
        <div class="box-head"><div><h2 id="ttl">People</h2><div class="sub" id="sub"></div></div></div>
        <form id="f" style="display:flex;gap:8px;padding:4px 20px 14px"><input id="q" type="search" placeholder="Name, @username, Unique ID, city or skill" aria-label="Search people"><button class="pill solid">Search</button></form>
        <div id="res"><div class="skeleton" style="height:70px;margin:14px"></div></div>
      </div>
    </section>
    <aside><div class="sticky-col" id="side"></div></aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = FL.esc, I = FL.icon;
  const session = await FL.requireAuth(); if (!session) return;
  let me; try { me = await FL.getProfile(); } catch (e) { return FL.toast(FL.friendly(e), 'err'); }
  if (!me.profile_completed) return location.replace('register.html');
  FL.renderHeader(me);
  $('side').innerHTML = `<div class="box box-pad"><b style="font-size:15px">Looking to hire?</b><p class="t-sm muted" style="margin:8px 0 12px;line-height:1.5">Gyms and studios can filter certified coaches by course, city, experience and stars.</p>
    <a class="pill sm" href="hire.html">Open the hire portal</a></div>${FL.siteFootHtml(true)}`;
  FL.wireCommon($('side'));

  const btn = (p) => {
    const s = (p.connection || {}).state;
    if (s === 'connected') return `<a class="pill sm" href="messaging.html?u=${encodeURIComponent(p.username)}">Message</a>`;
    if (s === 'outgoing') return `<span class="chip">${I('clock', 14)}Pending</span>`;
    if (s === 'incoming') return `<a class="pill sm" href="network.html#invitations">Respond</a>`;
    return `<button class="pill sm" data-connect="${esc(p.username)}" data-name="${esc(p.full_name)}">${I('userplus', 16)}Connect</button>`;
  };
  async function run(q) {
    $('q').value = q;
    history.replaceState(null, '', q ? 'search.html?q=' + encodeURIComponent(q) : 'search.html');
    $('res').innerHTML = '<div class="skeleton" style="height:70px;margin:14px"></div>';
    const { data, error } = await sb.rpc(q ? 'search_people' : 'people_you_may_know', q ? { p_q: q, p_limit: 50 } : { p_limit: 20 });
    if (error) { $('res').innerHTML = `<div class="empty">${esc(FL.friendly(error))}</div>`; return; }
    const list = data || [];
    $('ttl').textContent = q ? 'People' : 'Suggested for you';
    $('sub').textContent = q ? `${list.length} result${list.length === 1 ? '' : 's'} for “${q}”` : 'Coaches and trainers on The Fit Lab';
    $('res').innerHTML = list.length ? list.map((p) => `<div class="ent">
        <a href="profile.html?u=${encodeURIComponent(p.username)}">${FL.avatarHtml(p, 'avatar')}</a>
        <div class="ent-main"><a class="ent-name" href="profile.html?u=${encodeURIComponent(p.username)}">${esc(p.full_name)}</a>
          ${p.level && p.level !== 'trainee' ? `<span class="chip acc" style="padding:0 7px;font-size:10.5px">${FL.levelLabel(p.level)}</span>` : ''}
          <div class="ent-sub">${esc(p.headline || '')}</div>
          <div class="ent-meta">${[p.city, '@' + p.username].filter(Boolean).map(esc).join(' · ')}${p.mutual ? ` · ${p.mutual} mutual` : ''} ${FL.starsIf(p.star_count || 0, p.star_tier)}</div></div>
        <div class="ent-act" style="margin:0">${btn(p)}</div></div>`).join('')
      : `<div class="empty"><b>No members found</b>Try a first name, a city, or a username like @coachravi.</div>`;
  }
  $('f').onsubmit = (e) => { e.preventDefault(); run($('q').value.trim()); };
  $('res').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-connect]'); if (!b) return;
    const r = await FL.connect(b.dataset.connect, b.dataset.name);
    if (r) b.outerHTML = `<span class="chip">${I('clock', 14)}Pending</span>`;
  });
  run((FL.param('q') || '').trim());
})();
</script>
</body>
</html>
