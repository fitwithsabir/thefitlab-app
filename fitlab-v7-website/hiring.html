<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hiring — The Fit Lab</title>
<script src="assets/theme.js"></script>
<script src="assets/i18n.js"></script>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fit Lab">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .hjob{display:flex;gap:12px;padding:14px 20px;border-top:1px solid var(--line);align-items:flex-start}
  .hjob b.t{color:var(--bone);font-size:15px;display:block}
  .hjob .st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ash);vertical-align:2px;margin-left:6px}
  .hjob .st.open{border-color:var(--accent-line);color:var(--lime);background:var(--accent-soft)}
  .hjob .st.hold{border-color:var(--warn);color:var(--warn)}
  .newb{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font:700 11px/18px var(--body);text-align:center;margin-left:6px}
  .jform{padding:6px 24px 24px}
  .jform h3{font:700 16px var(--body);margin:20px 0 10px;letter-spacing:0;text-transform:none;color:var(--bone)}
  .payrow{display:grid;grid-template-columns:1fr 1fr 150px;gap:10px}
  @media (max-width:560px){ .payrow{grid-template-columns:1fr 1fr} .payrow .per{grid-column:1/-1} }
  .qrow{display:grid;grid-template-columns:1fr 150px 140px 36px;gap:8px;margin-bottom:8px;align-items:center}
  .qrow .must.off{visibility:hidden}
  @media (max-width:560px){ .qrow{grid-template-columns:1fr 1fr 36px} .qrow input{grid-column:1/-1} .qrow .must.off{display:none} }
  .paypv{font:700 15px var(--body);color:var(--lime);margin-top:4px;min-height:20px}
  .tpls{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
  .tpls .pill.on{background:var(--fill);color:var(--on-fill);border-color:var(--lime)}
  .nchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .nchips button{font:600 12px var(--body);padding:4px 10px;border-radius:999px;border:1px dashed var(--line-2);background:none;color:var(--ash);cursor:pointer}
  .nchips button:hover{color:var(--bone);border-color:var(--ash)}
  .paychk{display:flex;gap:10px;align-items:flex-start;margin:10px 0 4px;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;font-size:13.5px;line-height:1.5}
  .paychk svg{flex:none;margin-top:2px;color:var(--lime)}
  .paychk.low{border-color:var(--warn)} .paychk.low svg{color:var(--warn)}
  .paychk b{color:var(--bone)}
  .creds{display:grid;gap:8px;margin-top:6px}
  .cred{display:flex;gap:10px;align-items:center;font-size:14px}
  .cred svg{flex:none;color:var(--ash)} .cred.fl svg{color:var(--lime)}
  .cred span{flex:1;min-width:0} .cred .t-xs{display:block}
  .trialbox{border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .trialbox .ent-act{margin-top:10px}
  .chip.warn{border-color:var(--warn);color:var(--warn)}
  .apl{border-top:1px solid var(--line)}
  .apl-head{display:flex;gap:12px;padding:14px 20px;cursor:pointer;align-items:flex-start}
  .apl-head:hover{background:var(--hover)}
  .apl.open .apl-head{background:var(--accent-soft)}
  .apl-body{padding:0 20px 18px 80px}
  @media (max-width:560px){ .apl-body{padding:0 16px 16px} }
  .mscore{font:700 13px var(--body);color:var(--lime);white-space:nowrap}
  .feat-chip{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 8px}
  .stagebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .stagebar .pill.on{background:var(--fill);color:var(--on-fill);border-color:var(--lime)}
  .cfilters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:6px 20px 6px}
  .cfilters input,.cfilters select{height:38px}
  .cchecks{display:flex;gap:16px;flex-wrap:wrap;padding:6px 20px 14px;font-size:14px}
</style>
</head>
<body data-page="jobs">
<main class="page">
  <div class="layout l-main-side">
    <section class="stack" id="main"><div class="box skeleton" style="height:300px"></div></section>
    <aside><div class="sticky-col" id="side"></div></aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = FL.esc, I = FL.icon;
  const session = await FL.requireAuth(); if (!session) return;
  let me; try { me = await FL.getProfile(); } catch (e) { return FL.toast(FL.friendly(e), 'err'); }
  if (!me.profile_completed) return location.replace('register');
  FL.renderHeader(me);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const [{ data: pagesRaw }, profs] = await Promise.all([sb.rpc('my_pages'), FL.professions()]);
  const pages = pagesRaw || [];
  const STAGES = [['submitted', 'New'], ['viewed', 'Viewed'], ['shortlisted', 'Shortlisted'], ['interview', 'Interview'], ['offered', 'Offered'], ['hired', 'Hired'], ['not_selected', 'Not selected']];
  const STAGE_LBL = Object.fromEntries(STAGES);

  side();
  if (FL.param('new') || FL.param('edit')) return jobForm(FL.param('edit'));
  if (FL.param('job')) return applicants(FL.param('job'));
  if (FL.param('tab') === 'candidates') return candidates();
  if (FL.param('tab') === 'pipeline') return pipeline();
  return dashboard();

  function side() {
    $('side').innerHTML = `
      <div class="box"><div class="box-head"><h3>Your pages</h3><a class="txt-btn" href="company?new=1">${I('plus', 15)}New</a></div>
        ${pages.length ? pages.map((p) => `<div class="ent"><a href="company?p=${encodeURIComponent(p.slug)}">${FL.pageLogo(p, 'co-logo sm')}</a>
          <div class="ent-main"><a class="ent-name" href="company?p=${encodeURIComponent(p.slug)}" style="font-size:14px">${esc(p.name)}${FL.tick(p.verified, 14)}</a>
          <div class="ent-meta">${plural(p.open_jobs, 'open job')}${p.verified ? '' : ' · <a href="verification?page=' + p.page_id + '">Get verified</a>'}</div></div></div>`).join('')
        : `<p class="t-sm muted" style="padding:0 20px 16px;margin:0;line-height:1.5">Jobs are posted by organisation pages. Create your gym, studio or clinic's page first — it takes a minute.</p>`}</div>
      <div class="box box-pad"><b style="display:flex;gap:8px;align-items:center">${I('search', 18)}Find candidates</b>
        <p class="t-sm muted" style="margin:8px 0 12px;line-height:1.5">Search open-to-work trainers, physios and coaches by profession, city, certifications and experience — then InMail them.</p>
        <span style="display:flex;gap:8px;flex-wrap:wrap"><a class="pill sm" href="hiring?tab=candidates">Search candidates</a><a class="pill ghost sm" href="hiring?tab=pipeline">Talent pipeline</a></span></div>
      <div class="box box-pad"><b>Good job posts get better applicants</b>
        <ul class="checklist" style="margin-top:10px"><li>${I('check', 15)}Pay is required — be specific</li><li>${I('check', 15)}List the shift timings</li>
        <li>${I('check', 15)}Name 3–5 must-have skills</li><li>${I('check', 15)}Set a needed answer to filter automatically</li>
        <li>${I('check', 15)}Book a trial session before you hire</li><li>${I('check', 15)}Reply to everyone — your response rate is public</li></ul></div>
      ${FL.siteFootHtml(true)}`;
    FL.wireCommon($('side'));
  }

  // =========================================================== dashboard
  async function dashboard() {
    document.title = 'Hiring — The Fit Lab';
    $('main').innerHTML = `<div class="box"><div class="box-head"><div><h2>Hiring</h2><div class="sub">Your job posts and applicants</div></div>
        ${pages.length ? `<a class="pill solid sm" href="hiring?new=1">${I('plus', 15)}Post a job</a>` : ''}</div>
      <div id="jl"><div class="skeleton" style="height:70px;margin:14px"></div></div></div>`;
    if (!pages.length) {
      $('jl').innerHTML = `<div class="empty"><b>Create a page to start hiring</b>Gyms, studios and clinics post jobs from their page, so applicants know exactly who's hiring.
        <div style="margin-top:14px"><a class="pill solid" href="company?new=1">${I('building', 16)}Create a page</a></div></div>`;
      return;
    }
    const { data, error } = await sb.rpc('my_hiring');
    if (error) { $('jl').innerHTML = `<div class="empty">${esc(FL.friendly(error))}</div>`; return; }
    const list = data || [];
    $('jl').innerHTML = list.length ? list.map((j) => {
      const expired = j.status === 'open' && !j.open && !j.hold;
      const st = j.hold ? ['hold', 'On hold — reported'] : expired ? ['', 'Expired'] : j.status === 'open' ? ['open', 'Open'] : [j.status, j.status === 'paused' ? 'Paused' : 'Closed'];
      const days = Math.ceil((new Date(j.expires_at) - Date.now()) / 864e5);
      return `<div class="hjob">${FL.pageLogo(j.page, 'co-logo sm')}<div style="flex:1;min-width:0">
          <b class="t">${esc(j.title)}<span class="st ${st[0]}">${st[1]}</span>${j.promoted ? `<span class="st" style="color:var(--gold);border-color:var(--gold)">Promoted</span>` : ''}</b>
          <div class="t-sm muted">${esc(j.page.name)} · ${esc([j.city, j.type_label].filter(Boolean).join(' · '))} · ${FL.pay(j)}</div>
          <div class="t-xs muted" style="margin-top:3px">${plural(j.applicants, 'applicant')}${j.new_applicants ? `<span class="newb">${j.new_applicants} new</span>` : ''}
            · ${j.status === 'open' && days > 0 ? `closes in ${plural(days, 'day')}` : 'posted ' + FL.timeAgo(j.created_at) + ' ago'}</div>
          <div class="ent-act"><a class="pill solid sm" href="hiring?job=${j.id}">Applicants</a><a class="pill ghost sm" href="hiring?edit=${j.id}">Edit</a>
            ${j.status === 'open' && !expired ? `<button class="pill ghost sm" data-js="paused" data-id="${j.id}">Pause</button>` : ''}
            ${j.status === 'paused' ? `<button class="pill ghost sm" data-js="open" data-id="${j.id}">Reopen</button>` : ''}
            ${expired || (j.status === 'open' && days <= 5) ? `<button class="pill ghost sm" data-js="renew" data-id="${j.id}">Renew 30 days</button>` : ''}
            ${j.status !== 'closed' ? `<button class="pill ghost sm" data-js="closed" data-id="${j.id}">Close</button>` : ''}</div></div></div>`;
    }).join('') : `<div class="empty"><b>No job posts yet</b>Post your first job — it's free, and pay is always shown so you attract serious applicants.</div>`;
    $('jl').onclick = async (e) => {
      const b = e.target.closest('[data-js]'); if (!b) return;
      if (b.dataset.js === 'closed' && !(await FL.confirm('Close this job?', 'Everyone still waiting will be told the role is closed, so no one is left without an answer.', 'Close job'))) return;
      const r = await FL.call('set_job_status', { p_job: b.dataset.id, p_status: b.dataset.js });
      if (r) { FL.toast('Updated', 'ok'); dashboard(); }
    };
  }

  // =========================================================== post / edit a job
  async function jobForm(editId) {
    if (!pages.length) return dashboard();
    let j = null;
    if (editId) {
      const { data } = await sb.rpc('get_job', { p_job: editId });
      if (!data || !data.my_role) { $('main').innerHTML = `<div class="box"><div class="empty"><b>Job not found</b><a href="hiring">Back to hiring</a></div></div>`; return; }
      j = data;
    }
    document.title = (j ? 'Edit job' : 'Post a job') + ' — The Fit Lab';
    const want = FL.param('page');
    const opt = (o, v) => o.map(([k, l]) => `<option value="${k}" ${String(v) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('');
    const TITLES = ['Personal Trainer', 'Strength & Conditioning Coach', 'Group Fitness Instructor', 'Yoga Instructor', 'Pilates Instructor', 'Physiotherapist',
      'Sports Physiotherapist', 'Dietitian', 'Nutritionist', 'Massage Therapist', 'Gym Manager', 'Front Desk Executive', 'Fitness Sales Executive', 'Head Coach', 'Swimming Coach', 'Zumba Instructor'];
    // ready-made job posts for the roles gyms hire most — everything stays editable
    const CERT_Q = { q: 'Do you hold a recognised certification for this role?', type: 'yesno', must: 'yes' };
    const SHIFT_Q = { q: 'Can you work the shift timings above?', type: 'yesno', must: 'yes' };
    const TPL = {
      trainer: { label: 'Personal trainer', title: 'Personal Trainer', profession: 'personal_trainer', type: 'full_time', exp: 1,
        timings: '6–11 am and 5–9 pm, one weekly off', note: '+ incentives on PT sales',
        skills: ['Strength Training', 'Client Assessment', 'Program Design', 'Exercise Technique'], certs: ['Recognised PT certification', 'CPR & First Aid'],
        does: ['Coach members on the gym floor and keep every workout safe', 'Run fitness assessments and write personal programmes', 'Sell and deliver personal training packages', 'Keep the floor tidy, welcoming and well organised'],
        wants: ['A recognised personal training certification', 'Clear communication in English and the local language', 'Punctual, reliable and well presented'],
        qs: [CERT_Q, SHIFT_Q, { q: 'How many clients have you trained one-to-one?', type: 'text' }] },
      group: { label: 'Group fitness', title: 'Group Fitness Instructor', profession: 'group_fitness', type: 'part_time', exp: 1,
        timings: 'Morning and evening batches', note: '',
        skills: ['Class Planning', 'Music & Cueing', 'Zumba / Aerobics', 'Functional Circuits'], certs: ['Group fitness or Zumba certification'],
        does: ['Plan and lead energetic group classes', 'Adapt every class for beginners and regulars', 'Help members stay consistent and come back'],
        wants: ['Experience leading group classes', 'Strong voice, cueing and energy', 'A group fitness, Zumba or aerobics certification'],
        qs: [CERT_Q, SHIFT_Q, { q: 'Which class formats can you lead?', type: 'text' }] },
      coach: { label: 'S&C coach', title: 'Strength & Conditioning Coach', profession: 'sc_coach', type: 'full_time', exp: 2,
        timings: 'Morning and evening sessions', note: '+ incentives on PT sales',
        skills: ['Periodisation', 'Olympic Lifting', 'Speed & Agility', 'Athlete Monitoring'], certs: ['S&C certification', 'CPR & First Aid'],
        does: ['Design strength and conditioning programmes for members and athletes', 'Coach lifting technique and track progress', 'Run testing sessions and report results'],
        wants: ['An S&C certification or a degree in sports science', 'Experience coaching athletes or advanced lifters', 'Good record keeping'],
        qs: [CERT_Q, { q: 'Have you coached competitive athletes?', type: 'yesno' }, { q: 'Which sports or athletes have you coached?', type: 'text' }] },
      yoga: { label: 'Yoga', title: 'Yoga Instructor', profession: 'yoga', type: 'part_time', exp: 1,
        timings: '6–8 am and 6–8 pm batches', note: '',
        skills: ['Hatha Yoga', 'Pranayama', 'Class Sequencing', 'Alignment Cues'], certs: ['Yoga certification (e.g. YCB or RYT 200)'],
        does: ['Lead morning and evening yoga batches', 'Offer safe options for beginners and members with limitations', 'Build a regular, loyal batch'],
        wants: ['A recognised yoga teaching certification', 'Calm, clear teaching style', 'Regular attendance'],
        qs: [CERT_Q, SHIFT_Q] },
      nutrition: { label: 'Nutritionist', title: 'Nutritionist', profession: 'nutritionist', type: 'full_time', exp: 1,
        timings: '10 am – 7 pm, one weekly off', note: '+ incentives on diet plans',
        skills: ['Diet Planning', 'Body Composition Analysis', 'Client Counselling', 'Sports Nutrition'], certs: ['B.Sc / M.Sc in Nutrition or Dietetics'],
        does: ['Assess members and write personalised diet plans', 'Run follow-ups and track body composition', 'Work with trainers on each member\'s goals'],
        wants: ['A degree or diploma in nutrition or dietetics', 'Good counselling and follow-up habits', 'Knowledge of Indian diets and foods'],
        qs: [{ q: 'Do you hold a degree or diploma in nutrition or dietetics?', type: 'yesno', must: 'yes' }, { q: 'Have you counselled clients for weight loss or muscle gain?', type: 'yesno' }] },
      sales: { label: 'Sales / front desk', title: 'Fitness Sales Executive', profession: 'fitness_sales', type: 'full_time', exp: 0,
        timings: '9 am – 6 pm or 1 – 10 pm shift', note: '+ commission on memberships sold',
        skills: ['Membership Sales', 'Walk-in Handling', 'Follow-up Calls', 'Customer Service'], certs: [],
        does: ['Welcome walk-ins and show them around', 'Sell and renew memberships', 'Follow up with enquiries and members due for renewal'],
        wants: ['Confident, friendly communication', 'Interest in fitness', 'Sales experience is a plus — freshers welcome'],
        qs: [SHIFT_Q, { q: 'Have you worked in sales or customer service?', type: 'yesno' }] },
      manager: { label: 'Gym manager', title: 'Gym Manager', profession: 'gym_manager', type: 'full_time', exp: 3,
        timings: 'Full day, one weekly off', note: '+ monthly target bonus',
        skills: ['Team Management', 'Membership Sales', 'Gym Operations', 'Member Retention'], certs: [],
        does: ['Run daily operations and the staff roster', 'Hit monthly sales and renewal targets', 'Keep members happy and the gym spotless'],
        wants: ['3+ years in a gym or fitness business', 'Team leadership and sales experience', 'Comfortable with numbers and reports'],
        qs: [{ q: 'Have you managed a gym or fitness team before?', type: 'yesno', must: 'yes' }, { q: 'What monthly sales target did you last manage?', type: 'text' }] },
    };
    const NOTE_CHIPS = ['+ incentives on PT sales', '+ commission on memberships', '+ monthly target bonus', '+ free gym access', '+ certification support', '+ uniform provided'];
    const ROLE_TPL = { trainer: 'trainer', coach: 'coach', nutritionist: 'nutrition' }[FL.param('role')] || '';
    $('main').innerHTML = `<div class="box">
      <div class="box-head"><div><h2>${j ? 'Edit job' : 'Post a job'}</h2><div class="sub">Free · pay is shown on every job · closes after 30 days unless you renew</div></div>
        <a class="txt-btn" href="hiring">${I('back', 16)}Hiring</a></div>
      <form class="jform" id="jf" novalidate>
        ${j ? '' : `<div class="field"><label>Start from a ready-made post <span class="t-xs muted" style="font-weight:500">optional — edit anything</span></label>
          <div class="tpls" id="tpls">${Object.entries(TPL).map(([k, t]) => `<button type="button" class="pill ghost sm" data-tpl="${k}">${esc(t.label)}</button>`).join('')}</div></div>`}
        <div class="field"><label for="jPage" class="req">Hiring organisation</label><select id="jPage" ${j ? 'disabled' : ''}>${pages.map((p) => `<option value="${p.page_id}" ${(j ? j.page.page_id : want) === p.page_id ? 'selected' : ''}>${esc(p.name)}${p.verified ? ' ✓' : ''}</option>`).join('')}</select></div>
        <div class="field"><label for="jTitle" class="req">Job title</label><input id="jTitle" maxlength="120" list="jTitles" value="${esc(j ? j.title : '')}" placeholder="e.g. Personal Trainer"><datalist id="jTitles">${TITLES.map((t) => `<option value="${t}">`).join('')}</datalist></div>
        <div class="field"><label for="jProf">Profession</label><select id="jProf">${FL.professionOptions(profs, j ? j.profession : ({ trainer: 'personal_trainer', coach: 'sc_coach', nutritionist: 'nutritionist' })[FL.param('role')] || '', 'Choose — helps the right people find it')}</select></div>
        <div class="row2"><div class="field"><label for="jType" class="req">Job type</label><select id="jType">${opt([['', 'Choose']].concat(Object.entries(FL.JOB_TYPES)), j ? j.employment_type : '')}</select></div>
          <div class="field"><label for="jWork" class="req">Workplace</label><select id="jWork">${opt([['', 'Choose']].concat(Object.entries(FL.WORKPLACES)), j ? j.workplace : 'on_site')}</select></div></div>
        <div class="row2"><div class="field"><label for="jCity" id="jCityL" class="req">City</label><input id="jCity" maxlength="80" value="${esc(j ? j.city || '' : (pages.find((p) => p.page_id === want) || pages[0]).city || '')}"></div>
          <div class="field"><label for="jState">State</label><input id="jState" maxlength="80" value="${esc(j ? j.state || '' : '')}"></div></div>

        <h3>Pay ${I('rupee', 15)}</h3>
        <div class="payrow"><div class="field"><label for="jMin" class="req">Minimum (₹)</label><input id="jMin" type="number" inputmode="numeric" min="1" value="${j ? j.salary_min : ''}" placeholder="20000"></div>
          <div class="field"><label for="jMax" class="req">Maximum (₹)</label><input id="jMax" type="number" inputmode="numeric" min="1" value="${j ? j.salary_max : ''}" placeholder="30000"></div>
          <div class="field per"><label for="jPer" class="req">Per</label><select id="jPer">${opt([['month', 'Month'], ['year', 'Year'], ['hour', 'Hour'], ['session', 'Session']], j ? j.salary_period : 'month')}</select></div></div>
        <div class="field" style="margin-top:6px"><label for="jNote">Extra pay or perks <span class="t-xs muted" style="font-weight:500">optional</span></label>
          <input id="jNote" maxlength="140" value="${esc(j ? j.pay_note || '' : '')}" placeholder="e.g. + 30% of PT sales, monthly incentives">
          <div class="nchips" id="nChips">${NOTE_CHIPS.map((c) => `<button type="button" data-n="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
        <div class="paypv" id="payPv"></div>
        <div class="paychk hidden" id="payChk" aria-live="polite"></div>
        <p class="t-xs muted" style="margin:0">Pay is required on The Fit Lab. Jobs can never ask applicants for a fee or deposit.</p>

        <h3>The role</h3>
        <div class="row2"><div class="field"><label for="jExp">Experience needed</label><select id="jExp">${opt([[0, 'Freshers welcome'], [1, '1+ year'], [2, '2+ years'], [3, '3+ years'], [5, '5+ years'], [8, '8+ years'], [10, '10+ years']], j ? j.experience_years : 0)}</select></div>
          <div class="field"><label for="jOpen">Openings</label><input id="jOpen" type="number" inputmode="numeric" min="1" max="100" value="${j ? j.openings : 1}"></div></div>
        <div class="field"><label for="jTime">Timings</label><input id="jTime" maxlength="160" value="${esc(j ? j.timings || '' : '')}" placeholder="e.g. 6–11 am and 5–9 pm, Sunday off"></div>
        <div class="field"><label for="jDesc" class="req">Description</label>
          <textarea id="jDesc" maxlength="6000" style="min-height:220px" placeholder="What the person will do, who they'll work with, and what you offer.">${esc(j ? j.description : '')}</textarea>
          <span class="help"><button type="button" class="txt-btn" id="tpl" style="padding:0;color:var(--lime)">Use a template</button> · at least 50 characters</span></div>
        <div class="field"><label for="jSkills">Must-have skills</label><input id="jSkills" maxlength="400" value="${esc(j ? (j.skills || []).join(', ') : '')}" placeholder="e.g. Strength Training, Client Assessment, Program Design">
          <span class="help">Separate with commas, up to 10. Applicants see how many they match.</span></div>
        <div class="field"><label for="jCerts">Certifications required</label><input id="jCerts" maxlength="300" value="${esc(j ? (j.certifications || []).join(', ') : '')}" placeholder="e.g. Fit Lab Certified, CPR & First Aid">
          <span class="help">Separate with commas, up to 5.</span></div>

        <h3>Screening questions <span class="t-xs muted" style="font-weight:500">optional, up to 3</span></h3>
        <div id="qs"></div><button type="button" class="pill ghost sm" id="addQ">${I('plus', 14)}Add a question</button>
        <p class="t-xs muted" style="margin:10px 0 0;line-height:1.5">A Yes / No question can have a <b>needed answer</b>. Applicants who answer differently get a kind, automatic reply and are listed last — they never see which answer you need, and you can still move them forward.</p>

        <div class="err hidden" id="jErr" style="margin-top:16px"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><a class="pill ghost" href="hiring">Cancel</a><button class="pill solid lg" id="jGo">${j ? 'Save changes' : 'Post job'}</button></div>
      </form></div>`;

    const qs = $('qs');
    const addQ = (q = { q: '', type: 'text' }) => {
      if (qs.children.length >= 3) return;
      const row = document.createElement('div'); row.className = 'qrow';
      row.innerHTML = `<input maxlength="200" placeholder="e.g. Can you work early mornings?" value="${esc(q.q)}" aria-label="Question">
        <select class="qt" aria-label="Answer type"><option value="text" ${q.type !== 'yesno' ? 'selected' : ''}>Short answer</option><option value="yesno" ${q.type === 'yesno' ? 'selected' : ''}>Yes / No</option></select>
        <select class="must" aria-label="Needed answer"><option value="">Any answer</option><option value="yes" ${q.must === 'yes' ? 'selected' : ''}>Must be Yes</option><option value="no" ${q.must === 'no' ? 'selected' : ''}>Must be No</option></select>
        <button type="button" class="icon-btn" aria-label="Remove question">${I('trash', 17)}</button>`;
      const qt = row.querySelector('.qt'), must = row.querySelector('.must');
      const sync = () => { const yn = qt.value === 'yesno'; must.classList.toggle('off', !yn); must.disabled = !yn; if (!yn) must.value = ''; };
      qt.onchange = sync; sync();
      row.querySelector('button').onclick = () => { row.remove(); $('addQ').hidden = false; };
      qs.appendChild(row); $('addQ').hidden = qs.children.length >= 3;
    };
    ((j && j.questions) || []).forEach(addQ);
    $('addQ').onclick = () => addQ();
    const pv = () => {
      const a = +$('jMin').value, b = +$('jMax').value, n = $('jNote').value.trim();
      $('payPv').textContent = a > 0 && b >= a ? 'Shown as: ' + FL.pay({ salary_min: a, salary_max: b, salary_period: $('jPer').value }) + (n ? ' · ' + n : '') : '';
    };
    ['jMin', 'jMax', 'jPer', 'jNote'].forEach((id) => $(id).addEventListener('input', pv)); pv();
    $('nChips').onclick = (e) => {
      const b = e.target.closest('[data-n]'); if (!b) return;
      const cur = $('jNote').value.trim(), add = b.dataset.n;
      if (cur.toLowerCase().includes(add.replace(/^\+ /, '').toLowerCase())) return;
      const next = cur ? cur + ', ' + add.replace(/^\+ /, '') : add;
      if (next.length > 140) return FL.toast('The note can be up to 140 characters', 'err');
      $('jNote').value = next; pv();
    };
    // pay check: what similar Fit Lab jobs pay (monthly), city → state → India
    let benchT = 0, benchSeq = 0;
    const bench = () => { clearTimeout(benchT); benchT = setTimeout(async () => {
      const box = $('payChk'), per = $('jPer').value, prof = $('jProf').value;
      if (!prof || !['month', 'year'].includes(per)) { box.classList.add('hidden'); return; }
      const seq = ++benchSeq;
      const { data } = await sb.rpc('job_pay_benchmark', { p_profession: prof, p_city: $('jCity').value.trim() || null, p_state: $('jState').value.trim() || null });
      if (seq !== benchSeq) return;
      if (!data || !data.enough) { box.classList.add('hidden'); return; }
      const k = per === 'year' ? 12 : 1, lo = (+$('jMin').value || 0) / k, hi = (+$('jMax').value || 0) / k;
      const label = (($('jProf').selectedOptions[0] || {}).textContent || 'similar').trim();
      let verdict = '', low = false;
      if (hi > 0 && hi < data.low) { verdict = 'Your top pay is below most similar jobs — you may get fewer applicants.'; low = true; }
      else if (lo > 0 && lo >= data.median) verdict = 'Above the typical pay — expect strong interest.';
      else if (hi > 0) verdict = 'Your range is in line with similar jobs.';
      box.className = 'paychk' + (low ? ' low' : '');
      box.innerHTML = `${I(low ? 'help' : 'chart', 18)}<div><b>${esc(label)} jobs in ${esc(data.place)}</b> pay about <b>${FL.inr(data.low)}–${FL.inr(data.high).slice(1)}</b> a month (typical ${FL.inr(data.median)}).
        <span class="t-xs muted">Based on ${data.count} Fit Lab job posts.</span>${verdict ? `<br>${esc(verdict)}` : ''}</div>`;
    }, 450); };
    ['jProf', 'jPer'].forEach((id) => $(id).addEventListener('change', bench));
    ['jCity', 'jState', 'jMin', 'jMax'].forEach((id) => $(id).addEventListener('input', bench)); bench();
    const cityReq = () => { $('jCityL').classList.toggle('req', $('jWork').value !== 'remote'); };
    $('jWork').onchange = cityReq; cityReq();
    const orgName = () => (($('jPage').selectedOptions[0] || {}).textContent || 'our team').replace(' ✓', '').trim();
    const BENEFITS = 'Add your benefits here — e.g. free gym access, uniform, certification support';
    $('tpl').onclick = async () => {
      if ($('jDesc').value.trim() && !(await FL.confirm('Replace the description?', 'Your description will be replaced with the template.', 'Replace'))) return;
      $('jDesc').value = `About the role\nWe're looking for a ${$('jTitle').value.trim() || 'coach'} to join ${orgName()}.\n\nWhat you'll do\n• \n• \n• \n\nWhat we're looking for\n• \n• \n\nWhat we offer\n• Pay as shown above\n• ${BENEFITS}`;
      $('jDesc').focus();
    };
    const useTpl = (k) => {
      const t = TPL[k]; if (!t) return;
      const city = $('jCity').value.trim();
      $('jTitle').value = t.title; $('jProf').value = t.profession; $('jType').value = t.type; $('jExp').value = String(t.exp);
      $('jTime').value = t.timings; $('jSkills').value = t.skills.join(', '); $('jCerts').value = t.certs.join(', ');
      if (!$('jNote').value.trim()) $('jNote').value = t.note;
      $('jDesc').value = `About the role\nWe're looking for a ${t.title} to join ${orgName()}${city ? ' in ' + city : ''}.\n\nWhat you'll do\n${t.does.map((x) => '• ' + x).join('\n')}\n\n`
        + `What we're looking for\n${t.wants.map((x) => '• ' + x).join('\n')}\n\nWhat we offer\n• Pay as shown above${t.note ? ' ' + t.note : ''}\n• ${BENEFITS}`;
      qs.innerHTML = ''; t.qs.forEach(addQ); $('addQ').hidden = qs.children.length >= 3;
      document.querySelectorAll('#tpls [data-tpl]').forEach((b) => b.classList.toggle('on', b.dataset.tpl === k));
      pv(); bench();
    };
    const tp = $('tpls');
    if (tp) tp.onclick = async (e) => {
      const b = e.target.closest('[data-tpl]'); if (!b) return;
      if (($('jDesc').value.trim() || $('jTitle').value.trim()) && !(await FL.confirm(`Use the ${TPL[b.dataset.tpl].label.toLowerCase()} template?`,
        'This fills the title, skills, description and screening questions. Your pay stays as it is, and you can edit everything before posting.', 'Use template'))) return;
      useTpl(b.dataset.tpl);
      FL.toast('Template added — check the pay, timings and benefits', 'ok');
    };
    if (!j && ROLE_TPL) useTpl(ROLE_TPL);
    const list = (v, n) => v.split(',').map((s) => s.trim()).filter(Boolean).slice(0, n);
    $('jf').onsubmit = async (e) => {
      e.preventDefault();
      const err = $('jErr'); const show = (t) => { err.textContent = t; err.classList.remove('hidden'); err.scrollIntoView({ block: 'center' }); };
      const p = { title: $('jTitle').value.trim(), profession: $('jProf').value, employment_type: $('jType').value, workplace: $('jWork').value,
        city: $('jCity').value.trim(), state: $('jState').value.trim(), salary_min: $('jMin').value.trim(), salary_max: $('jMax').value.trim(),
        salary_period: $('jPer').value, pay_note: $('jNote').value.trim(), experience_years: $('jExp').value, openings: $('jOpen').value.trim() || '1', timings: $('jTime').value.trim(),
        description: $('jDesc').value.trim(), skills: list($('jSkills').value, 10), certifications: list($('jCerts').value, 5),
        questions: [...qs.children].map((r) => {
          const q = { q: r.querySelector('input').value.trim(), type: r.querySelector('.qt').value }, m = r.querySelector('.must').value;
          if (q.type === 'yesno' && m) q.must = m; return q;
        }).filter((q) => q.q) };
      if (p.description.includes('Add your benefits here')) return show('Replace the line “Add your benefits here…” in the description with what you offer — or delete it.');
      if (p.title.length < 3) return show('Add a job title.');
      if (!p.employment_type) return show('Choose the job type.');
      if (!p.workplace) return show('Choose the workplace.');
      if (p.workplace !== 'remote' && p.city.length < 2) return show('Add the city for this job.');
      if (!(+p.salary_min > 0) || !(+p.salary_max >= +p.salary_min)) return show('Enter the pay range — the maximum must be at least the minimum.');
      if (p.description.length < 50) return show('Describe the role in at least 50 characters.');
      if (p.questions.some((q) => q.q.length < 5)) return show('Screening questions need at least 5 characters.');
      err.classList.add('hidden');
      FL.busy($('jGo'), true, j ? 'Saving…' : 'Posting…');
      const r = await FL.call('save_job', { p_page: j ? null : $('jPage').value, p_job: j ? j.id : null, p });
      FL.busy($('jGo'), false);
      if (r) { FL.toast(j ? 'Job updated' : 'Job posted — followers and matching job alerts are notified', 'ok'); location.href = 'hiring?job=' + r.id; }
    };
  }

  // =========================================================== applicants
  async function applicants(jobId) {
    const { data: j } = await sb.rpc('get_job', { p_job: jobId });
    if (!j || !j.my_role) { $('main').innerHTML = `<div class="box"><div class="empty"><b>Job not found</b>Only the page's team can see applicants. <a href="hiring">Back to hiring</a></div></div>`; return; }
    document.title = `Applicants · ${j.title} — The Fit Lab`;
    let filter = FL.param('s') || '', all = [], openId = null;
    const head = () => `<div class="box"><div class="box-head" style="align-items:flex-start"><div style="display:flex;gap:12px">${FL.pageLogo(j.page, 'co-logo sm')}
        <div><h2 style="font-size:18px">${esc(j.title)}</h2><div class="sub">${esc(j.page.name)} · ${FL.pay(j)} · ${j.open ? 'Open' : j.hold ? 'On hold' : 'Not accepting applications'}</div></div></div>
        <a class="txt-btn" href="hiring">${I('back', 16)}All jobs</a></div>
      <div class="ent-act" style="padding:0 20px 14px"><a class="pill ghost sm" href="jobs?job=${j.id}">View listing</a><a class="pill ghost sm" href="hiring?edit=${j.id}">Edit</a>
        ${j.open ? `<button class="pill ghost sm" id="promote">${I('zap', 14)}${j.promoted ? 'Promoted' : 'Promote'}</button>` : ''}
        ${j.status !== 'closed' ? `<button class="pill ghost sm" id="closeJ">Close job</button>` : ''}</div>
      <div class="utabs" id="stabs"></div><div id="al"><div class="skeleton" style="height:80px;margin:14px"></div></div></div>`;
    $('main').innerHTML = head();
    const pr = $('promote'); if (pr) pr.onclick = async () => { if (j.promoted) return; const r = await FL.call('promote_job', { p_job: j.id }); if (r) { FL.toast('Promoted for 14 days — shown first in search', 'ok'); pr.innerHTML = I('zap', 14) + 'Promoted'; j.promoted = true; } };
    const cj = $('closeJ'); if (cj) cj.onclick = async () => {
      if (!(await FL.confirm('Close this job?', 'Everyone still waiting will be told the role is closed.', 'Close job'))) return;
      const r = await FL.call('set_job_status', { p_job: j.id, p_status: 'closed' }); if (r) location.reload(); };

    async function load() {
      const { data, error } = await sb.rpc('job_applicants', { p_job: j.id, p_status: null });
      if (error) { $('al').innerHTML = `<div class="empty">${esc(FL.friendly(error))}</div>`; return; }
      all = data || [];
      draw();
    }
    function draw() {
      const n = (s) => all.filter((a) => a.status === s).length;
      $('stabs').innerHTML = [['', `All (${all.length})`]].concat(STAGES.map(([k, l]) => [k, `${l}${n(k) ? ' (' + n(k) + ')' : ''}`]))
        .map(([k, l]) => `<button data-s="${k}" class="${filter === k ? 'on' : ''}">${l}</button>`).join('');
      const list = all.filter((a) => !filter || a.status === filter);
      $('al').innerHTML = list.length ? list.map((a) => `<div class="apl ${openId === a.application_id ? 'open' : ''}" data-app="${a.application_id}">
          <div class="apl-head" tabindex="0" role="button" aria-expanded="${openId === a.application_id}">${FL.ringAvatar(a, 'avatar')}
            <div style="flex:1;min-width:0"><b class="ent-name">${esc(a.full_name)}${FL.tags(a)}</b>
              <div class="ent-sub">${esc(a.headline || a.profession_label || '')}</div>
              <div class="ent-meta">${esc([a.profession_label, a.city, a.experience_years ? a.experience_years + ' yrs experience' : 'New to the field'].filter(Boolean).join(' · '))} · applied ${FL.timeAgo(a.created_at) === 'now' ? 'just now' : FL.timeAgo(a.created_at) + ' ago'}</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center">${a.premium ? `<span class="feat-chip">${I('crown', 11)}Featured</span>` : ''}
                <span class="chip ${a.status === 'submitted' ? 'acc' : ''}">${STAGE_LBL[a.status] || a.status}</span>
                ${a.screened_out ? `<span class="chip warn" title="${esc(a.screened_out)}">Needed answer not met</span>` : ''}
                ${(a.fitlab_certs || []).length ? `<span class="chip acc">${I('award', 12)}Fit Lab certified</span>` : ''}
                ${(a.credentials || []).filter((c) => !c.expired).length ? `<span class="chip">${plural(a.credentials.filter((c) => !c.expired).length, 'certification')}</span>` : ''}
                ${a.trial && ['proposed', 'confirmed'].includes(a.trial.status) ? `<span class="chip ${a.trial.status === 'confirmed' ? 'acc' : ''}">${I('calendar', 12)}Trial ${a.trial.status === 'confirmed' ? 'confirmed' : 'invited'}</span>` : ''}</div></div>
            ${a.match && a.match.total ? `<span class="mscore">${a.match.met}/${a.match.total} match</span>` : ''}</div>
          ${openId === a.application_id ? detail(a) : ''}</div>`).join('')
        : `<div class="empty"><b>${all.length ? 'No one at this stage' : 'No applicants yet'}</b>${all.length ? '' : 'You\'ll be notified when someone applies. Promoting the job or sharing its link helps.'}</div>`;
    }
    const TRIAL_LBL = { proposed: 'Waiting for their reply', confirmed: 'Confirmed', declined: 'Declined', cancelled: 'Cancelled', done: 'Done', no_show: 'Didn\'t turn up' };
    const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : '';
    function certs(a) {
      const fl = a.fitlab_certs || [], cr = a.credentials || [];
      if (!fl.length && !cr.length) return `<div class="qa"><b>Certifications</b>None added yet — ask about them when you message ${esc(a.full_name.split(' ')[0])}.</div>`;
      return `<div class="qa"><b>Certifications</b><div class="creds">
        ${fl.map((c) => `<div class="cred fl">${I('award', 17)}<span>${esc(c.title)}<span class="t-xs muted">The Fit Lab · QR-verified${c.issued_at ? ' · ' + new Date(c.issued_at).getFullYear() : ''}</span></span>
          ${a.unique_id ? `<a class="txt-btn" href="verify?id=${encodeURIComponent(a.unique_id)}" target="_blank" rel="noopener">Verify</a>` : ''}</div>`).join('')}
        ${cr.map((c) => `<div class="cred">${I('award', 17)}<span>${esc(c.name)}${c.expired ? ' <span class="chip warn" style="padding:0 8px">Expired</span>' : ''}<span class="t-xs muted">${esc(c.issuer)} · added by the candidate</span></span>
          ${safeUrl(c.url) ? `<a class="txt-btn" href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener nofollow">${I('external', 14)}Check</a>` : ''}</div>`).join('')}</div>
        ${cr.length ? `<span class="t-xs muted" style="display:block;margin-top:8px">Certifications from other providers count just the same — open the link or ask to see the certificate.</span>` : ''}</div>`;
    }
    function trial(a) {
      const t = a.trial;
      if (!t) return '';
      const live = ['proposed', 'confirmed'].includes(t.status);
      return `<div class="trialbox"><b style="display:flex;gap:8px;align-items:center">${I('calendar', 16)}Trial session · <span class="${t.status === 'confirmed' || t.status === 'done' ? 'mscore' : ''}">${TRIAL_LBL[t.status] || t.status}</span></b>
        <div class="t-sm" style="margin-top:4px">${esc(t.when)} · ${t.minutes} min${t.place ? ' · ' + esc(t.place) : ''}</div>
        ${t.note ? `<div class="t-sm muted">${esc(t.note)}</div>` : ''}
        ${t.reply ? `<div class="t-sm" style="margin-top:6px">“${esc(t.reply)}”</div>` : ''}
        ${live ? `<div class="ent-act">${t.upcoming ? `<button class="pill ghost sm" data-trial="book">Change time</button><button class="pill ghost sm" data-trial="cancelled">Cancel trial</button>`
          : `<button class="pill sm" data-trial="done">${I('check', 14)}Mark done</button><button class="pill ghost sm" data-trial="no_show">Didn't turn up</button>`}</div>` : ''}</div>`;
    }
    function detail(a) {
      const m = a.match || { items: [] };
      const first = esc(a.full_name.split(' ')[0]);
      const canTrial = !a.trial || !['proposed', 'confirmed'].includes(a.trial.status);
      return `<div class="apl-body">
        ${a.screened_out ? `<div class="notice warn" style="margin:0 0 10px">${I('help', 18)}<div class="t-sm" style="line-height:1.5">${first} answered “${esc(a.screened_out)}” differently from what you need, and has had a kind automatic reply. You can still move them forward.</div></div>` : ''}
        ${(m.items || []).length ? `<ul class="checklist">${m.items.map((x) => `<li><span style="color:${x.ok ? 'var(--lime)' : 'var(--ash)'}">${I(x.ok ? 'check' : 'close', 15)}</span>${esc(x.label)}</li>`).join('')}</ul>` : ''}
        ${certs(a)}
        ${a.note ? `<div class="qa"><b>Note from ${first}</b>${FL.linkify(a.note)}</div>` : ''}
        ${(a.answers || []).map((x) => `<div class="qa"><b>${esc(x.q)}</b>${esc(x.a)}</div>`).join('')}
        ${a.employer_note ? `<div class="qa"><b>Your team's note (private)</b>${esc(a.employer_note)}</div>` : ''}
        ${trial(a)}
        <div class="stagebar">${STAGES.filter(([k]) => !['submitted', 'viewed'].includes(k)).map(([k, l]) => `<button class="pill sm ${a.status === k ? 'on' : k === 'not_selected' ? 'ghost' : ''}" data-st="${k}">${l}</button>`).join('')}</div>
        <div class="ent-act"><button class="pill solid sm" data-msg="1">${I('mail', 15)}Message ${first}</button>
          ${canTrial && !['hired', 'withdrawn'].includes(a.status) ? `<button class="pill sm" data-trial="book">${I('calendar', 15)}Book a trial session</button>` : ''}
          <a class="pill ghost sm" href="profile?u=${encodeURIComponent(a.username)}" target="_blank" rel="noopener">${I('eye', 15)}Full profile</a></div>
        <p class="t-xs muted" style="margin:10px 0 0">${first} sees each stage you choose. “Not selected” sends a kind, final update — no one is left waiting.</p></div>`;
    }
    function bookTrial(a) {
      const pad = (n) => String(n).padStart(2, '0'), d = new Date(Date.now() + 864e5);
      const ymd = (x) => `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
      const prev = a.trial && ['proposed', 'confirmed'].includes(a.trial.status) ? a.trial : null;
      FL.form({ title: `Trial session with ${a.full_name.split(' ')[0]}`, saveLabel: prev ? 'Send new time' : 'Send invite',
        note: `${a.full_name.split(' ')[0]} gets a notification to confirm or decline.${prev ? ' The earlier time is replaced.' : ''}`,
        values: { date: ymd(d), time: '10:00', minutes: prev ? String(prev.minutes) : '60', place: prev ? prev.place || '' : [j.page.name, j.city].filter(Boolean).join(', '), note: prev ? prev.note || '' : '' },
        fields: [
          { k: 'date', label: 'Date', type: 'date', req: true, half: true, min: ymd(new Date()) },
          { k: 'time', label: 'Time', type: 'time', req: true, half: true },
          { k: 'minutes', label: 'How long', type: 'select', options: [['30', '30 minutes'], ['45', '45 minutes'], ['60', '1 hour'], ['90', '1½ hours'], ['120', '2 hours']] },
          { k: 'place', label: 'Where', max: 200, ph: 'Gym name and area' },
          { k: 'note', label: 'What to expect (optional)', type: 'textarea', max: 500, rows: 80, ph: 'e.g. Bring gym wear. You\'ll take one member through a 30-minute session.' }],
        onSave: async (v) => {
          const at = new Date(`${v.date}T${v.time}`);
          if (isNaN(at)) throw new Error('Choose a date and time.');
          const { data, error } = await sb.rpc('schedule_trial', { p_app: a.application_id, p_at: at.toISOString(), p_minutes: +v.minutes, p_place: v.place || null, p_note: v.note || null });
          if (error) throw error;
          if (data && data.ok === false) throw new Error(data.message);
          a.trial = data.trial; if (['submitted', 'viewed', 'shortlisted', 'not_selected'].includes(a.status)) { a.status = 'interview'; a.screened_out = null; }
          FL.toast(`Trial invite sent to ${a.full_name.split(' ')[0]}`, 'ok'); draw();
        } });
    }
    $('stabs').onclick = (e) => { const b = e.target.closest('[data-s]'); if (!b) return; filter = b.dataset.s; draw(); };
    $('al').addEventListener('click', async (e) => {
      const card = e.target.closest('[data-app]'); if (!card) return;
      const a = all.find((x) => x.application_id === card.dataset.app);

        return;
      }
      if (e.target.closest('[data-msg]')) {
        const { data: ok } = await sb.rpc('inmail_allowed', { p_from: me.id, p_to: a.user_id });
        if (ok && (ok.connected || ok.existing)) return location.href = 'messaging?u=' + encodeURIComponent(a.username);
        if (ok && ok.ok) return FL.inmail(a, ok);
        return FL.toast((ok && ok.reason) || 'You can\'t message this member.', 'err');
      }
      const tb = e.target.closest('[data-trial]');
      if (tb) {
        if (tb.dataset.trial === 'book') return bookTrial(a);
        if (tb.dataset.trial === 'cancelled' && !(await FL.confirm('Cancel the trial?', `${a.full_name.split(' ')[0]} will be told it's cancelled.`, 'Cancel trial', true))) return;
        const r = await FL.call('update_trial', { p_trial: a.trial.id, p_status: tb.dataset.trial });
        if (r) { a.trial = r.trial; FL.toast(tb.dataset.trial === 'cancelled' ? 'Trial cancelled' : 'Trial updated', 'ok'); draw(); }
        return;
      }
      if (e.target.closest('a,button')) return;
      if (e.target.closest('.apl-head')) {
        openId = openId === a.application_id ? null : a.application_id;
        if (openId && a.status === 'submitted') {
          const r = await FL.call('set_application_status', { p_app: a.application_id, p_status: 'viewed', p_note: null }, { quiet: true });
          if (r) a.status = 'viewed';
        }
        draw();
      }
    });
    $('al').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('apl-head')) e.target.click(); });
    load();
  }

  // =========================================================== candidate search (Recruiter)
  async function candidates() {
    document.title = 'Find candidates — The Fit Lab';
    $('main').innerHTML = `<div class="box"><div class="box-head"><div><h2>Find candidates ${I('crown', 16)}</h2><div class="sub">Recruiter Premium · open-to-work members by default</div></div>
        <span style="display:flex;gap:12px"><a class="txt-btn" href="hiring?tab=pipeline">${I('bookmark', 16)}Pipeline</a><a class="txt-btn" href="hiring">${I('back', 16)}Hiring</a></span></div>
      <form id="cf"><div class="cfilters">
          <select id="cp" aria-label="Profession">${FL.professionOptions(profs, '', 'Any profession')}</select>
          <input id="cc" type="search" placeholder="City" aria-label="City" value="${esc(me.city || '')}">
          <input id="cs" placeholder="Skills, comma separated" aria-label="Skills">
          <select id="cy" aria-label="Experience"><option value="0">Any experience</option><option value="1">1+ year</option><option value="3">3+ years</option><option value="5">5+ years</option></select></div>
        <div class="cchecks"><label class="check"><input type="checkbox" id="co" checked><span>Open to work only</span></label>
          <label class="check"><input type="checkbox" id="cv"><span>Verified only</span></label><label class="check"><input type="checkbox" id="ct"><span>Fit Lab certified only</span></label>
          <button class="pill solid sm" style="margin-left:auto">Search</button></div></form>
      <div id="cr"></div></div>`;
    const run = async () => {
      $('cr').innerHTML = '<div class="skeleton" style="height:70px;margin:14px"></div>';
      const { data, error } = await sb.rpc('search_candidates', { p: { q: '', profession: $('cp').value, city: $('cc').value.trim(),
        skills: $('cs').value.split(',').map((s) => s.trim()).filter(Boolean), min_years: $('cy').value, open_to_work: $('co').checked,
        verified: $('cv').checked, certified: $('ct').checked } });
      if (error) { $('cr').innerHTML = `<div class="empty">${esc(FL.friendly(error))}</div>`; return; }
      if (data && data.ok === false) {
        $('cr').innerHTML = `<div class="prem-box" style="margin:6px 20px 20px"><h3>${I('crown', 16)}Candidate search is part of Recruiter</h3>
          <div class="t-sm" style="line-height:1.55">Search every open-to-work trainer, physio, dietitian and coach by profession, city, skills, experience and certification — and InMail them directly. Try it free for 14 days.</div>
          <a class="pill gold sm" href="premium?plan=recruiter" style="margin-top:10px">Try Recruiter free</a></div>`;
        return;
      }
      const list = (data && data.results) || [];
      $('cr').innerHTML = list.length ? list.map((c) => `<div class="ent"><a href="profile?u=${encodeURIComponent(c.username)}" target="_blank" rel="noopener">${FL.ringAvatar(c, 'avatar')}</a>
          <div class="ent-main"><a class="ent-name" href="profile?u=${encodeURIComponent(c.username)}" target="_blank" rel="noopener">${esc(c.full_name)}${FL.tags(c)}</a>
            <div class="ent-sub">${esc(c.headline || '')}</div>
            <div class="ent-meta">${esc([c.profession_label, c.city, c.experience_years ? c.experience_years + ' yrs' : 'Fresher'].filter(Boolean).join(' · '))}${c.certified ? ' · Fit Lab certified' : ''}</div>
            ${(c.skills || []).length ? `<div class="ph-badges" style="margin-top:6px">${c.skills.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>` : ''}
            <div class="ent-act">${c.can_inmail && (c.can_inmail.connected || c.can_inmail.existing) ? `<a class="pill sm" href="messaging?u=${encodeURIComponent(c.username)}">Message</a>`
              : c.can_inmail && c.can_inmail.ok ? `<button class="pill sm" data-im="${c.user_id}">${I('mail', 14)}InMail</button>` : `<span class="t-xs muted">${esc((c.can_inmail && c.can_inmail.reason) || '')}</span>`}
              <button class="pill ghost sm" data-save="${c.user_id}">${I('bookmark', 14)}Save</button></div></div></div>`).join('')
        : `<div class="empty"><b>No candidates match</b>Try fewer filters or a nearby city.</div>`;
      $('cr').querySelectorAll('[data-im]').forEach((b) => { b.onclick = () => { const c = list.find((x) => x.user_id === b.dataset.im); FL.inmail(c, c.can_inmail).then((r) => { if (r) { b.disabled = true; b.textContent = 'InMail sent'; } }); }; });
      $('cr').querySelectorAll('[data-save]').forEach((b) => { b.onclick = async () => { const r = await FL.call('save_candidate', { p_candidate: b.dataset.save, p_stage: 'saved', p_note: null }); if (r) { b.disabled = true; b.innerHTML = I('check', 14) + 'Saved'; FL.toast('Added to your talent pipeline', 'ok'); } }; });
    };
    $('cf').onsubmit = (e) => { e.preventDefault(); run(); };
    run();
  }

  // =========================================================== talent pipeline (Recruiter)
  async function pipeline() {
    document.title = 'Talent pipeline — The Fit Lab';
    const PST = [['saved', 'Saved'], ['contacted', 'Contacted'], ['interview', 'Interview'], ['offer', 'Offer'], ['hired', 'Hired'], ['not_now', 'Not now']];
    let stage = null;
    $('main').innerHTML = `<div class="box"><div class="box-head"><div><h2>Talent pipeline ${I('crown', 16)}</h2><div class="sub">Candidates you've saved, with your private notes and stages</div></div>
        <span style="display:flex;gap:12px"><a class="txt-btn" href="hiring?tab=candidates">${I('search', 16)}Find candidates</a><a class="txt-btn" href="hiring">${I('back', 16)}Hiring</a></span></div>
      <div class="catbar" id="pst"></div><div id="pl"><div class="skeleton" style="height:70px;margin:14px"></div></div></div>`;
    async function load() {
      const { data, error } = await sb.rpc('saved_candidates_list', { p_stage: stage });
      if (error) { $('pl').innerHTML = `<div class="empty">${esc(FL.friendly(error))}</div>`; return; }
      if (data && data.ok === false) {
        $('pst').innerHTML = '';
        $('pl').innerHTML = `<div class="prem-box" style="margin:6px 20px 20px"><h3>${I('crown', 16)}The talent pipeline is part of Recruiter</h3>
          <div class="t-sm" style="line-height:1.55">Save promising trainers, physios and coaches as you search, add notes, and move them through Contacted → Interview → Offer → Hired.</div>
          <a class="pill gold sm" href="premium?plan=recruiter" style="margin-top:10px">Try Recruiter free</a></div>`;
        return;
      }
      const counts = data.counts || {}, total = Object.values(counts).reduce((a, b) => a + b, 0);
      $('pst').innerHTML = [[null, 'All', total]].concat(PST.map(([k, l]) => [k, l, counts[k] || 0]))
        .map(([k, l, n]) => `<button class="${stage === k ? 'on' : ''}" data-ps="${k || ''}">${l} <b>${n}</b></button>`).join('');
      const list = data.results || [];
      $('pl').innerHTML = list.length ? list.map((c) => `<div class="ent" data-c="${c.user_id}"><a href="profile?u=${encodeURIComponent(c.username)}">${FL.ringAvatar(c, 'avatar')}</a>
          <div class="ent-main"><a class="ent-name" href="profile?u=${encodeURIComponent(c.username)}">${esc(c.full_name)}${FL.tags(c)}</a>
            <div class="ent-sub">${esc(c.headline || '')}</div>
            <div class="ent-meta">${esc([c.profession_label, c.city].filter(Boolean).join(' · '))} · saved ${FL.timeAgo(c.saved_at)} ago</div>
            ${c.note ? `<div class="inv-note" style="margin-top:6px">${esc(c.note)}</div>` : ''}
            <div class="ent-act"><select class="inv-tag" data-stage aria-label="Stage">${PST.map(([k, l]) => `<option value="${k}" ${k === c.stage ? 'selected' : ''}>${l}</option>`).join('')}</select>
              <button class="pill ghost sm" data-note>${I('edit', 14)}Note</button>
              ${c.can_inmail && (c.can_inmail.connected || c.can_inmail.existing || c.can_inmail.context === 'open') ? `<a class="pill sm" href="messaging?u=${encodeURIComponent(c.username)}">Message</a>`
                : c.can_inmail && c.can_inmail.ok ? `<button class="pill sm" data-im>${I('mail', 14)}InMail</button>` : ''}
              <button class="txt-btn" data-rm>Remove</button></div></div></div>`).join('')
        : `<div class="empty"><b>${stage ? 'No one at this stage' : 'Your pipeline is empty'}</b>${stage ? '' : 'Tap “Save” on candidates in search to keep track of them here.'}</div>`;
      $('pl')._list = list;
    }
    $('pst').onclick = (e) => { const b = e.target.closest('[data-ps]'); if (!b) return; stage = b.dataset.ps || null; load(); };
    $('pl').addEventListener('change', async (e) => {
      const sel = e.target.closest('[data-stage]'); if (!sel) return;
      const id = sel.closest('[data-c]').dataset.c;
      const r = await FL.call('save_candidate', { p_candidate: id, p_stage: sel.value, p_note: null });
      if (r) { FL.toast('Moved to ' + (PST.find((x) => x[0] === sel.value) || [])[1], 'ok'); load(); }
    });
    $('pl').addEventListener('click', async (e) => {
      const row = e.target.closest('[data-c]'); if (!row) return;
      const c = ($('pl')._list || []).find((x) => x.user_id === row.dataset.c); if (!c) return;
      if (e.target.closest('[data-rm]')) { if (await FL.confirm('Remove from pipeline?', `${c.full_name} will be removed from your saved candidates.`, 'Remove', true)) { await FL.call('remove_candidate', { p_candidate: c.user_id }); load(); } return; }
      if (e.target.closest('[data-im]')) { const r = await FL.inmail(c, c.can_inmail); if (r) load(); return; }
      if (e.target.closest('[data-note]')) {
        const m = FL.modal({ title: 'Note about ' + c.full_name, body: `<textarea id="pn" maxlength="1000" style="min-height:120px" placeholder="Private — only you see this">${esc(c.note || '')}</textarea>`,
          foot: `<button class="pill solid" data-ok>Save note</button>` });
        m.q('[data-ok]').onclick = async () => { const r = await FL.call('save_candidate', { p_candidate: c.user_id, p_stage: null, p_note: m.q('#pn').value }); if (r) { m.close(); load(); } };
      }
    });
    load();
  }
})();
</script>
