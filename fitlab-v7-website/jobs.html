<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jobs — The Fit Lab</title>
<meta name="description" content="Jobs for trainers, coaches, physios, doctors, dietitians and everyone in health and fitness. Pay always shown. No fees, ever.">
<script src="assets/theme.js"></script>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fit Lab">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .page.jobs{padding-top:18px}
  @media (max-width:767px){ .page.jobs{padding:0} .page.jobs .box{border-radius:0;border-left:0;border-right:0} }
  .alert-row{display:flex;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
  .alert-row b{display:block;font-size:14.5px}
  .trust{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ash)}
  .trust span{display:inline-flex;gap:6px;align-items:center}
  .trust svg{color:var(--lime)}
  .pnote{font-weight:600;color:var(--lime)}
  .tline{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--lime)}
  .trialbox{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0}
  .trialbox h3{font:700 16px var(--body);margin:0 0 6px;letter-spacing:0;text-transform:none;display:flex;gap:8px;align-items:center}
  .trialbox .t-sm{line-height:1.6}
  .trialbox .jacts{margin:12px 0 0}
</style>
</head>
<body data-page="jobs">
<main class="page jobs">
  <div class="box">
    <div class="jobs-top">
      <form class="jobs-search" id="sf">
        <div class="fi"><span id="icQ"></span><input id="q" type="search" placeholder="Title, skill or organisation" aria-label="Search jobs"></div>
        <div class="fi"><span id="icC"></span><input id="city" type="search" placeholder="City (or leave blank)" aria-label="City"></div>
        <button class="pill solid lg" id="go">Search</button>
      </form>
      <div class="fchips" id="chips">
        <select id="fProf" aria-label="Profession"></select>
        <select id="fType" aria-label="Job type"><option value="">Job type</option></select>
        <select id="fWork" aria-label="Workplace"><option value="">Workplace</option></select>
        <button type="button" class="fc" id="fVer">Verified employers</button>
        <button type="button" class="fc" id="fAlert">Set alert</button>
        <a class="fc pill sm" id="postJob" href="hiring?new=1" style="height:32px">Post a job</a>
      </div>
    </div>
    <div class="utabs" id="tabs">
      <button data-t="search" class="on">Search</button><button data-t="foryou" id="tFor" hidden>For you</button><button data-t="saved">Saved</button>
      <button data-t="applied">My applications</button><button data-t="alerts">Job alerts</button>
    </div>
    <div class="jobs-shell" id="shell">
      <div class="jlist" id="list" aria-live="polite"><div class="skeleton" style="height:90px;margin:14px"></div><div class="skeleton" style="height:90px;margin:14px"></div></div>
      <div class="jdet" id="det"><div class="empty"><b>Choose a job</b>Pick a job on the left to see the details.</div></div>
    </div>
    <div class="trust"><span id="t1"></span><span id="t2"></span><span id="t3"></span></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = FL.esc, I = FL.icon;
  const session = await FL.session();
  let me = null;
  if (session) {
    try { me = await FL.getProfile(); } catch (e) { return FL.toast(FL.friendly(e), 'err'); }
    if (!me.profile_completed) return location.replace('register');
  }
  FL.renderHeader(me);
  $('icQ').innerHTML = I('search', 17); $('icC').innerHTML = I('pin', 17);
  $('t1').innerHTML = I('rupee', 15) + 'Pay is shown on every job';
  $('t2').innerHTML = I('shield', 15) + 'No job can ask you for a fee';
  $('t3').innerHTML = I('clock', 15) + 'Jobs close after 30 days — no ghost listings';
  const profs = await FL.professions();
  $('fProf').innerHTML = FL.professionOptions(profs, null, 'Any profession');
  $('fType').innerHTML += Object.entries(FL.JOB_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  $('fWork').innerHTML += Object.entries(FL.WORKPLACES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  if (!me) { $('tabs').hidden = true; $('fAlert').hidden = true; } else $('tFor').hidden = false;

  const st = { tab: FL.param('tab') || 'search', verified: false, list: [], cur: null };
  $('q').value = FL.param('q') || '';
  $('city').value = FL.param('city') ?? (me && me.city) ?? '';
  if (FL.param('profession')) $('fProf').value = FL.param('profession');
  const pageFilter = FL.param('page');

  const login = () => { location.href = '/?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search); };
  const ago = (d) => { const t = FL.timeAgo(d); return t === 'now' ? 'just now' : t + ' ago'; };
  const STEPS = ['submitted', 'viewed', 'shortlisted', 'interview', 'offered', 'hired'];
  const STEP_LBL = { submitted: 'Applied', viewed: 'Viewed', shortlisted: 'Shortlisted', interview: 'Interview', offered: 'Offer', hired: 'Hired', not_selected: 'Not selected', withdrawn: 'Withdrawn' };
  const steps = (s) => {
    if (s === 'not_selected' || s === 'withdrawn') return `<div class="steps"><span class="done">Applied</span><span class="bad">${STEP_LBL[s]}</span></div>`;
    const i = STEPS.indexOf(s);
    return `<div class="steps">${STEPS.map((k, n) => `<span class="${n < i ? 'done' : n === i ? 'cur' : ''}">${STEP_LBL[k]}</span>`).join('')}</div>`;
  };

  function card(j) {
    const app = j.application;
    return `<div class="jcard ${st.cur === j.id ? 'on' : ''}" data-j="${j.id}" tabindex="0" role="button">
      ${FL.pageLogo(j.page)}
      <div style="flex:1;min-width:0">
        <h4>${esc(j.title)}</h4>
        <div class="co">${esc(j.page.name)}${FL.tick(j.page.verified, 14)}</div>
        <div class="meta">${esc([j.city, j.workplace_label, j.type_label].filter(Boolean).join(' · '))}</div>
        <div class="pay">${FL.pay(j)}${j.pay_note ? ` <span class="pnote">${esc(j.pay_note)}</span>` : ''}</div>
        ${app ? steps(app.status) + (app.closed_without_reply ? '<div class="t-xs muted" style="margin-top:4px">Closed without a reply</div>' : '')
          + (app.trial && ['proposed', 'confirmed'].includes(app.trial.status) && app.trial.upcoming
            ? `<div class="tline">${I('calendar', 13)}Trial ${esc(app.trial.when)}${app.trial.status === 'proposed' ? ' — please reply' : ' · confirmed'}</div>` : '') : `
        <div class="foot">${j.promoted ? `<span class="promo">${I('zap', 13)} Promoted</span>` : ''}
          ${j.why ? `<span class="mt">${I('sparkles', 13)} ${esc(j.why)}</span>` : ''}
          ${j.match && j.match.total ? `<span class="mt">${I('check', 13)} ${j.match.met} of ${j.match.total} match</span>` : ''}
          ${j.my_status ? `<span class="mt">Applied</span>` : ''}
          <span>${j.applicants} applicant${j.applicants === 1 ? '' : 's'}</span><span>${ago(j.created_at)}</span>
          ${j.open ? '' : '<span>Closed</span>'}</div>`}
      </div>
      ${me ? `<button class="icon-btn" data-save="${j.id}" title="${j.saved ? 'Unsave' : 'Save'}" aria-label="Save job" style="${j.saved ? 'color:var(--lime)' : ''}">${I('bookmark', 19)}</button>` : ''}
    </div>`;
  }

  async function load() {
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === st.tab));
    $('chips').style.display = st.tab === 'search' ? '' : 'none';
    $('sf').style.display = st.tab === 'search' ? '' : 'none';
    $('list').innerHTML = '<div class="skeleton" style="height:90px;margin:14px"></div>';
    if (st.tab === 'alerts') return alerts();
    let res;
    if (st.tab === 'saved') res = await sb.rpc('saved_jobs_list');
    else if (st.tab === 'foryou') res = await sb.rpc('recommended_jobs', { p_limit: 20 });
    else if (st.tab === 'applied') res = await sb.rpc('my_applications');
    else res = await sb.rpc('search_jobs', { p_q: $('q').value.trim() || null, p_profession: $('fProf').value || null,
      p_city: $('city').value.trim() || null, p_type: $('fType').value || null, p_workplace: $('fWork').value || null,
      p_min_pay: null, p_verified_only: st.verified, p_page: pageFilter || null, p_limit: 40, p_offset: 0 });
    if (res.error) { $('list').innerHTML = `<div class="empty">${esc(FL.friendly(res.error))}</div>`; return; }
    st.list = res.data || [];
    const empty = st.tab === 'saved' ? '<b>No saved jobs</b>Tap the bookmark on any job to keep it here.'
      : st.tab === 'applied' ? '<b>No applications yet</b>When you apply, you\'ll see each step here — Viewed, Shortlisted, Interview, Offer.'
      : st.tab === 'foryou' ? '<b>No matches right now</b>Add your profession and city to <a href="profile">your profile</a> — we match new jobs to you every day.'
      : `<b>No jobs match yet</b>Try a wider search, or <a href="#" id="mkAlert">set a job alert</a> and we'll tell you when one is posted.`;
    $('list').innerHTML = st.list.length ? st.list.map(card).join('') : `<div class="empty">${empty}</div>`;
    const mk = $('mkAlert'); if (mk) mk.onclick = (e) => { e.preventDefault(); newAlert(); };
    const want = FL.param('job');
    if (want && !st.cur) open(want);
    else if (!st.cur && st.list.length && window.innerWidth >= 900) open(st.list[0].id);
  }

  async function open(id) {
    st.cur = id;
    document.querySelectorAll('.jcard').forEach((c) => c.classList.toggle('on', c.dataset.j === id));
    $('shell').classList.add('open');
    const url = new URL(location.href); url.searchParams.set('job', id); history.replaceState(null, '', url);
    $('det').innerHTML = '<div class="skeleton" style="height:220px"></div>';
    const { data: j, error } = await sb.rpc('get_job', { p_job: id });
    if (error || !j) { $('det').innerHTML = `<div class="empty"><b>Job not found</b>It may have been removed.</div>`; return; }
    if (window.innerWidth < 900) window.scrollTo({ top: 0 });
    const app = j.application, open_ = j.open && !app;
    const r = j.response && j.response.rate;
    const md = j.match_detail;
    $('det').innerHTML = `
      ${window.innerWidth < 900 ? `<button class="txt-btn" id="back" style="margin:-8px 0 6px -8px">${I('back', 18)}Jobs</button>` : ''}
      <div class="co-row">${FL.pageLogo(j.page, 'co-logo sm')}<a href="company?p=${encodeURIComponent(j.page.slug)}">${esc(j.page.name)}</a>${FL.tick(j.page.verified)}</div>
      <h1>${esc(j.title)}</h1>
      <div class="t-sm muted">${esc([j.city, j.state].filter(Boolean).join(', ') || j.workplace_label)} · ${ago(j.created_at)} · ${j.applicants} applicant${j.applicants === 1 ? '' : 's'}</div>
      <div style="margin-top:8px">${r != null ? `<span class="resp">${I('check', 14)} Responds to ${r}% of applicants</span>` : `<span class="t-xs muted">New employer on The Fit Lab</span>`}</div>
      <div class="jfacts">
        <div>${I('rupee', 18)}<span><b>${FL.pay(j)}</b>${j.pay_note ? ` <span class="pnote">${esc(j.pay_note)}</span>` : ''}</span></div>
        <div>${I('briefcase', 18)}${esc(j.type_label)} · ${esc(j.workplace_label)}${j.openings > 1 ? ` · ${j.openings} openings` : ''}</div>
        ${j.profession_label ? `<div>${I('target', 18)}${esc(j.profession_label)}${j.experience_years ? ` · ${j.experience_years}+ years` : ' · Freshers welcome'}</div>` : ''}
        ${j.timings ? `<div>${I('clock', 18)}${esc(j.timings)}</div>` : ''}
      </div>
      ${!j.open ? `<div class="notice">${I('clock', 18)}<div>This job is no longer accepting applications.</div></div>` : ''}
      ${app ? `<div class="match" style="margin-top:6px"><h3>Your application</h3><div class="t-sm muted">Applied ${ago(app.created_at)}</div>${steps(app.status)}
        ${app.screened_out ? `<div class="t-sm" style="margin-top:10px;line-height:1.55">${esc(j.page.name)} needed a different answer to one of their questions for this role, so they won't be moving forward. It isn't a judgement of you — keep applying.</div>` : ''}</div>` : ''}
      ${app && app.trial ? trialBox(app.trial, j) : ''}
      <div class="jacts">
        ${open_ ? `<button class="pill solid lg" id="apply">${I('send', 16)}${j.questions && j.questions.length ? 'Apply' : 'Easy apply'}</button>` : ''}
        ${j.my_role ? `<a class="pill solid lg" href="hiring?job=${j.id}">Manage applicants</a>` : ''}
        ${me ? `<button class="pill lg" id="save">${I('bookmark', 16)}${j.saved ? 'Saved' : 'Save'}</button>` : ''}
        <button class="pill ghost lg" id="share">${I('link', 16)}Copy link</button>
        ${me && !j.my_role ? `<button class="icon-btn" id="rep" title="Report this job" aria-label="Report this job">${I('flag', 18)}</button>` : ''}
      </div>
      ${md && md.total ? `<div class="match"><h3>How you match</h3><div class="t-sm muted">${md.met} of ${md.total} requirements on your profile</div>
        <ul>${md.items.map((x) => `<li><span class="${x.ok ? 'y' : 'n'}">${I(x.ok ? 'check' : 'close', 16)}</span>${esc(x.label)}</li>`).join('')}</ul>
        ${md.met < md.total ? `<a class="t-sm" href="profile" style="display:inline-block;margin-top:10px">Add missing skills or certificates to your profile →</a>` : ''}</div>` : ''}
      ${me && !j.my_role ? (j.is_premium && j.insights ? `<div class="prem-box"><h3>${I('crown', 16)}Premium insights</h3>
          <div class="t-sm" style="line-height:1.7">
          ${j.insights.better_match_than_pct != null ? `You match better than <b>${j.insights.better_match_than_pct}%</b> of applicants.<br>` : 'You\'d be one of the first applicants.<br>'}
          ${j.insights.same_profession_pct != null ? `<b>${j.insights.same_profession_pct}%</b> of applicants share your profession.<br>` : ''}
          ${j.insights.salary && j.insights.salary.enough ? `Typical pay for this role: <b>${FL.inr(j.insights.salary.low)}–${FL.inr(j.insights.salary.high).slice(1)}</b> / month (median ${FL.inr(j.insights.salary.median)}).`
            : 'Salary insights appear once there are enough similar jobs.'}</div></div>`
        : `<div class="prem-box"><h3>${I('crown', 16)}See how you compare</h3><div class="t-sm" style="line-height:1.55">With Premium, see how you rank against other applicants and the typical pay for this role — and your application is featured at the top.</div>
          <a class="pill gold sm" href="premium?plan=pro" style="margin-top:10px">Try Premium free</a></div>`) : ''}
      <h3 style="font:700 18px var(--body);margin:22px 0 8px;letter-spacing:0;text-transform:none">About the job</h3>
      <div class="jdesc">${FL.linkify(j.description)}</div>
      ${j.skills && j.skills.length ? `<div style="margin-top:14px"><b class="t-sm">Skills</b><div class="ph-badges">${j.skills.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div></div>` : ''}
      ${j.certifications && j.certifications.length ? `<div style="margin-top:12px"><b class="t-sm">Certifications</b><div class="ph-badges">${j.certifications.map((s) => `<span class="chip acc">${esc(s)}</span>`).join('')}</div></div>` : ''}
      ${j.poster ? `<h3 style="font:700 18px var(--body);margin:24px 0 8px;letter-spacing:0;text-transform:none">Meet the hiring team</h3>
        <div class="ent" style="padding:0"><a href="profile?u=${encodeURIComponent(j.poster.username)}">${FL.ringAvatar(j.poster)}</a>
          <div class="ent-main"><a class="ent-name" href="profile?u=${encodeURIComponent(j.poster.username)}">${esc(j.poster.full_name)}${FL.tags(j.poster)}</a>
          <div class="ent-sub">${esc(j.poster.headline || '')}</div>
          ${me && me.id !== j.poster.user_id ? `<div class="ent-act"><button class="pill sm" id="msgHM">${I('mail', 15)}Message</button></div>` : ''}</div></div>` : ''}
      <div class="box" style="margin-top:22px"><div class="ent">${FL.pageLogo(j.page)}<div class="ent-main">
        <a class="ent-name" href="company?p=${encodeURIComponent(j.page.slug)}">${esc(j.page.name)}${FL.tick(j.page.verified, 14)}</a>
        <div class="ent-sub">${esc(j.page.kind_label)}${j.page.city ? ' · ' + esc(j.page.city) : ''} · ${j.page.followers} follower${j.page.followers === 1 ? '' : 's'}</div>
        ${j.page.tagline ? `<div class="ent-meta">${esc(j.page.tagline)}</div>` : ''}</div></div></div>`;
    const b = $('back'); if (b) b.onclick = () => { $('shell').classList.remove('open'); st.cur = null; };
    $('det').querySelectorAll('[data-tr]').forEach((x) => { x.onclick = () => respond(app.trial, x.dataset.tr === 'yes', j); });
    const ap = $('apply'); if (ap) ap.onclick = () => me ? apply(j) : login();
    const sv = $('save'); if (sv) sv.onclick = async () => { const x = await FL.call('toggle_save_job', { p_job: j.id }); if (x) { sv.innerHTML = I('bookmark', 16) + (x.saved ? 'Saved' : 'Save'); markSaved(j.id, x.saved); } };
    $('share').onclick = async () => { const link = location.origin + location.pathname + '?job=' + j.id;
      try { await navigator.clipboard.writeText(link); FL.toast('Link copied', 'ok'); } catch (e) { prompt('Copy this link', link); } };
    const rp = $('rep'); if (rp) rp.onclick = () => FL.report('job', j.id);
    const hm = $('msgHM'); if (hm) hm.onclick = async () => {
      const { data: ok } = await sb.rpc('inmail_allowed', { p_from: me.id, p_to: j.poster.user_id });
      if (ok && ok.connected) return location.href = 'messaging?u=' + encodeURIComponent(j.poster.username);
      if (ok && ok.existing) return location.href = 'messaging?u=' + encodeURIComponent(j.poster.username);
      if (ok && ok.ok) return FL.inmail(j.poster, ok);
      FL.upsell('Message the hiring team', (ok && ok.reason) || 'Apply first to message the hiring team for free, or use Premium InMail.', 'pro');
    };
  }
  // trial session invites from employers
  function trialBox(t, j) {
    const live = ['proposed', 'confirmed'].includes(t.status) && t.upcoming;
    const said = { proposed: t.upcoming ? 'Please confirm or decline' : 'The time has passed', confirmed: 'You confirmed', declined: 'You declined',
      cancelled: 'Cancelled by the employer', done: 'Completed', no_show: 'Marked as missed' }[t.status] || '';
    return `<div class="trialbox"><h3>${I('calendar', 18)}Trial session</h3>
      <div class="t-sm"><b>${esc(t.when)}</b> · ${t.minutes} minutes${t.place ? `<br>${I('pin', 14)} ${esc(t.place)}` : ''}</div>
      ${t.note ? `<div class="t-sm muted" style="margin-top:4px">${esc(t.note)}</div>` : ''}
      <div class="t-sm" style="margin-top:6px"><b>${esc(said)}</b>${t.reply ? ` · “${esc(t.reply)}”` : ''}</div>
      ${live ? `<div class="jacts">${t.status === 'proposed' ? `<button class="pill solid" data-tr="yes">${I('check', 15)}Confirm</button>` : ''}
        <button class="pill ghost" data-tr="no">Can't make it</button></div>` : ''}</div>`;
  }
  async function respond(t, yes, j) {
    if (yes) {
      const r = await FL.call('respond_trial', { p_trial: t.id, p_accept: true, p_reply: null });
      if (r) { FL.toast(`Confirmed — ${j.page.name} has been told`, 'ok'); open(j.id); if (st.tab === 'applied') load(); }
      return;
    }
    FL.form({ title: 'Can\'t make the trial?', saveLabel: 'Send', note: `${j.page.name} will be told. A short reason helps them offer another time.`,
      fields: [{ k: 'reply', label: 'Message (optional)', type: 'textarea', max: 300, rows: 80, ph: 'e.g. I have an exam that day — could we do Saturday morning?' }],
      onSave: async (v) => {
        const { data, error } = await sb.rpc('respond_trial', { p_trial: t.id, p_accept: false, p_reply: v.reply || null });
        if (error) throw error;
        if (data && data.ok === false) throw new Error(data.message);
        FL.toast('Sent', 'ok'); open(j.id); if (st.tab === 'applied') load();
      } });
  }
  function markSaved(id, on) { const c = document.querySelector(`[data-save="${id}"]`); if (c) c.style.color = on ? 'var(--lime)' : ''; }

  function apply(j) {
    const qs = j.questions || [];
    const m = FL.modal({ title: `Apply to ${j.page.name}`, wide: true, body: `
      <div class="ent" style="padding:0 0 12px">${FL.ringAvatar(me)}<div class="ent-main"><b class="ent-name">${esc(me.full_name)}</b>
        <div class="ent-sub">${esc(me.headline || '')}</div><div class="ent-meta">Your Fit Lab profile is shared as your CV.</div></div></div>
      ${qs.map((q, i) => `<div class="field"><label>${esc(q.q)}</label>${q.type === 'yesno'
        ? `<div class="radio-list" style="display:flex;gap:16px"><label><input type="radio" name="q${i}" value="Yes">Yes</label><label><input type="radio" name="q${i}" value="No">No</label></div>`
        : `<input data-q="${i}" maxlength="500">`}</div>`).join('')}
      <div class="field"><label for="apN">Note to the employer (optional)</label><textarea id="apN" maxlength="1500" placeholder="A few lines on why you're a good fit"></textarea></div>
      <p class="t-xs muted" style="margin:0">You'll see each step of your application. Employers on The Fit Lab can never ask you for money.</p>`,
      foot: `<button class="pill ghost" data-no>Cancel</button><button class="pill solid" data-ok>Submit application</button>` });
    m.q('[data-no]').onclick = m.close;
    m.q('[data-ok]').onclick = async (e) => {
      const answers = qs.map((q, i) => q.type === 'yesno' ? ((m.q(`input[name=q${i}]:checked`) || {}).value || '') : (m.q(`[data-q="${i}"]`).value.trim()));
      if (answers.some((a) => !a)) return FL.toast('Please answer the employer\'s questions', 'err');
      FL.busy(e.target, true, 'Sending…');
      const r = await FL.call('apply_job', { p_job: j.id, p_note: m.q('#apN').value.trim() || null, p_answers: answers });
      FL.busy(e.target, false);
      if (!r) return;
      m.close(); FL.toast(r.screened_out ? 'Sent — this employer needs a different answer to one question, so they won\'t move forward. Keep applying!' : 'Application sent', r.screened_out ? '' : 'ok');
      open(j.id); const c = st.list.find((x) => x.id === j.id); if (c) c.my_status = 'submitted';
    };
  }

  async function alerts() {
    const { data } = await sb.rpc('my_job_alerts');
    const list = data || [];
    $('det').innerHTML = `<div class="empty"><b>Job alerts</b>We'll notify you the moment a matching job is posted.</div>`;
    $('list').innerHTML = `<div class="box-head" style="padding:16px 20px 10px"><h3>Your alerts</h3><button class="pill sm" id="newA">${I('plus', 15)}New alert</button></div>` +
      (list.length ? list.map((a) => `<div class="alert-row">${I('bell', 20)}<div style="flex:1;min-width:0"><b>${esc([a.keywords, a.profession_label].filter(Boolean).join(' · ') || 'Any job')}</b>
        <span class="t-sm muted">${esc([a.city, a.type_label].filter(Boolean).join(' · ') || 'Anywhere')}</span></div>
        <button class="icon-btn" data-del="${a.id}" aria-label="Delete alert">${I('trash', 18)}</button></div>`).join('')
        : '<div class="empty" style="padding-top:6px">No alerts yet.</div>');
    $('newA').onclick = () => newAlert();
    $('list').querySelectorAll('[data-del]').forEach((b) => { b.onclick = async () => { await FL.call('delete_job_alert', { p_id: b.dataset.del }); alerts(); }; });
  }
  function newAlert() {
    if (!me) return login();
    const m = FL.modal({ title: 'Create a job alert', body: `
      <div class="field"><label for="aK">Keywords</label><input id="aK" maxlength="80" value="${esc($('q').value)}" placeholder="e.g. strength coach"></div>
      <div class="field"><label for="aP">Profession</label><select id="aP">${FL.professionOptions(profs, $('fProf').value, 'Any profession')}</select></div>
      <div class="field"><label for="aC">City</label><input id="aC" maxlength="80" value="${esc($('city').value)}"></div>
      <div class="field"><label for="aT">Job type</label><select id="aT"><option value="">Any</option>${Object.entries(FL.JOB_TYPES).map(([k, v]) => `<option value="${k}" ${$('fType').value === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`,
      foot: `<button class="pill ghost" data-no>Cancel</button><button class="pill solid" data-ok>Create alert</button>` });
    m.q('[data-no]').onclick = m.close;
    m.q('[data-ok]').onclick = async () => {
      const r = await FL.call('save_job_alert', { p: { keywords: m.q('#aK').value.trim(), profession: m.q('#aP').value, city: m.q('#aC').value.trim(), employment_type: m.q('#aT').value } });
      if (r) { m.close(); FL.toast('Alert created — we\'ll notify you', 'ok'); if (st.tab === 'alerts') alerts(); }
    };
  }

  $('sf').onsubmit = (e) => { e.preventDefault(); st.cur = null; load(); };
  ['fProf', 'fType', 'fWork'].forEach((id) => { $(id).onchange = () => { st.cur = null; load(); }; });
  $('fVer').onclick = () => { st.verified = !st.verified; $('fVer').classList.toggle('on', st.verified); st.cur = null; load(); };
  $('fAlert').onclick = newAlert;
  $('tabs').onclick = (e) => { const b = e.target.closest('[data-t]'); if (!b) return; st.tab = b.dataset.t; st.cur = null;
    $('shell').classList.remove('open'); $('det').innerHTML = '<div class="empty"><b>Choose a job</b>Pick a job to see the details.</div>'; load(); };
  $('list').addEventListener('click', async (e) => {
    const sv = e.target.closest('[data-save]');
    if (sv) { e.stopPropagation(); const x = await FL.call('toggle_save_job', { p_job: sv.dataset.save }); if (x) { markSaved(sv.dataset.save, x.saved); if (st.tab === 'saved' && !x.saved) load(); } return; }
    const c = e.target.closest('[data-j]'); if (c) open(c.dataset.j);
  });
  $('list').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const c = e.target.closest('[data-j]'); if (c) open(c.dataset.j); } });
  load();
})();
</script>
</body>
</html>
