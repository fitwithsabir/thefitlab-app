<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verify a certificate — The Fit Lab Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fit Lab">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .vwrap{max-width:760px;margin:40px auto 0}
  .vhead{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .cert{margin-top:14px}
  .seal{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--lime);text-transform:uppercase}
  .seal::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
</style>
</head>
<body>
<div class="wrap">
  <div id="nav"></div>
  <div class="vwrap" id="out">
    <div class="card hud"><span class="c1"></span><span class="c2"></span>
      <div class="eyebrow">Certificate verification</div>
      <h1 class="display" style="font-size:44px;margin:8px 0 12px">Check a Fit Lab member</h1>
      <form id="f" class="btn-row" novalidate>
        <input id="q" placeholder="Unique ID, e.g. TFL-2026-00041" style="max-width:340px" class="mono">
        <button class="btn btn-primary" type="submit">Verify</button>
      </form>
      <p class="help" style="margin-top:12px">Every certificate carries a QR code that opens this page. Only certified members with display consent appear here.</p>
    </div>
  </div>
  <div class="footer">© <span id="yr"></span> The Fit Lab Academy · Education ≠ medical practice</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  document.getElementById('yr').textContent = new Date().getFullYear();
  FL.renderHeader(null);
  const out = document.getElementById('out');

  async function lookup(id) {
    if (!id) return;
    history.replaceState(null, '', 'verify?id=' + encodeURIComponent(id));
    const { data, error } = await sb.rpc('get_public_profile', { p_unique_id: id });
    if (error) return FL.toast(FL.friendly(error), 'err');
    if (!data) {
      out.innerHTML = `<div class="card"><h2 class="display">No verified record for <span class="mono lime">${FL.esc(id)}</span></h2>
        <p class="ash">Either this ID is not certified yet, the ID was typed incorrectly, or the member has not consented to public display.</p>
        <a class="btn" href="verify">Try another ID</a></div>`;
      return;
    }
    const certs = (data.certificates || []).map((c) => c.status === 'pending' ? `
      <div class="card hud cert"><span class="c1"></span><span class="c2"></span>
        <div class="badge warn">Exam passed · certificate under review</div>
        <h3 class="display" style="font-size:30px;margin:8px 0 2px">${FL.esc(c.course)}</h3>
        <dl class="kv" style="margin-top:10px">
          ${c.passed_at ? `<dt>Exam passed</dt><dd>${FL.fmtDate(c.passed_at)}</dd>` : ''}
          ${c.percentage != null ? `<dt>Exam score</dt><dd class="mono">${c.percentage}%</dd>` : ''}
        </dl>
        <p class="help" style="margin-top:10px">This is a provisional result. The certificate number appears here once The Fit Lab issues the certificate.</p>
      </div>` : `
      <div class="card hud cert"><span class="c1"></span><span class="c2"></span>
        <div class="seal">Verified by The Fit Lab</div>
        <h3 class="display" style="font-size:30px;margin:8px 0 2px">${FL.esc(c.course)}</h3>
        <dl class="kv" style="margin-top:10px">
          <dt>Issued</dt><dd>${FL.fmtDate(c.issued_at)}</dd>
          <dt>Certificate no.</dt><dd class="mono">${FL.esc(c.verification_code)}</dd>
          ${c.percentage != null ? `<dt>Exam score</dt><dd class="mono">${c.percentage}%</dd>` : ''}
        </dl>
        ${c.portfolio ? `<div class="hr"></div><div class="eyebrow" style="margin-bottom:8px">Knowledge & objectives portfolio</div><div class="prose small">${FL.md(c.portfolio)}</div>` : ''}
      </div>`).join('');
    out.innerHTML = `
      <div class="card glow hud"><span class="c1"></span><span class="c2"></span>
        <div class="vhead">
          ${FL.avatarHtml(data, 'avatar lg')}
          <div>
            <div class="eyebrow">${(data.certificates || []).some((c) => c.status !== 'pending') ? 'Certified Fit Lab Academy member' : 'Fit Lab Academy member'}</div>
            <h1 class="display" style="font-size:44px;margin:4px 0 2px">${FL.esc(data.full_name)}</h1>
            <div class="uid" style="font-size:22px">${FL.esc(data.unique_id)}</div>
            <div class="ash small" style="margin-top:6px">${data.city ? FL.esc(data.city) + ' · ' : ''}Member since ${FL.fmtDate(data.member_since)}</div>
          </div>
        </div>
      </div>
      ${certs}
      <p class="help" style="margin-top:18px"><a href="verify">Verify another ID</a></p>`;
  }

  document.getElementById('f').onsubmit = (e) => { e.preventDefault(); lookup(document.getElementById('q').value.trim()); };
  const pre = FL.param('id'); if (pre) { document.getElementById('q').value = pre; lookup(pre); }
})();
</script>
</body>
</html>
