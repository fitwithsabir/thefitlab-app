<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control Room — The Fit Lab</title>
<script src="assets/theme.js"></script>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fit Lab">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  /* ---------- Control Room shell ---------- */
  .cr{display:grid;gap:22px;align-items:start}
  @media (min-width:900px){ .cr{grid-template-columns:236px minmax(0,1fr)} }
  .cr-side{display:none}
  @media (min-width:900px){ .cr-side{display:block} }
  .cr-me{display:flex;gap:12px;align-items:center;padding:16px 18px}
  .cr-me b{display:block;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cr-me span{display:block;font-size:12.5px;color:var(--ash)}
  .cr-nav{padding:4px 0 10px}
  .cr-nav h4{margin:14px 18px 4px;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
  .cr-nav a{display:flex;align-items:center;gap:11px;padding:9px 16px 9px 15px;color:var(--ash);font:600 14px var(--body);border-left:3px solid transparent}
  .cr-nav a:hover{background:var(--hover);color:var(--bone);text-decoration:none}
  .cr-nav a.on{color:var(--bone);border-left-color:var(--lime);background:var(--accent-soft)}
  .cr-nav a.on svg{color:var(--lime)}
  .cnt-b{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font:700 11px/20px var(--body);text-align:center}
  .cnt-b[hidden]{display:none!important}
  .cr-top{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:0 0 14px}
  .cr-kicker{font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
  .cr-top h1{margin:2px 0 0;font:700 clamp(24px,3.4vw,30px)/1.15 var(--body);letter-spacing:-.01em;color:var(--bone);text-transform:none}
  .cr-search{position:relative;flex:1;max-width:400px;min-width:220px}
  .cr-search input{padding:0 40px 0 42px;height:42px;font-size:14px;border-radius:999px}
  .cr-search .ic{position:absolute;left:15px;top:12px;color:var(--ash);pointer-events:none}
  .cr-search kbd{position:absolute;right:12px;top:11px;font:600 11px var(--mono);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--ash)}
  .cr-res{position:absolute;left:0;right:0;top:48px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);max-height:70vh;overflow-y:auto;padding:6px 0}
  .cr-res h5,.ap-res h5{margin:8px 14px 4px;font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
  .cr-res a,.cr-res button,.ap-i{display:flex;gap:10px;align-items:center;width:100%;padding:8px 14px;border:0;background:none;color:var(--bone);font:500 14px var(--body);text-align:left;cursor:pointer}
  .cr-res a:hover,.cr-res button:hover,.ap-i:hover{background:var(--hover);text-decoration:none}
  .r-t{min-width:0;flex:1}
  .r-t b{font-weight:700}
  .r-t > span{display:block;font-size:12px;color:var(--ash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);color:var(--ash);flex:none}
  .cr-mnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding:2px 0}
  .cr-mnav::-webkit-scrollbar{display:none}
  .cr-mnav a{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--bone);font:600 13px var(--body);white-space:nowrap}
  .cr-mnav a.on{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
  .cr-mnav a:hover{text-decoration:none}
  .cr-mnav .cnt-b{margin-left:2px;height:18px;min-width:18px;line-height:18px;font-size:10.5px}
  @media (min-width:900px){ .cr-mnav{display:none} }
  @media (max-width:767px){ .cr-top,.cr-mnav{padding:0 16px} .cr-search{max-width:none;flex-basis:100%} }
  .cr-spin{border-top-color:var(--lime)!important}
  .cr .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){ .cr .row2{grid-template-columns:1fr} }

  /* ---------- shared bits ---------- */
  .tg{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;font:700 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--ash);white-space:nowrap}
  .tg.ok{color:var(--lime);border-color:var(--accent-line)}
  .tg.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
  .tg.bad{color:var(--danger-text);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
  .tg.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
  .st{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;white-space:nowrap;background:var(--panel-2);color:var(--ash)}
  .st-pending,.st-open,.st-logged{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
  .st-approved,.st-auto_approved,.st-active,.st-paid,.st-resolved{background:var(--accent-soft);color:var(--lime)}
  .st-rejected,.st-needs_info,.st-suspended,.st-created{background:color-mix(in srgb,#f97316 14%,transparent);color:#ea7a26}
  .st-revoked,.st-removed,.st-banned,.st-failed{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger-text)}
  .pill.red{background:var(--danger);border-color:var(--danger);color:#fff}
  .pill.red:hover{filter:brightness(1.08);background:var(--danger);box-shadow:none}
  .pill.red-o{border-color:color-mix(in srgb,var(--danger) 55%,transparent);color:var(--danger-text)}
  .pill.red-o:hover{background:color-mix(in srgb,var(--danger) 10%,transparent);box-shadow:none}
  .lnk{border:0;background:none;padding:0;color:var(--lime);font:inherit;font-weight:600;cursor:pointer}
  .lnk:hover{text-decoration:underline}
  .nm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .sub{font-size:12.5px;color:var(--ash)}
  .cr-tools{display:flex;gap:10px;flex-wrap:wrap;padding:6px 20px 12px}
  .cr-tools input,.cr-tools select{height:40px;padding-top:0;padding-bottom:0;font-size:14px;flex:1;min-width:200px}
  .cr-tools select{flex:0 1 260px}
  .lrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:13px 20px;border-top:1px solid var(--line)}
  .lrow .who{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 280px}
  .lrow .who > div{min-width:0}
  .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .set-row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 20px}
  .set-row + .set-row{border-top:1px solid var(--line)}
  .set-row b{display:block;font-size:15px}
  .set-row .t-sm{color:var(--ash);line-height:1.45;margin-top:2px;max-width:640px}
  .switch{position:relative;width:46px;height:26px;flex:none;display:inline-block}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
  .switch input:disabled{cursor:not-allowed}
  .switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:.2s}
  .switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch input:checked + span{background:var(--lime)}
  .switch input:checked + span::after{transform:translateX(20px)}
  .switch input:focus-visible + span{box-shadow:0 0 0 3px var(--accent-soft)}
  .num{width:92px;height:38px;padding:0 10px;font-size:14px}
  .case-photo{display:inline-block;position:relative;margin:10px 0 0;border-radius:10px;overflow:hidden;border:1px solid var(--line-2);cursor:pointer;background:var(--panel-2)}
  .case-photo img{display:block;max-width:min(320px,100%);max-height:260px;filter:blur(18px);transition:filter .2s}
  .case-photo.shown img{filter:none}
  .case-photo span{position:absolute;inset:auto 8px 8px 8px;text-align:center;font-size:12px;font-weight:700;background:rgba(0,0,0,.7);color:#fff;border-radius:999px;padding:4px 10px}
  .case-photo.shown span{display:none}
  .quote{margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--line-2);background:var(--panel-2);border-radius:0 8px 8px 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{text-align:left;font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ash);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:0}
  .tbl input[type=number]{height:36px;padding:0 10px;font-size:14px}
  .tblwrap{overflow-x:auto;padding:0 12px 8px}

  /* ---------- overview ---------- */
  .ov-hello{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .ov-hello b{display:block;font-size:18px}
  .ov-hello .acts{gap:8px}
  .att{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:6px 20px 18px}
  .att a{display:flex;flex-direction:column;gap:3px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);color:var(--bone)}
  .att a:hover{border-color:var(--accent-line);text-decoration:none}
  .att a .ic{color:var(--ash);margin-bottom:4px}
  .att a b{font:700 26px/1.1 var(--body)}
  .att a > span:last-child{font-size:13px;color:var(--ash)}
  .att a.hot{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--panel-2))}
  .att a.hot .ic{color:var(--warn)}
  .kgrp{margin:8px 20px 0;font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
  .kpi em{display:block;font-style:normal;font-size:11.5px;color:var(--lime);margin-top:3px}
  .cr-bars{gap:3px;height:130px}
  .cr-bars i{cursor:default}
  .cr-bars i:hover{opacity:1;filter:brightness(1.15)}
  .cr-axis{display:flex;justify-content:space-between;gap:10px;padding:4px 20px 16px;font-size:11.5px;color:var(--ash)}
  .cr-axis b{color:var(--bone)}
  .cr-ov .hbar{grid-template-columns:minmax(0,1fr) 72px 30px}
  .cr-mini{display:flex;gap:10px;align-items:center;width:100%;padding:9px 20px;border:0;border-top:1px solid var(--line);background:none;color:var(--bone);font:500 14px var(--body);text-align:left;cursor:pointer}
  .cr-mini:hover{background:var(--hover)}
  .cr-mini time{margin-left:auto;font-size:12px;color:var(--ash);white-space:nowrap}
  .sset{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--line);font-size:14px;color:var(--bone)}
  a.sset:hover{background:var(--hover);text-decoration:none}

  /* ---------- members ---------- */
  .mlist-h,.mrow{display:grid;grid-template-columns:40px minmax(0,1fr) 92px 150px 90px 16px;gap:12px;align-items:center;padding:11px 20px}
  .mlist-h{padding-top:8px;padding-bottom:8px;border-top:1px solid var(--line);font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
  .mlist-h span:first-child{grid-column:1/3}
  .mrow{border-top:1px solid var(--line);cursor:pointer;color:var(--bone)}
  .mrow:hover,.mrow:focus-visible{background:var(--hover);outline:none}
  .mrow .nm{font-weight:700;font-size:14.5px}
  .mrow .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .chev{color:var(--ash);display:grid}
  .mrow .chev svg{transform:rotate(-90deg)}
  @media (max-width:720px){ .mlist-h{display:none} .mrow{grid-template-columns:40px minmax(0,1fr) auto} .mrow .c-stars,.mrow .c-prog,.mrow .chev{display:none} }

  /* ---------- member drawer ---------- */
  .drawer{position:fixed;inset:0;z-index:85;background:var(--overlay);display:flex;justify-content:flex-end;animation:flFade .15s ease-out}
  .drawer-card{width:min(540px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);overflow-y:auto;overscroll-behavior:contain;animation:crSlide .2s ease-out}
  @keyframes crSlide{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
  .drawer-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  .d-hero{display:flex;gap:14px;align-items:flex-start;padding:18px 20px 10px}
  .d-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .d-acts{display:flex;gap:8px;flex-wrap:wrap;padding:4px 20px 16px}
  .d-sec{padding:16px 20px;border-top:1px solid var(--line)}
  .d-sec h4{margin:0 0 10px;font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
  .d-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
  .d-stats div{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel-2)}
  .d-stats b{display:block;font:700 18px var(--body)}
  .d-stats span{font-size:11.5px;color:var(--ash)}
  .d-kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14px;margin:0}
  .d-kv dt{color:var(--ash);font-size:12.5px;padding-top:1px}
  .d-kv dd{margin:0;overflow-wrap:anywhere}
  .d-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 0}
  .d-row + .d-row{border-top:1px dashed var(--line)}
  .d-row > div:first-child{min-width:0;flex:1 1 200px}
  .d-row b{display:block;font-size:14px}
  .d-row .t-xs{color:var(--ash);margin-top:2px;line-height:1.4}
  .d-course{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px}
  .d-list{display:grid;gap:8px}
  .d-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
  .d-danger{border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

  /* ---------- admin team ---------- */
  .steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:6px 20px 16px}
  .steps3 div{display:flex;gap:10px;align-items:center;border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ash)}
  .steps3 b{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--lime);font-size:12px}
  .rchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .rchips .chip{font-size:11.5px;padding:3px 9px}
  .rlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;padding:6px 20px 18px}
  .rl{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .rl b{display:block;font-size:14px}
  .rl span:not(.ic){font-size:12.5px;color:var(--ash);line-height:1.45}
  .rl .ic,.rt .ic{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);color:var(--ash)}
  .re-who{display:flex;gap:12px;align-items:center;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
  .re-who b{display:block} .re-who span{font-size:12.5px;color:var(--ash)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .presets button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--bone);font:600 12.5px var(--body);cursor:pointer}
  .presets button:hover{border-color:var(--lime);color:var(--lime)}
  .rights{display:grid;gap:8px}
  .rt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;text-transform:none;letter-spacing:0;font:400 14px/1.4 var(--body);color:var(--bone)}
  .rt:hover{border-color:var(--line-2)}
  .rt.on{border-color:var(--accent-line);background:var(--accent-soft)}
  .rt.on .ic{color:var(--lime);background:var(--panel)}
  .rt.dis{opacity:.6;cursor:not-allowed}
  .rt .tx b{display:block;font-size:14px}
  .rt .tx span{display:block;font-size:12.5px;color:var(--ash);line-height:1.4}
  .rt .tx em{display:block;font-size:11.5px;color:var(--warn);font-style:normal;margin-top:2px}
  .ap-res{margin-top:10px;max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
  .ap-i{border-top:1px solid var(--line)} .ap-i:first-child{border-top:0}
  .mdl .cr-search{max-width:none}

  /* ---------- activity log ---------- */
  .log-day{padding:9px 20px 7px;font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ash);border-top:1px solid var(--line);background:var(--panel-2)}
  .log{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 20px;border-top:1px solid var(--line)}
  .log p{margin:0;font-size:14px;line-height:1.45}
  .log .t-xs{color:var(--ash);margin-top:2px}
  .log time{font-size:12px;color:var(--ash);white-space:nowrap;padding-top:2px}
  .log .avatar.xs{display:grid;place-items:center}

  /* ---------- cases, verification, rules ---------- */
  .case{padding:16px 20px;border-top:1px solid var(--line)}
  .case-top{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
  .case-who{display:flex;gap:12px;align-items:center;min-width:0}
  .case-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .vscore{text-align:right;min-width:150px}
  .vscore b{font:700 26px/1 var(--body)}
  .vscore .meter{width:150px;margin:6px 0 6px auto}
  .rule-form{display:grid;grid-template-columns:minmax(0,1fr) 160px 120px auto;gap:10px}
  .rule-form input,.rule-form select{height:40px;padding-top:0;padding-bottom:0;font-size:14px}
  @media (max-width:640px){ .rule-form{grid-template-columns:1fr 1fr} .rule-form input{grid-column:1/-1} .rule-form button{grid-column:1/-1} }
  .rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);font-size:13.5px}
  .rrow .mono{font-size:12.5px;overflow-wrap:anywhere}
  @media (max-width:560px){ .rrow{grid-template-columns:minmax(0,1fr) auto} .rrow .chip{display:none} }

  /* ---------- announcements ---------- */
  .bc-prev{padding:18px 20px}
  .bc-k{display:flex;gap:7px;align-items:center;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
  .bc-prev h3{margin:8px 0 6px;font:700 19px/1.3 var(--body);text-transform:none;letter-spacing:0;color:var(--bone);overflow-wrap:anywhere}
  .bc-prev p{margin:0 0 12px;font-size:14px;line-height:1.55;color:var(--bone);white-space:pre-line;overflow-wrap:anywhere}
  .bc-push{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
  .bc-push img{width:34px;height:34px;border-radius:8px;flex:none}
  .bc-push b{display:block;font-size:13.5px}
  .bc-push span{display:block;font-size:12.5px;color:var(--ash);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
</style>
</head>
<body data-page="admin">
<main class="page">
  <div id="denied" class="box" hidden style="max-width:560px;margin:40px auto 0">
    <div class="empty" style="padding:40px 24px">
      <b>Control Room access only</b>
      This area is for The Fit Lab admin team. If you should have access, ask the owner to add you to the team.
      <div style="margin-top:16px"><a class="pill" href="feed.html">Back to home</a></div>
    </div>
  </div>

  <div class="cr" id="cr" hidden>
    <aside class="cr-side"><div class="sticky-col">
      <div class="box cr-me" id="crMe"></div>
      <nav class="box cr-nav" id="crNav" aria-label="Control Room"></nav>
    </div></aside>

    <section style="min-width:0">
      <div class="cr-top">
        <div><div class="cr-kicker">Control Room</div><h1 id="crTitle">Overview</h1></div>
        <div class="cr-search" id="crSearch">
          <span class="ic" id="crSearchIc"></span>
          <input id="crQ" type="search" placeholder="Search members, pages, jobs…" autocomplete="off" aria-label="Search the Control Room">
          <kbd aria-hidden="true">/</kbd>
          <div class="cr-res" id="crRes" hidden></div>
        </div>
      </div>
      <nav class="cr-mnav" id="crMnav" aria-label="Control Room sections"></nav>
      <div id="view"></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const E = FL.esc, I = FL.icon;

  const session = await FL.requireAuth(); if (!session) return;
  let me = null; try { me = await FL.getProfile(); } catch (_) {}
  FL.renderHeader(me);
  const MY_ID = session.user.id;

  let rights = { is_admin: false };
  try { const r = await sb.rpc('my_admin_rights'); if (r.data) rights = r.data; } catch (_) {}
  if (!rights.is_admin) { $('denied').hidden = false; return; }
  if (rights.team == null) rights.team = !!rights.admins;          // before the v9 database update
  const can = (k) => !k || !!rights.is_owner || !!rights[k];
  $('cr').hidden = false;

  // ------------------------------------------------------------------ helpers
  const n = (x) => Number(x || 0).toLocaleString('en-IN');
  const plural = (k, w, pl) => `${n(k)} ${Number(k) === 1 ? w : (pl || w + 's')}`;
  const fmt = (d) => d ? new Date(String(d).length <= 10 ? d + 'T00:00:00' : d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
  const fmtDay = (d) => new Date(String(d).length <= 10 ? d + 'T00:00:00' : d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  const ago = (d) => { if (!d) return 'never'; const t = FL.timeAgo(d); return t === 'now' ? 'just now' : t + ' ago'; };
  const ageOf = (dob) => dob ? Math.floor((Date.now() - new Date(String(dob).slice(0, 10) + 'T00:00:00').getTime()) / 31557600000) : null;
  const first = (name) => String(name || 'They').trim().split(/\s+/)[0];
  const spinner = '<div class="empty"><span class="spin cr-spin"></span></div>';
  const errBox = (e) => `<div class="box"><div class="empty"><b>Couldn't load this</b>${E(FL.friendly(e))}</div></div>`;
  const debounce = (f, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
  const SRC = { trial: 'free trial', razorpay: 'paid', admin: 'given by admin', gift: 'gift', team: 'team plan' };
  // run an admin action: shows the error, or a success toast
  async function act(fn, args, okMsg) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) { FL.toast(FL.friendly(error), 'err'); return false; }
    if (data && data.ok === false) { FL.toast(data.message || 'That isn\'t allowed', 'err'); return false; }
    if (okMsg) FL.toast(okMsg, 'ok');
    return data || true;
  }
  // a note dialog (reject, pause, revoke…)
  function askNote({ title, help, okLabel = 'Confirm', danger = false, required = false, ph = '' }) {
    return new Promise((resolve) => {
      let done = false;
      const m = FL.modal({ title, body: `${help ? `<p class="t-sm muted" style="margin:0 0 12px;line-height:1.5">${E(help)}</p>` : ''}
          <div class="field" style="margin:0"><label for="anNote">Note${required ? '' : ' <span class="muted">(optional)</span>'}</label><textarea id="anNote" maxlength="600" placeholder="${E(ph)}"></textarea></div>`,
        foot: `<button class="pill ghost" data-no>Cancel</button><button class="pill solid ${danger ? 'red' : ''}" data-ok>${E(okLabel)}</button>`,
        onClose: () => { if (!done) resolve(null); } });
      m.q('[data-no]').onclick = m.close;
      m.q('[data-ok]').onclick = () => {
        const note = m.q('#anNote').value.trim();
        if (required && !note) return FL.toast('Add a short note so they know what to do', 'err');
        done = true; m.close(); resolve({ note });
      };
    });
  }
  // type-to-confirm for things that can't be undone
  function typedConfirm(title, text, word, okLabel) {
    return new Promise((resolve) => {
      let done = false;
      const m = FL.modal({ title, body: `<p style="margin:0 0 14px;line-height:1.55">${E(text)}</p>
          <div class="field" style="margin:0"><label for="tcW">Type <b class="mono">${E(word)}</b> to confirm</label><input id="tcW" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`,
        foot: `<button class="pill ghost" data-no>Cancel</button><button class="pill solid red" data-ok disabled>${E(okLabel)}</button>`,
        onClose: () => { if (!done) resolve(false); } });
      const ok = m.q('[data-ok]');
      m.q('#tcW').oninput = (e) => { ok.disabled = e.target.value.trim().toLowerCase() !== word.toLowerCase(); };
      m.q('[data-no]').onclick = m.close;
      ok.onclick = () => { done = true; m.close(); resolve(true); };
    });
  }

  // ------------------------------------------------------------------ rights
  const RIGHTS = [
    ['members', 'Members', 'See member details, edit accounts, reset course progress and delete accounts', 'users'],
    ['moderation', 'Reports & conduct', 'Review reports, pause or restore members, conduct rules and the contact-sharing switch', 'flag'],
    ['verification', 'Verification & pages', 'Approve verified ticks and manage organisation pages', 'tick'],
    ['certificates', 'Certificates', 'Approve, send back or revoke course certificates', 'award'],
    ['content', 'Courses & lessons', 'Edit course and lesson content', 'courses'],
    ['announcements', 'Announcements', 'Send a pop-up notice to every member', 'bell'],
    ['premium', 'Premium & payments', 'Change prices, give or end Premium, see payments, bookings and refunds', 'crown'],
    ['team', 'Admin team', 'Add people to the team, give them areas they manage themselves, and see the activity log', 'shield'],
  ];
  const RMAP = Object.fromEntries(RIGHTS.map(([k, label, desc, icon]) => [k, { label, desc, icon }]));
  const PRESETS = [
    ['Moderator', ['moderation']],
    ['Verifier', ['verification']],
    ['Community manager', ['moderation', 'verification', 'announcements']],
    ['Support', ['members', 'moderation']],
    ['Academy manager', ['certificates', 'content', 'announcements']],
    ['Finance', ['premium']],
    ['Full admin', ['members', 'moderation', 'verification', 'certificates', 'content', 'announcements', 'premium']],
  ];
  const canManage = (t) => can('team') && !t.is_owner && t.user_id !== MY_ID && (rights.is_owner || !t.team);

  // ------------------------------------------------------------------ navigation
  const ROUTES = [
    { id: 'overview', label: 'Overview', icon: 'grid', group: '' },
    { id: 'members', label: 'Members', icon: 'users', group: 'People', need: 'members' },
    { id: 'team', label: 'Admin team', icon: 'shield', group: 'People', need: 'team' },
    { id: 'activity', label: 'Activity log', icon: 'activity', group: 'People', need: 'team', short: 'Activity' },
    { id: 'moderation', label: 'Reports', icon: 'flag', group: 'Trust & safety', need: 'moderation', cnt: 'reports' },
    { id: 'verify', label: 'Verification', icon: 'tick', group: 'Trust & safety', need: 'verification', cnt: 'verification' },
    { id: 'conduct', label: 'Settings & rules', icon: 'settings', group: 'Trust & safety', need: 'moderation', short: 'Rules' },
    { id: 'pages', label: 'Pages', icon: 'building', group: 'Business', need: 'verification' },
    { id: 'premium', label: 'Premium', icon: 'crown', group: 'Business', need: 'premium' },
    { id: 'bookings', label: 'Bookings & payouts', icon: 'calendar', group: 'Business', need: 'premium', short: 'Bookings' },
    { id: 'marketing', label: 'Marketing & ads', icon: 'chart', group: 'Business', need: 'premium', short: 'Marketing' },
    { id: 'emails', label: 'Emails', icon: 'mail', group: 'Business', need: 'premium' },
    { id: 'certs', label: 'Certificates', icon: 'award', group: 'Academy', need: 'certificates', cnt: 'certificates' },
    { id: 'broadcast', label: 'Announcements', icon: 'bell', group: 'Academy', need: 'announcements' },
  ];
  const allowed = ROUTES.filter((r) => can(r.need));
  const areas = RIGHTS.filter(([k]) => can(k)).length;
  $('crMe').innerHTML = `${FL.avatarHtml(me || {}, 'avatar sm')}<div style="min-width:0"><b>${E((me && me.full_name) || 'You')}</b>
    <span>${E(rights.is_owner ? 'Owner' : (rights.title || 'Administrator'))} · ${rights.is_owner ? 'every area' : plural(areas, 'area')}</span></div>`;
  $('crSearchIc').innerHTML = I('search', 18);
  {
    let html = '', g = null;
    for (const r of allowed) {
      if (r.group !== g) { g = r.group; if (g) html += `<h4>${E(g)}</h4>`; }
      html += `<a href="#${r.id}" data-r="${r.id}">${I(r.icon, 18)}<span>${E(r.label)}</span>${r.cnt ? `<b class="cnt-b" data-cnt="${r.cnt}" hidden></b>` : ''}</a>`;
    }
    $('crNav').innerHTML = html;
    $('crMnav').innerHTML = allowed.map((r) => `<a href="#${r.id}" data-r="${r.id}">${I(r.icon, 15)}${E(r.short || r.label)}${r.cnt ? `<b class="cnt-b" data-cnt="${r.cnt}" hidden></b>` : ''}</a>`).join('');
  }
  const setCount = (key, v) => document.querySelectorAll(`[data-cnt="${key}"]`).forEach((b) => { b.textContent = v > 99 ? '99+' : String(v || ''); b.hidden = !(v > 0); });
  const applyCounts = (a) => { if (!a) return; setCount('reports', a.reports); setCount('verification', a.verification); setCount('certificates', a.certificates); };

  const VIEWS = {};
  let tok = 0, current = null, reloadView = null, firstGo = true;
  function go() {
    const h = (location.hash || '').slice(1).toLowerCase().replace(/[^a-z_/]/g, '');
    let [id, sub] = h.split('/');
    if (!id) { try { id = sessionStorage.getItem('fl:admintab') || ''; } catch (_) {} }
    const r = allowed.find((x) => x.id === id) || allowed[0];
    const my = ++tok, alive = () => my === tok;
    current = r.id; reloadView = null;
    document.querySelectorAll('[data-r]').forEach((a) => a.classList.toggle('on', a.dataset.r === r.id));
    const chip = $('crMnav').querySelector(`[data-r="${r.id}"]`);
    if (chip && chip.offsetParent) $('crMnav').scrollLeft = chip.offsetLeft - 16;
    $('crTitle').textContent = r.label;
    document.title = `${r.label} — Control Room · The Fit Lab`;
    try { sessionStorage.setItem('fl:admintab', r.id); } catch (_) {}
    if (!firstGo) window.scrollTo(0, 0);
    firstGo = false;
    $('view').innerHTML = `<div class="box">${spinner}</div>`;
    Promise.resolve().then(() => VIEWS[r.id](alive, sub || null)).catch((e) => { if (alive()) $('view').innerHTML = errBox(e); });
  }
  window.addEventListener('hashchange', go);

  // ------------------------------------------------------------------ global search
  {
    const box = $('crRes');
    const run = debounce(async () => {
      const q = $('crQ').value.trim();
      if (q.length < 2) { box.hidden = true; return; }
      const { data, error } = await sb.rpc('admin_search', { p_q: q });
      if ($('crQ').value.trim() !== q) return;
      if (error) { box.innerHTML = `<div class="empty t-sm">${E(FL.friendly(error))}</div>`; box.hidden = false; return; }
      const d = data || {}; let html = '';
      if ((d.members || []).length) html += '<h5>Members</h5>' + d.members.map((m) => `<button type="button" data-member="${E(m.user_id)}">${FL.avatarHtml(m, 'avatar xs')}<span class="r-t"><b>${E(m.full_name)}</b>${FL.tick(m.verified, 13)}
          <span>@${E(m.username || '')} · ${E(m.unique_id || '')}${m.community_status && m.community_status !== 'active' ? ' · ' + (m.community_status === 'banned' ? 'removed' : 'paused') : ''}</span></span></button>`).join('');
      if ((d.pages || []).length) html += '<h5>Pages</h5>' + d.pages.map((g) => `<a href="company.html?p=${encodeURIComponent(g.slug)}" target="_blank" rel="noopener">${FL.pageLogo(g, 'co-logo xs')}<span class="r-t"><b>${E(g.name)}</b>${FL.tick(g.verified, 13)}
          <span>${E(g.kind_label || '')}${g.city ? ' · ' + E(g.city) : ''}${g.status && g.status !== 'active' ? ' · ' + E(g.status) : ''}</span></span></a>`).join('');
      if ((d.jobs || []).length) html += '<h5>Jobs</h5>' + d.jobs.map((j) => `<a href="jobs.html?job=${E(j.id)}" target="_blank" rel="noopener"><span class="r-ic">${I('briefcase', 16)}</span><span class="r-t"><b>${E(j.title)}</b>
          <span>${E(j.page || '')}${j.city ? ' · ' + E(j.city) : ''} · ${E(j.status)}</span></span></a>`).join('');
      box.innerHTML = html || `<div class="empty t-sm">Nothing found for “${E(q)}”.</div>`;
      box.hidden = false;
    }, 280);
    $('crQ').addEventListener('input', run);
    $('crQ').addEventListener('focus', () => { if ($('crQ').value.trim().length >= 2 && box.innerHTML) box.hidden = false; });
    $('crQ').addEventListener('keydown', (e) => { if (e.key === 'Escape') { box.hidden = true; $('crQ').blur(); } });
    box.addEventListener('click', (e) => { const b = e.target.closest('[data-member]'); if (!b) return; box.hidden = true; openMember(b.dataset.member); });
    document.addEventListener('click', (e) => { if (!e.target.closest('#crSearch')) box.hidden = true; });
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && !e.target.closest('input,textarea,select,[contenteditable]') && !document.querySelector('.mdl,.drawer')) { e.preventDefault(); $('crQ').focus(); }
    });
  }

  // ------------------------------------------------------------------ MARKETING (fix-23)
  VIEWS.emails = async (alive) => {
    const WHAT = { welcome: 'Welcome', receipt: 'Receipt', certificate: 'Certificate', notice: 'Update', test: 'Test' };
    const ST = { sent: ['Sent', 'acc'], pending: ['Waiting', ''], sending: ['Sending', ''], failed: ['Failed', 'bad'], skipped: ['Skipped', ''] };
    const draw = async () => {
      $('view').innerHTML = `<div class="box">${spinner}</div>`;
      const { data, error } = await sb.rpc('admin_email_status');
      if (!alive()) return;
      if (error || !data) { $('view').innerHTML = errBox(error || {}); return; }
      const stuck = data.waiting > 0 && !data.sent_30d;
      $('view').innerHTML = `<div class="stack">
        <div class="box"><div class="box-head"><div><h2>Automatic emails</h2><div class="sub">Sent from fitwithsabir@gmail.com · welcome, receipts, certificates, bookings, trial sessions and job updates · Gmail allows about 500 a day</div></div>
          <button class="pill solid sm" id="emTest">${I('mail', 15)}Send me a test</button></div>
          <div class="kpis">${[[n(data.sent_24h), 'Sent today'], [n(data.sent_30d), 'Sent in 30 days'], [n(data.waiting), 'Waiting'], [n(data.failed_7d), 'Failed this week']]
            .map(([v, l]) => `<div class="kpi"><b>${E(v)}</b><span>${E(l)}</span></div>`).join('')}</div>
          ${data.last_error ? `<div class="notice warn" style="margin:0 20px 16px">${I('flag', 18)}<div class="t-sm" style="line-height:1.5"><b>Last problem:</b> ${E(data.last_error)}${/Invalid login|535|Username and Password/i.test(data.last_error) ? '<br>The Gmail App Password is wrong or was deleted. Make a new one at myaccount.google.com/apppasswords and update GMAIL_APP_PASSWORD in Supabase → Edge Functions → Secrets.' : ''}</div></div>`
            : stuck ? `<div class="notice" style="margin:0 20px 16px">${I('clock', 18)}<div class="t-sm" style="line-height:1.5">Emails are waiting. If they don't go within a few minutes, check that GMAIL_USER and GMAIL_APP_PASSWORD are saved in Supabase → Edge Functions → Secrets.</div></div>` : ''}</div>
        <div class="box"><div class="box-head"><h2>Latest emails</h2></div>
          ${(data.recent || []).length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>When</th><th>To</th><th>Email</th><th>Status</th></tr></thead><tbody>
            ${data.recent.map((r) => `<tr><td>${E(FL.timeAgo(r.created_at))}</td><td>${E(r.to_email)}</td><td>${E(WHAT[r.template] || r.template)}${r.what && r.template === 'notice' ? ' · ' + E(r.what) : ''}</td>
              <td><span class="chip ${(ST[r.status] || [])[1] || ''}" ${r.status === 'failed' ? 'style="color:var(--danger-text);border-color:var(--danger)"' : ''}>${E((ST[r.status] || [r.status])[0])}</span></td></tr>`).join('')}</tbody></table></div>`
            : '<div class="empty">No emails yet. They start with the next sign-up, payment or booking.</div>'}</div></div>`;
      $('emTest').onclick = async (e) => {
        FL.busy(e.target, true, 'Sending…');
        const r = await FL.call('admin_send_test_email');
        FL.busy(e.target, false);
        if (r) { FL.toast(`Test email on its way to ${r.to}`, 'ok'); setTimeout(() => alive() && draw(), 6000); }
      };
    };
    draw();
  };

  VIEWS.marketing = async (alive) => {
    let days = 30;
    const SITE = 'https://thefitlab-com.netlify.app';
    const LINKS = [['Full course · ₹99', '/academy', 'fcm_course'], ['Direct certification · ₹99', '/certify', 'fcm_direct'],
      ['Jobs · trainers', '/trainer-jobs', 'jobs_trainer'], ['Jobs · coaches', '/coach-jobs', 'jobs_coach'], ['Jobs · nutritionists', '/nutritionist-jobs', 'jobs_nutritionist'],
      ['Hiring · trainers', '/hire-trainers', 'hire_trainer'], ['Hiring · coaches', '/hire-coaches', 'hire_coach'], ['Hiring · nutritionists', '/hire-nutritionists', 'hire_nutritionist']];
    const PARAMS = 'utm_source=meta&utm_medium=paid_social&utm_campaign={{campaign.name}}&utm_content={{ad.name}}&utm_term={{adset.name}}&placement={{placement}}';
    const draw = async () => {
      $('view').innerHTML = `<div class="box">${spinner}</div>`;
      const { data, error } = await sb.rpc('admin_marketing_report', { p_days: days });
      if (!alive()) return;
      if (error || !data) { $('view').innerHTML = errBox(error || {}); return; }
      const sl = data.sales || {};
      $('view').innerHTML = `<div class="stack">
        <div class="box"><div class="box-head"><div><h2>Last ${n(data.days)} days</h2><div class="sub">Sign-ups and sales, and which ads brought them</div></div>
          <select id="mkDays" style="width:auto">${[7, 30, 90, 365].map((d) => `<option value="${d}"${d === days ? ' selected' : ''}>${d} days</option>`).join('')}</select></div>
          <div class="kpis">${[[n(data.signups), 'New members'], [n(data.tracked_signups), 'From a tracked link'], [n(sl.course_count), 'Course sales', FL.paise(sl.course_paise)],
            [n(sl.direct_count), 'Direct certifications'], [n(sl.premium_count), 'Premium sales', FL.paise(sl.premium_paise)]]
            .map(([v, l, x]) => `<div class="kpi"><b>${E(v)}</b><span>${E(l)}${x ? ' · ' + E(x) : ''}</span></div>`).join('')}</div></div>
        <div class="box"><div class="box-head"><h2>By page</h2></div>
          ${(data.by_funnel || []).length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Page</th><th>Sign-ups</th><th>Paid</th><th>Paid %</th></tr></thead><tbody>
            ${data.by_funnel.map((r) => `<tr><td>${E(r.funnel)}</td><td>${n(r.signups)}</td><td>${n(r.payers)}</td><td>${r.signups ? Math.round(r.payers / r.signups * 100) : 0}%</td></tr>`).join('')}</tbody></table></div>`
            : '<div class="empty">No sign-ups from the promotion pages yet.</div>'}</div>
        <div class="box"><div class="box-head"><div><h2>By ad</h2><div class="sub">From the link's utm_source, utm_campaign and utm_content — the ads that bring paying members rise to the top</div></div></div>
          ${(data.by_ad || []).length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Source</th><th>Campaign</th><th>Ad</th><th>Sign-ups</th><th>Paid</th><th>Revenue</th></tr></thead><tbody>
            ${data.by_ad.map((r) => `<tr><td>${E(r.source)}</td><td>${E(r.campaign)}</td><td>${E(r.ad)}</td><td>${n(r.signups)}</td><td>${n(r.payers)}</td><td>${E(FL.paise(r.revenue))}</td></tr>`).join('')}</tbody></table></div>`
            : '<div class="empty">Nothing yet — results appear as soon as people sign up through a tracked link.</div>'}</div>
        <div class="box"><div class="box-head"><div><h2>Promotion links</h2><div class="sub">Use these as the ad's website URL. Paste the URL parameters below into Meta Ads Manager → Ad → Tracking → URL parameters.</div></div></div>
          <div class="tblwrap"><table class="tbl"><thead><tr><th>Page</th><th>Link</th><th></th></tr></thead><tbody>
            ${LINKS.map(([l, path]) => `<tr><td>${E(l)}</td><td class="mono" style="font-size:12px">${E(SITE + path)}</td><td><button class="pill sm" type="button" data-copy="${E(SITE + path)}">Copy</button></td></tr>`).join('')}
            <tr><td><b>URL parameters</b></td><td class="mono" style="font-size:11px;word-break:break-all">${E(PARAMS)}</td><td><button class="pill sm" type="button" data-copy="${E(PARAMS)}">Copy</button></td></tr>
          </tbody></table></div></div>
        <div class="notice">${I('chart', 18)}<div><b>Meta tracking</b> — the Pixel is ${(window.FITLAB_CONFIG || {}).META_PIXEL_ID ? '<b>on</b>' : '<b>off</b> (add your Pixel ID to config.js)'}. Payments are also reported from the server when the <span class="mono">META_PIXEL_ID</span> and <span class="mono">META_CAPI_TOKEN</span> secrets are set in Supabase.</div></div>
      </div>`;
      $('mkDays').onchange = () => { days = +$('mkDays').value; draw(); };
      $('view').querySelectorAll('[data-copy]').forEach((b) => { b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1400); } catch (_) { FL.toast('Copy failed — select the text instead', 'err'); } }; });
    };
    draw();
  };

  // ------------------------------------------------------------------ OVERVIEW
  VIEWS.overview = async (alive) => {
    const { data: o, error } = await sb.rpc('admin_overview');
    if (!alive()) return;
    if (error || !o) { $('view').innerHTML = errBox(error || { message: 'Nothing to show yet.' }); return; }
    const at = o.attention || {}, m = o.members || {}, nw = o.network || {}, jb = o.jobs || {}, ac = o.academy || {}, pr = o.premium || {}, st = o.settings || {};
    applyCounts(at);
    const hr = new Date().getHours();
    const hello = `${hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening'}, ${E(first(me && me.full_name))}`;
    const quick = [
      can('announcements') ? `<a class="pill sm" href="#broadcast">${I('bell', 15)}Send announcement</a>` : '',
      can('team') ? `<a class="pill sm ghost" href="#team/add">${I('userplus', 15)}Add to admin team</a>` : '',
      can('members') ? `<button class="pill sm ghost" type="button" data-focus-search>${I('search', 15)}Find a member</button>` : '',
    ].join('');
    const ATT = [['reports', 'Reports to review', 'flag', '#moderation'], ['verification', 'Verification requests', 'tick', '#verify'],
      ['certificates', 'Certificates to approve', 'award', '#certs'], ['paused', 'Members paused', 'block', '#moderation/restricted'],
      ['pages_new', 'New pages, not verified', 'building', '#pages']].filter(([k]) => at[k] != null);
    const waiting = ['reports', 'verification', 'certificates'].reduce((s, k) => s + (at[k] || 0), 0);
    const groups = [
      ['Members', [[m.total, 'Members', m.new_7d ? `+${n(m.new_7d)} this week` : ''], [m.active_1d, 'Active today'], [m.active_7d, 'Active this week'],
        [m.verified, 'Verified'], [m.open_to_work, 'Open to work'], [m.push_devices, 'Pop-ups switched on']]],
      ['Network', [[nw.connections, 'Connections', nw.connections_7d ? `+${n(nw.connections_7d)} this week` : ''], [nw.posts_7d, 'Posts this week'],
        [nw.comments_7d, 'Comments this week'], [nw.messages_7d, 'Messages this week']]],
      ['Jobs & pages', [[jb.pages, 'Pages', jb.pages_verified ? `${n(jb.pages_verified)} verified` : ''], [jb.open, 'Open jobs'],
        [jb.applications_30d, 'Applications · 30 days'], [jb.hired_90d, 'Hired · 90 days']]],
      ['Academy', [[ac.enrolled, 'Enrolments'], [ac.certificates, 'Certificates issued'], [ac.days_7d, 'Lesson days done this week']]],
      ['Premium', [[pr.active, 'Premium members', `${n(pr.trial)} on trial · ${n(pr.paid)} paid`],
        ...Object.entries(pr.by_plan || {}).map(([k, v]) => [v, (FL.PLAN_NAMES[k] || k) + ' plan']),
        ...(pr.revenue_30d != null ? [[FL.paise(pr.revenue_30d), 'Revenue · 30 days', `${FL.paise(pr.revenue_all)} all time`]] : [])]],
    ];
    const kpis = groups.map(([g, items]) => `<div class="kgrp">${E(g)}</div><div class="kpis">${items.map(([v, l, s]) =>
      `<div class="kpi"><b>${typeof v === 'string' ? E(v) : n(v)}</b><span>${E(l)}</span>${s ? `<em>${E(s)}</em>` : ''}</div>`).join('')}</div>`).join('');
    const hb = (list) => { const max = Math.max(1, ...list.map((x) => x.n)); return list.map((x) => `<div class="hbar"><span title="${E(x.label)}">${E(x.label)}</span><div class="t"><i style="width:${Math.round(x.n / max * 100)}%"></i></div><b>${n(x.n)}</b></div>`).join(''); };
    const series = o.series || [];
    const METRICS = [['signups', 'Sign-ups'], ['posts', 'Posts'], ['connections', 'Connections']];
    let metric = 'signups';
    const chart = () => {
      if (!series.length) return '<div class="empty">No data yet.</div>';
      const vals = series.map((d) => d[metric] || 0), max = Math.max(1, ...vals), tot = vals.reduce((a, b) => a + b, 0);
      return `<div class="bars cr-bars" role="img" aria-label="${E(METRICS.find((x) => x[0] === metric)[1])}: ${tot} in 30 days">${series.map((d) =>
        `<i style="height:${Math.max(2, Math.round((d[metric] || 0) / max * 100))}%" title="${E(fmtDay(d.day))}: ${n(d[metric])}"></i>`).join('')}</div>
        <div class="cr-axis"><span>${E(fmtDay(series[0].day))}</span><span><b>${n(tot)}</b> in 30 days</span><span>Today</span></div>`;
    };
    const setRows = [
      ['Contact sharing', st.allow_contacts ? 'Allowed' : 'Blocked', st.allow_contacts ? 'ok' : 'warn', can('moderation') ? '#conduct' : null],
      ['AI second check', st.ai_moderation ? 'On' : 'Off', st.ai_moderation ? 'ok' : '', can('moderation') ? '#conduct' : null],
      ['Automatic verification', st.verify_auto === 'on' ? 'On' : 'Off', st.verify_auto === 'on' ? 'ok' : '', can('verification') ? '#verify' : null],
    ];
    $('view').innerHTML = `<div class="layout l-main-side cr-ov" id="ovRoot">
      <div class="stack">
        <div class="box box-pad ov-hello"><div><b>${hello}</b><span class="sub">${E(new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' }))} · here's The Fit Lab today</span></div>
          ${quick ? `<div class="acts">${quick}</div>` : ''}</div>
        ${ATT.length ? `<div class="box"><div class="box-head"><div><h2>Needs your attention</h2><div class="sub">${waiting ? plural(waiting, 'item') + ' waiting for a decision' : 'All clear — nothing is waiting for you.'}</div></div></div>
          <div class="att">${ATT.map(([k, l, ic, href]) => `<a href="${href}" class="${at[k] > 0 && k !== 'pages_new' ? 'hot' : ''}"><span class="ic">${I(ic, 18)}</span><b>${n(at[k])}</b><span>${E(l)}</span></a>`).join('')}</div></div>` : ''}
        <div class="box"><div class="box-head"><div><h2>Growth</h2><div class="sub">Last 30 days</div></div></div>
          <div class="catbar" id="ovMetric">${METRICS.map(([k, l]) => `<button type="button" data-m="${k}" class="${k === metric ? 'on' : ''}">${E(l)}</button>`).join('')}</div>
          <div id="ovChart">${chart()}</div></div>
        <div class="box"><div class="box-head"><h2>At a glance</h2></div>${kpis}</div>
      </div>
      <div class="stack">
        ${o.recent ? `<div class="box"><div class="box-head"><h3>Newest members</h3><a class="t-sm" href="#members/new">See all</a></div><div style="height:6px"></div>
          ${o.recent.map((r) => `<button class="cr-mini" type="button" data-member="${E(r.user_id)}">${FL.avatarHtml(r, 'avatar xs')}<span class="r-t"><b>${E(r.full_name || 'New member')}</b><span>${E(r.headline || r.city || '@' + (r.username || ''))}</span></span><time>${E(ago(r.created_at))}</time></button>`).join('') || '<div class="empty">No members yet.</div>'}</div>` : ''}
        <div class="box"><div class="box-head"><h3>Top professions</h3></div><div style="padding:4px 0 14px">${hb(o.top_professions || []) || '<div class="empty">No data yet.</div>'}</div></div>
        <div class="box"><div class="box-head"><h3>Top cities</h3></div><div style="padding:4px 0 14px">${hb(o.top_cities || []) || '<div class="empty">No data yet.</div>'}</div></div>
        <div class="box"><div class="box-head"><h3>Community settings</h3></div><div style="height:6px"></div>
          ${setRows.map(([l, v, cls, href]) => `<${href ? `a href="${href}"` : 'div'} class="sset"><span>${E(l)}</span><span class="tg ${cls}">${E(v)}</span></${href ? 'a' : 'div'}>`).join('')}</div>
      </div></div>`;
    $('ovMetric').onclick = (e) => { const b = e.target.closest('[data-m]'); if (!b) return; metric = b.dataset.m;
      $('ovMetric').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); $('ovChart').innerHTML = chart(); };
    $('ovRoot').onclick = (e) => {
      const mb = e.target.closest('[data-member]'); if (mb) return openMember(mb.dataset.member);
      if (e.target.closest('[data-focus-search]')) $('crQ').focus();
    };
  };

  // ------------------------------------------------------------------ MEMBERS
  const MF = [['all', 'All'], ['new', 'New this week'], ['admins', 'Admin team'], ['paused', 'Paused or removed'], ['minor', 'Under 18'], ['incomplete', 'Profile not finished']];
  const mfTest = {
    all: () => true,
    new: (m) => m.created_at && Date.now() - new Date(m.created_at).getTime() < 7 * 864e5,
    admins: (m) => m.is_admin || m.is_owner,
    paused: (m) => m.community_status && m.community_status !== 'active',
    minor: (m) => { const a = ageOf(m.date_of_birth); return a != null && a < 18; },
    incomplete: (m) => !m.profile_completed,
  };
  function mrow(m) {
    const a = ageOf(m.date_of_birth);
    const tags = [m.is_owner ? '<span class="tg gold">Owner</span>' : m.is_admin ? '<span class="tg ok">Admin</span>' : '',
      m.community_status === 'suspended' ? '<span class="tg warn">Paused</span>' : m.community_status === 'banned' ? '<span class="tg bad">Removed</span>' : '',
      a != null && a < 18 ? '<span class="tg">Under 18</span>' : '', !m.profile_completed ? '<span class="tg">Unfinished</span>' : ''].join('');
    return `<div class="mrow" data-member="${E(m.id)}" tabindex="0" role="button" aria-label="Open ${E(m.full_name || 'member')}">
      ${FL.avatarHtml(m, 'avatar sm')}
      <div style="min-width:0"><div class="nm">${E(m.full_name || '—')}${tags}</div><div class="sub">@${E(m.username || '—')} · ${E(m.unique_id || '')}${m.email ? ' · ' + E(m.email) : ''}</div></div>
      <div class="c-stars">${FL.starsIf(m.star_count, m.star_tier) || '<span class="muted t-xs">—</span>'}</div>
      <div class="c-prog t-xs">${m.enrolled ? `${plural(m.enrolled, 'course')} · ${plural(m.days_done, 'day')} done` : '<span class="muted">Not enrolled</span>'}</div>
      <div class="c-last t-xs muted">${E(ago(m.last_activity_at))}</div>
      <span class="chev">${I('down', 16)}</span></div>`;
  }
  VIEWS.members = async (alive, sub) => {
    let rows = [], f = mfTest[sub] ? sub : 'all', shown = 60, q = '';
    $('view').innerHTML = `<div class="box">
      <div class="box-head"><div><h2>Members</h2><div class="sub" id="mSub">Loading…</div></div></div>
      <div class="cr-tools"><input id="mq" type="search" placeholder="Search name, email, @username or Fit Lab ID" autocomplete="off" aria-label="Search members"></div>
      <div class="catbar" id="mf"></div>
      <div class="mlist-h"><span>Member</span><span>Stars</span><span>Courses</span><span>Last active</span><span></span></div>
      <div id="mlist">${spinner}</div>
      <div class="box-foot" id="mMoreW" hidden><button type="button" id="mMore">Show more</button></div></div>`;
    const render = () => {
      const list = rows.filter(mfTest[f]);
      $('mf').innerHTML = MF.map(([k, l]) => { const c = rows.filter(mfTest[k]).length; return (k === 'all' || c || k === f) ? `<button type="button" data-f="${k}" class="${k === f ? 'on' : ''}">${E(l)}<i>${n(c)}</i></button>` : ''; }).join('');
      $('mSub').textContent = q ? `${plural(list.length, 'match', 'matches')} for “${q}”` : `${plural(rows.length, 'member')} registered`;
      $('mlist').innerHTML = list.length ? list.slice(0, shown).map(mrow).join('') : `<div class="empty">${q ? 'No members match that search.' : 'No members here.'}</div>`;
      $('mMoreW').hidden = list.length <= shown;
    };
    const load = async () => {
      const { data, error } = await sb.rpc('admin_list_members', { p_search: q || null });
      if (!alive()) return;
      if (error) { $('mlist').innerHTML = `<div class="empty">${E(FL.friendly(error))}</div>`; return; }
      rows = data || []; render();
    };
    $('mq').oninput = debounce(() => { q = $('mq').value.trim(); shown = 60; load(); }, 350);
    $('mf').onclick = (e) => { const b = e.target.closest('[data-f]'); if (!b) return; f = b.dataset.f; shown = 60; render(); };
    $('mMore').onclick = () => { shown += 60; render(); };
    $('mlist').onclick = (e) => { const r = e.target.closest('[data-member]'); if (r) openMember(r.dataset.member); };
    $('mlist').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { const r = e.target.closest('[data-member]'); if (r) { e.preventDefault(); openMember(r.dataset.member); } } };
    reloadView = load;
    await load();
  };

  // ------------------------------------------------------------------ MEMBER DRAWER
  let DRAWER = null;
  function closeDrawer() { if (!DRAWER) return; DRAWER.el.remove(); DRAWER = null; document.body.style.overflow = ''; }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && DRAWER && !document.querySelector('.mdl')) closeDrawer(); });
  function openMember(uid) {
    if (!uid) return;
    if (!can('members')) return FL.toast('Member details need the Members area', 'err');
    closeDrawer();
    const el = document.createElement('div');
    el.className = 'drawer';
    el.innerHTML = `<aside class="drawer-card" role="dialog" aria-modal="true" aria-label="Member details">
      <div class="drawer-head"><b>Member</b><button class="icon-btn" type="button" data-x aria-label="Close">${I('close', 20)}</button></div>
      <div class="drawer-body">${spinner}</div></aside>`;
    el.addEventListener('mousedown', (e) => { if (e.target === el) closeDrawer(); });
    el.querySelector('[data-x]').onclick = closeDrawer;
    document.body.appendChild(el); document.body.style.overflow = 'hidden';
    DRAWER = { el, uid };
    renderMember(uid);
  }
  const afterChange = (uid) => { if (DRAWER && DRAWER.uid === uid) renderMember(uid); if (reloadView) reloadView(); };

  async function renderMember(uid) {
    const { data: p, error } = await sb.rpc('admin_member_detail', { p_user: uid });
    if (!DRAWER || DRAWER.uid !== uid) return;
    const body = DRAWER.el.querySelector('.drawer-body');
    if (error || !p) { body.innerHTML = `<div class="empty">${E(error ? FL.friendly(error) : 'This member no longer exists.')}</div>`; return; }
    const self = uid === MY_ID, age = ageOf(p.date_of_birth), s = p.subscription, c = p.counts || {};
    const status = p.community_status || 'active';
    const rArr = Object.keys(p.admin_rights || {}).filter((k) => p.admin_rights[k] && RMAP[k]);
    const manage = canManage({ user_id: uid, is_owner: p.is_owner, team: rArr.includes('team') });
    const canEdit = can('members') && (!p.is_owner || rights.is_owner);
    const tags = [p.is_owner ? '<span class="tg gold">Owner</span>' : p.is_admin ? `<span class="tg ok">${E(p.admin_title || 'Admin')}</span>` : '',
      status === 'suspended' ? '<span class="tg warn">Paused</span>' : status === 'banned' ? '<span class="tg bad">Removed</span>' : '',
      age != null && age < 18 ? '<span class="tg warn">Under 18</span>' : '', !p.profile_completed ? '<span class="tg">Profile not finished</span>' : '',
      p.open_to_work ? '<span class="tg ok">Open to work</span>' : '', self ? '<span class="tg">You</span>' : ''].join('');
    const comm = status === 'active' ? 'Can post, message and connect'
      : `${status === 'banned' ? 'Removed' : 'Paused'}${p.suspended_reason ? ' — ' + p.suspended_reason : ''}`;
    const commBtns = can('moderation') && !p.is_owner && !self
      ? (status === 'active' ? `<button class="pill ghost sm" data-d="suspended">Pause</button><button class="pill red-o sm" data-d="banned">Remove access</button>`
        : `<button class="pill sm" data-d="active">Restore access</button>${status === 'suspended' ? '<button class="pill red-o sm" data-d="banned">Remove access</button>' : ''}`) : '';
    body.innerHTML = `
      <div class="d-hero">${FL.avatarHtml(p, 'avatar md')}
        <div style="min-width:0;flex:1"><div class="nm" style="font-size:19px;font-weight:700">${E(p.full_name || 'Member')}${FL.tick(p.verified, 16)}${s && s.active ? FL.prem(s.plan) : ''}</div>
          ${p.headline ? `<div class="t-sm" style="margin-top:2px">${E(p.headline)}</div>` : ''}
          <div class="t-xs muted" style="margin-top:4px">@${E(p.username || '')} · <span class="mono">${E(p.unique_id || '')}</span>${p.city ? ' · ' + E(p.city) : ''}</div>
          ${tags ? `<div class="d-tags">${tags}</div>` : ''}</div></div>
      <div class="d-acts"><a class="pill sm" href="profile.html?u=${encodeURIComponent(p.username || '')}" target="_blank" rel="noopener">${I('external', 15)}Profile</a>
        ${!self ? `<a class="pill ghost sm" href="messaging.html?u=${encodeURIComponent(p.username || '')}">${I('messages', 15)}Message</a>` : ''}
        ${canEdit ? `<button class="pill ghost sm" type="button" data-d="edit">${I('edit', 15)}Edit details</button>` : ''}</div>
      <div class="d-sec"><div class="d-stats">${[[c.connections, 'Connections'], [c.posts, 'Posts'], [c.pages, 'Pages'], [c.applications, 'Job applications'],
        [c.reports_against, 'Reports against'], [c.auto_blocks_30d, 'Auto-blocks · 30d'], [c.devices, 'Pop-up devices']].map(([v, l]) => `<div><b>${n(v)}</b><span>${l}</span></div>`).join('')}</div></div>
      <div class="d-sec"><h4>Account</h4><dl class="d-kv">
        <dt>Email</dt><dd>${p.email ? `<a href="mailto:${E(p.email)}">${E(p.email)}</a>` : '—'}</dd>
        <dt>Mobile</dt><dd>${p.phone ? `<a href="tel:${E(p.phone)}">${E(p.phone)}</a>` : '—'}</dd>
        <dt>Age</dt><dd>${age != null ? `${age} <span class="muted t-xs">· born ${E(fmt(p.date_of_birth))}</span>` : '—'}</dd>
        <dt>Gender</dt><dd>${E(p.gender ? p.gender[0].toUpperCase() + p.gender.slice(1) : '—')}</dd>
        <dt>Profession</dt><dd>${E(p.profession_label || p.occupation || '—')}</dd>
        <dt>Experience</dt><dd>${E(p.experience_level || '—')}</dd>
        <dt>Joined</dt><dd>${E(fmt(p.created_at))}</dd>
        <dt>Last active</dt><dd>${E(ago(p.last_activity_at))}</dd>
        <dt>Profile</dt><dd>${p.profile_completed ? 'Finished' : 'Not finished'} · ${p.display_consent ? 'shown in search & hire portal' : 'hidden from search'}</dd></dl></div>
      <div class="d-sec"><h4>Standing & access</h4>
        <div class="d-row"><div><b>Verified tick</b><div class="t-xs">${p.is_owner ? 'Always shown for the owner' : p.verified_flag ? 'Shows the tick next to their name everywhere' : 'Not verified'}</div></div>
          ${can('verification') && !p.is_owner ? `<span class="switch"><input type="checkbox" data-tick ${p.verified_flag ? 'checked' : ''} aria-label="Verified tick"><span></span></span>` : ''}</div>
        <div class="d-row"><div><b>Community access</b><div class="t-xs">${E(comm)}</div></div>${commBtns ? `<div class="acts">${commBtns}</div>` : ''}</div>
        <div class="d-row"><div><b>Premium</b><div class="t-xs">${s ? (s.active ? `${E(FL.PLAN_NAMES[s.plan] || s.plan)} · ${E(SRC[s.source] || s.source)} · until ${E(fmt(s.expires_at))}` : `Ended ${E(fmt(s.expires_at))}`) : 'No Premium'}</div></div>
          ${can('premium') ? `<div class="acts"><button class="pill ghost sm" type="button" data-d="give">${I('crown', 14)}Give Premium</button>${s && s.active ? '<button class="pill red-o sm" type="button" data-d="end">End now</button>' : ''}</div>` : ''}</div>
        <div class="d-row"><div><b>Admin team</b><div class="t-xs">${p.is_owner ? 'Owner — every area' : p.is_admin ? `${E(p.admin_title || 'Admin')} — ${E(rArr.map((k) => RMAP[k].label).join(', ') || 'no areas')}` : 'Not on the admin team'}</div></div>
          ${manage ? `<button class="pill ghost sm" type="button" data-d="rights">${I('shield', 14)}${p.is_admin ? 'Edit rights' : 'Add to team'}</button>` : ''}</div>
      </div>
      <div class="d-sec"><h4>Courses</h4><div id="dCourses"><div class="t-sm muted">Loading…</div></div></div>
      ${(p.cases || []).length ? `<div class="d-sec"><h4>Recent reports & blocks</h4><div class="d-list">${p.cases.map((k) => `<div class="d-item">
          <div class="nm"><span class="st st-${E(k.status)}">${E(k.status)}</span><span class="t-xs muted">${E({ auto: 'Automatic block', report: 'Member report', ai: 'AI check' }[k.source] || k.source)} · ${E(String(k.target_type || '').replace('_', ' '))}${k.category ? ' · ' + E(k.category) : ''} · ${E(ago(k.created_at))}</span></div>
          ${k.content ? `<div class="quote" style="margin-top:8px">${E(k.content)}</div>` : ''}</div>`).join('')}</div>
          ${can('moderation') ? '<div style="margin-top:10px"><a class="t-sm" href="#moderation">Open Reports</a></div>' : ''}</div>` : ''}
      ${(p.history || []).length ? `<div class="d-sec"><h4>Admin history</h4><div class="d-list">${p.history.map((h) => `<div class="t-sm"><b>${E(h.actor || 'System')}</b> · ${E(actPlain(h.action))} <span class="muted t-xs">· ${E(ago(h.created_at))}</span></div>`).join('')}</div></div>` : ''}
      ${can('members') && !p.is_owner && !self ? `<div class="d-sec"><div class="d-danger"><div><b>Delete account</b><div class="t-xs muted">Removes their profile, progress, certificates and messages for good.</div></div>
          <button class="pill red-o sm" type="button" data-d="delete">${I('trash', 14)}Delete</button></div></div>` : ''}
      <div style="height:20px"></div>`;

    // courses
    (async () => {
      const host = body.querySelector('#dCourses');
      const { data, error: ce } = await sb.rpc('admin_member_courses', { p_user_id: uid });
      if (!host.isConnected) return;
      if (ce) { host.innerHTML = `<div class="t-sm muted">${E(FL.friendly(ce))}</div>`; return; }
      host.innerHTML = (data || []).length ? data.map((k) => `<div class="d-course"><div><b>${E(k.course_title)}</b>
          <div class="t-xs muted" style="margin-top:3px">${k.days_done}/${k.total_days} days · exam ${k.best_score != null ? Math.round(k.best_score) + '%' : '—'} · attempts ${k.attempts_used}/${k.max_attempts}${k.certificate_status ? ' · certificate ' + E(CST[k.certificate_status] || k.certificate_status) : ''}</div></div>
          <button class="pill red-o sm" type="button" data-reset="${E(k.course_id)}" data-title="${E(k.course_title)}">Reset progress</button></div>`).join('')
        : '<div class="t-sm muted">Not enrolled in any course.</div>';
    })();

    const tick = body.querySelector('[data-tick]');
    if (tick) tick.onchange = async () => {
      const ok = await act('admin_set_verified', { p_type: 'user', p_id: uid, p_on: tick.checked, p_note: null }, tick.checked ? 'Verified tick given' : 'Tick removed');
      if (!ok) tick.checked = !tick.checked; else afterChange(uid);
    };
    body.onclick = async (e) => {
      const rs = e.target.closest('[data-reset]');
      if (rs) {
        if (!(await FL.confirm('Reset course progress?', `${p.full_name}'s completed days and assignments in “${rs.dataset.title}” are cleared. Exam attempts and certificates are kept.`, 'Reset progress', true))) return;
        if (await act('admin_reset_member_progress', { p_user_id: uid, p_course_id: rs.dataset.reset }, 'Progress reset')) afterChange(uid);
        return;
      }
      const b = e.target.closest('[data-d]'); if (!b) return;
      const a = b.dataset.d;
      if (a === 'edit') return editMember(p);
      if (a === 'rights') return rightsEditor({ user_id: uid, full_name: p.full_name, username: p.username, photo_url: p.photo_url, is_admin: p.is_admin, rights: rArr, title: p.admin_title }, () => afterChange(uid));
      if (['active', 'suspended', 'banned'].includes(a)) {
        const r = await askNote({ title: a === 'active' ? 'Restore community access' : a === 'banned' ? 'Remove community access' : 'Pause community access',
          help: a === 'active' ? 'They are told that messaging, posting and connecting are open again.' : 'They can still study and keep certificates, but can no longer message, post or connect. They are told why.',
          okLabel: a === 'active' ? 'Restore' : a === 'banned' ? 'Remove access' : 'Pause', danger: a !== 'active', ph: a === 'active' ? '' : 'e.g. Repeated abusive messages' });
        if (!r) return;
        if (await act('admin_set_community_status', { p_user: uid, p_status: a, p_note: r.note || null }, 'Updated')) afterChange(uid);
        return;
      }
      if (a === 'give') return givePremium(uid, p.full_name, () => afterChange(uid));
      if (a === 'end') {
        if (!(await FL.confirm('End Premium now?', 'Their Premium features stop straight away. No refund is made automatically.', 'End Premium', true))) return;
        if (await act('admin_grant_premium', { p_user: uid, p_plan: null, p_days: 0 }, 'Premium ended')) afterChange(uid);
        return;
      }
      if (a === 'delete') {
        if (!(await typedConfirm('Delete this account?', `${p.full_name}'s profile, progress, certificates, posts and messages are deleted permanently. This can't be undone.`, p.username || 'delete', 'Delete for good'))) return;
        if (await act('admin_delete_member', { p_user_id: uid }, 'Account deleted')) { closeDrawer(); if (reloadView) reloadView(); }
      }
    };
  }

  function givePremium(uid, name, done) {
    FL.form({ title: `Give Premium to ${first(name)}`, saveLabel: 'Give Premium', note: 'Adds to any time they already have. They are never charged for this.',
      values: { plan: 'pro', days: '30' }, fields: [
        { k: 'plan', label: 'Plan', type: 'select', half: true, options: [['pro', 'Pro'], ['business', 'Business'], ['recruiter', 'Recruiter']] },
        { k: 'days', label: 'How long', type: 'select', half: true, options: [['14', '14 days'], ['30', '30 days'], ['90', '3 months'], ['180', '6 months'], ['365', '1 year']] },
