  // ------------------------------------------------------------------ RIGHTS EDITOR
  function rightsEditor(t, onDone) {
    const cur = new Set(t.rights || []);
    const mine = (k) => rights.is_owner || (k !== 'team' && !!rights[k]);
    const m = FL.modal({ title: t.is_admin ? 'Edit admin rights' : 'Add to the admin team', body: `
      <div class="re-who">${FL.avatarHtml(t, 'avatar sm')}<div><b>${E(t.full_name || 'Member')}</b><span>@${E(t.username || '')}</span></div></div>
      <div class="field"><label for="reTitle">Role title <span class="muted">(shown on the team list)</span></label><input id="reTitle" maxlength="40" placeholder="e.g. Moderator" value="${E(t.title || '')}"></div>
      <div class="t-xs muted" style="margin:-4px 0 6px;font-weight:700">Quick start</div>
      <div class="presets">${PRESETS.map(([name], i) => `<button type="button" data-p="${i}">${E(name)}</button>`).join('')}</div>
      <div class="rights">${RIGHTS.map(([k, l, d, ic]) => { const dis = !mine(k); return `<label class="rt ${cur.has(k) ? 'on' : ''} ${dis ? 'dis' : ''}">
          <span class="ic">${I(ic, 17)}</span><span class="tx"><b>${E(l)}</b><span>${E(d)}</span>${dis ? `<em>${k === 'team' ? 'Only the owner can give this' : 'You can only give areas you manage yourself'}</em>` : ''}</span>
          <span class="switch"><input type="checkbox" data-k="${k}" ${cur.has(k) ? 'checked' : ''} ${dis ? 'disabled' : ''} aria-label="${E(l)}"><span></span></span></label>`; }).join('')}</div>
      <div class="notice" id="reSum" style="margin:14px 0 0"></div>`,
      foot: `${t.is_admin ? '<button class="pill red-o left" type="button" data-rm>Remove from team</button>' : ''}<button class="pill ghost" type="button" data-no>Cancel</button><button class="pill solid" type="button" data-ok>${t.is_admin ? 'Save rights' : 'Add to team'}</button>` });
    const sel = () => [...m.qa('[data-k]')].filter((x) => x.checked).map((x) => x.dataset.k);
    const sum = () => {
      const s = sel();
      m.qa('.rt').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
      m.q('#reSum').innerHTML = s.length
        ? `${I('eye', 18)}<div>${E(first(t.full_name))} will see <b>${s.map((k) => E(RMAP[k].label)).join(', ')}</b> in the Control Room — nothing else.</div>`
        : `${I('help', 18)}<div>${t.is_admin ? 'No areas ticked — saving removes them from the admin team.' : 'Tick at least one area, or pick a quick start above.'}</div>`;
    };
    m.el.addEventListener('change', sum); sum();
    m.q('.presets').onclick = (e) => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      const [name, ks] = PRESETS[+b.dataset.p];
      m.qa('[data-k]').forEach((x) => { if (!x.disabled) x.checked = ks.includes(x.dataset.k); });
      const ti = m.q('#reTitle'); if (!ti.value.trim() || PRESETS.some(([pn]) => pn === ti.value.trim())) ti.value = name;
      sum();
    };
    const save = async (btn, on) => {
      const s = on ? sel() : [];
      if (on && !s.length && !t.is_admin) return FL.toast('Tick at least one area', 'err');
      const r = {}; s.forEach((k) => { r[k] = true; });
      FL.busy(btn, true, 'Saving…');
      const ok = await act('admin_set_rights', { p_user: t.user_id, p_is_admin: s.length > 0, p_rights: r, p_title: m.q('#reTitle').value.trim() || null });
      FL.busy(btn, false);
      if (!ok) return;
      m.close();
      FL.toast(s.length ? (t.is_admin ? 'Rights saved' : `${first(t.full_name)} is on the team — they've been notified`) : `${first(t.full_name)} has been removed from the team`, 'ok');
      if (onDone) onDone();
    };
    m.q('[data-no]').onclick = m.close;
    m.q('[data-ok]').onclick = (e) => save(e.currentTarget, true);
    if (t.is_admin) m.q('[data-rm]').onclick = async (e) => {
      const btn = e.currentTarget;
      if (await FL.confirm('Remove from the admin team?', `${t.full_name} loses access to the Control Room straight away.`, 'Remove', true)) save(btn, false);
    };
  }

  // ------------------------------------------------------------------ ADMIN TEAM
  let TEAM = [];
  const teamToEditor = (t) => ({ user_id: t.user_id, full_name: t.full_name, username: t.username, photo_url: t.photo_url, is_admin: true, rights: t.rights || [], title: t.title });
  function addPerson(onDone) {
    const m = FL.modal({ title: 'Add a person to the admin team', body: `<p class="t-sm muted" style="margin:0 0 12px;line-height:1.5">Search by name, @username or Fit Lab ID. Admins must be 18 or over.</p>
      <div class="cr-search"><span class="ic">${I('search', 18)}</span><input id="apQ" type="search" placeholder="Search members" autocomplete="off" aria-label="Search members"></div>
      <div id="apRes" class="ap-res"><div class="empty t-sm">Start typing a name.</div></div>` });
    let list = [];
    const run = debounce(async () => {
      const q = m.q('#apQ').value.trim(), out = m.q('#apRes');
      if (q.length < 2) { out.innerHTML = '<div class="empty t-sm">Start typing a name.</div>'; return; }
      let found = [];
      if (can('members')) { const { data } = await sb.rpc('admin_search', { p_q: q }); found = (data && data.members) || []; }
      if (!found.length) { const { data } = await sb.rpc('search_people', { p_q: q, p_limit: 8 }); found = Array.isArray(data) ? data : []; }
      if (!found.length) { const { data } = await sb.rpc('find_member', { p_handle: q }); if (data && data.user_id) found = [data]; }
      if (!out.isConnected || m.q('#apQ').value.trim() !== q) return;
      list = found;
      out.innerHTML = list.length ? list.map((p) => { const inTeam = TEAM.some((t) => t.user_id === p.user_id); return `<button type="button" class="ap-i" data-u="${E(p.user_id)}">${FL.avatarHtml(p, 'avatar sm')}
          <span class="r-t"><b>${E(p.full_name)}</b><span>@${E(p.username || '')}${p.headline ? ' · ' + E(p.headline) : ''}</span></span><span class="pill sm ${inTeam ? 'ghost' : ''}">${inTeam ? 'On the team' : 'Choose'}</span></button>`; }).join('')
        : `<div class="empty t-sm">No member found for “${E(q)}”.</div>`;
    }, 280);
    m.q('#apQ').oninput = run;
    m.q('#apRes').onclick = (e) => {
      const b = e.target.closest('[data-u]'); if (!b) return;
      const p = list.find((x) => x.user_id === b.dataset.u); if (!p) return;
      if (p.user_id === MY_ID) return FL.toast('You can\'t change your own rights', 'err');
      const t = TEAM.find((x) => x.user_id === p.user_id);
      if (t && t.is_owner) return FL.toast('The owner always has every area', 'err');
      m.close();
      rightsEditor(t ? teamToEditor(t) : { user_id: p.user_id, full_name: p.full_name, username: p.username, photo_url: p.photo_url, is_admin: false, rights: [], title: '' }, onDone);
    };
  }
  VIEWS.team = async (alive, sub) => {
    const { data, error } = await sb.rpc('admin_team_list');
    if (!alive()) return;
    if (error) { $('view').innerHTML = errBox(error); return; }
    TEAM = data || [];
    const trow = (t) => {
      const rs = t.is_owner ? [] : (t.rights || []).filter((k) => RMAP[k]);
      const editable = canManage({ user_id: t.user_id, is_owner: t.is_owner, team: rs.includes('team') });
      return `<div class="lrow" data-t="${E(t.user_id)}"><div class="who">${FL.avatarHtml(t, 'avatar sm')}<div>
          <div class="nm"><b>${E(t.full_name)}</b>${FL.tick(t.verified, 14)}<span class="tg ${t.is_owner ? 'gold' : 'ok'}">${E(t.title || (t.is_owner ? 'Owner' : 'Admin'))}</span>${t.user_id === MY_ID ? '<span class="tg">You</span>' : ''}</div>
          <div class="sub">@${E(t.username || '')} · active ${E(ago(t.last_activity_at))} · ${plural(t.actions_30d || 0, 'action')} in 30 days</div>
          <div class="rchips">${t.is_owner ? '<span class="chip acc">Every area</span>' : rs.map((k) => `<span class="chip">${I(RMAP[k].icon, 13)}${E(RMAP[k].label)}</span>`).join('') || '<span class="muted t-xs">No areas</span>'}</div></div></div>
        <div class="acts">${editable ? '<button class="pill sm" type="button" data-edit>Edit rights</button><button class="pill ghost sm" type="button" data-rm>Remove</button>' : ''}
          ${can('members') && t.user_id !== MY_ID ? '<button class="pill ghost sm" type="button" data-open>Details</button>' : ''}</div></div>`;
    };
    $('view').innerHTML = `<div class="stack">
      <div class="box"><div class="box-head"><div><h2>Admin team</h2><div class="sub">Choose who helps you run The Fit Lab — and exactly what each person can do.</div></div>
          ${can('team') ? `<button class="pill solid sm" type="button" id="tAdd">${I('userplus', 16)}Add a person</button>` : ''}</div>
        <div class="steps3"><div><b>1</b><span>Pick a member who is 18 or over</span></div><div><b>2</b><span>Tick the areas they can manage</span></div><div><b>3</b><span>They're notified and see only those areas</span></div></div>
        <div id="tList">${TEAM.map(trow).join('') || '<div class="empty">No one else is on the team yet.</div>'}</div></div>
      <div class="box"><div class="box-head"><div><h2>What each area allows</h2><div class="sub">Everything the team does is recorded in the Activity log.${rights.is_owner ? '' : ' You can give others only the areas you manage yourself.'}</div></div></div>
        <div class="rlist">${RIGHTS.map(([, l, d, ic]) => `<div class="rl"><span class="ic">${I(ic, 17)}</span><div><b>${E(l)}</b><span>${E(d)}</span></div></div>`).join('')}</div></div></div>`;
    const reload = () => { if (current === 'team') VIEWS.team(alive); };
    reloadView = reload;
    if ($('tAdd')) $('tAdd').onclick = () => addPerson(reload);
    $('tList').onclick = async (e) => {
      const row = e.target.closest('[data-t]'); if (!row) return;
      const t = TEAM.find((x) => x.user_id === row.dataset.t); if (!t) return;
      if (e.target.closest('[data-edit]')) return rightsEditor(teamToEditor(t), reload);
      if (e.target.closest('[data-open]')) return openMember(t.user_id);
      if (e.target.closest('[data-rm]')) {
        if (!(await FL.confirm('Remove from the admin team?', `${t.full_name} loses access to the Control Room straight away.`, 'Remove', true))) return;
        if (await act('admin_set_rights', { p_user: t.user_id, p_is_admin: false, p_rights: {}, p_title: null }, `${first(t.full_name)} has been removed from the team`)) reload();
      }
    };
    if (sub === 'add' && can('team')) { history.replaceState(null, '', '#team'); addPerson(reload); }
  };

  // ------------------------------------------------------------------ ACTIVITY LOG
  const SETTING = { allow_contacts: 'contact sharing', ai_moderation: 'the AI second check', verify_auto: 'automatic verification', verify_auto_min: 'the minimum verification score', verify_min: 'the minimum verification score' };
  const ACT = {
    'member.delete': ['trash', (t) => `deleted the account of ${t}`],
    'admin.rights': ['shield', (t, d) => d.is_admin ? `set ${t}'s admin areas${Object.keys(d.rights || {}).length ? ': ' + Object.keys(d.rights).filter((k) => RMAP[k]).map((k) => E(RMAP[k].label)).join(', ') : ''}${d.title ? ` (${E(d.title)})` : ''}` : `removed ${t} from the admin team`],
    'member.active': ['check', (t) => `restored community access for ${t}`],
    'member.suspended': ['block', (t) => `paused ${t}`],
    'member.banned': ['block', (t) => `removed community access for ${t}`],
    'member.verified': ['tick', (t) => `gave ${t} the verified tick`],
    'member.unverified': ['tick', (t) => `removed the verified tick from ${t}`],
    'member.edit': ['edit', (t) => `edited ${t}'s account details`],
    'verify.approved': ['tick', (t) => `approved verification for ${t}`],
    'verify.rejected': ['close', (t) => `declined verification for ${t}`],
    'verify.needs_info': ['help', (t) => `asked ${t} for more information`],
    'page.verified': ['building', (t) => `verified the page ${t}`],
    'page.unverified': ['building', (t) => `removed the tick from the page ${t}`],
    'page.active': ['building', (t) => `restored the page ${t}`],
    'page.suspended': ['building', (t) => `suspended the page ${t}`],
    'page.removed': ['trash', (t) => `removed the page ${t}`],
    'premium.give': ['crown', (t, d) => `gave ${t} ${E(FL.PLAN_NAMES[d.plan] || 'Premium')}${d.until ? ' until ' + E(fmt(d.until)) : ''}`],
    'premium.end': ['crown', (t) => `ended Premium for ${t}`],
    'booking_refunded': ['rupee', (t, d) => `marked booking ${t} as refunded${d.amount ? ' (₹' + E(d.amount) + ')' : ''}`],
    'route_account': ['rupee', (t, d) => d.on ? `switched on online payments for ${t}` : `switched off online payments for ${t}`],
    'booking_fee': ['rupee', (t, d) => `set the booking fee to ${E(d.pct)}%`],
    'certificate.approved': ['award', (t, d) => `approved ${t}'s certificate${d.course ? ' for ' + E(d.course) : ''}`],
    'certificate.auto_approved': ['award', (t, d) => `issued ${t}'s certificate${d.course ? ' for ' + E(d.course) : ''}`],
    'certificate.rejected': ['award', (t) => `sent ${t}'s certificate back for changes`],
    'certificate.revoked': ['award', (t) => `revoked ${t}'s certificate`],
    'certificate.pending': ['award', (t) => `moved ${t}'s certificate back to review`],
    'case.resolved': ['flag', (t) => `acted on a report about ${t}`],
    'case.dismissed': ['flag', (t) => `dismissed a report about ${t}`],
    'announcement': ['bell', (t) => `sent the announcement ${t}`],
    'plan.update': ['crown', (t) => `updated the ${t} plan`],
    'rule.add': ['shield', (t, d) => `added the conduct rule ${t}${d.category ? ` (${E(d.category)}, ${E(d.severity || 'medium')})` : ''}`],
    'rule.remove': ['shield', (t) => `removed the conduct rule ${t}`],
  };
  function actLine(a) {
    const d = a.detail || {};
    if (a.action === 'setting') {
      const lbl = SETTING[a.target_name];
      const v = String(d.value == null ? '' : d.value);
      return ['settings', lbl ? (/^(on|off)$/.test(v) ? `switched ${lbl} <b>${v}</b>` : `set ${lbl} to <b>${E(v)}</b>`) : `changed the setting <b>${E(a.target_name || '')}</b>`];
    }
    const name = a.target_name ? (a.target_type === 'member' && a.target_id && can('members')
      ? `<button class="lnk" type="button" data-member="${E(a.target_id)}">${E(a.target_name)}</button>` : `<b>${E(a.target_name)}</b>`) : 'someone';
    const f = ACT[a.action];
    return f ? [f[0], f[1](name, d)] : ['activity', `${E(a.action)} · ${name}`];
  }
  const actPlain = (action) => {
    if (action === 'admin.rights') return 'changed their admin rights';
    if (action === 'setting') return 'changed a setting';
    const f = ACT[action]; if (!f) return action;
    const tmp = document.createElement('div'); tmp.innerHTML = f[1]('this member', {}); return tmp.textContent;
  };
  const dayLabel = (d) => { const t = new Date(); const y = new Date(Date.now() - 864e5);
    return d.toDateString() === t.toDateString() ? 'Today' : d.toDateString() === y.toDateString() ? 'Yesterday' : d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
  VIEWS.activity = async (alive) => {
    let who = '', rows = [];
    const { data: team } = await sb.rpc('admin_team_list');
    if (!alive()) return;
    $('view').innerHTML = `<div class="box"><div class="box-head"><div><h2>Activity log</h2><div class="sub">Every change the admin team makes, newest first. Nobody — not even admins — can edit or delete it.</div></div></div>
      <div class="cr-tools"><select id="acWho" aria-label="Filter by admin"><option value="">Everyone on the team</option>${(team || []).map((t) => `<option value="${E(t.user_id)}">${E(t.full_name)}</option>`).join('')}</select></div>
      <div id="acList">${spinner}</div><div class="box-foot" id="acMoreW" hidden><button type="button" id="acMore">Load older</button></div></div>`;
    const render = () => {
      let day = '', out = '';
      for (const a of rows) {
        const d = new Date(a.created_at);
        if (d.toDateString() !== day) { day = d.toDateString(); out += `<div class="log-day">${E(dayLabel(d))}</div>`; }
        const [ic, txt] = actLine(a);
        const note = a.detail && (a.detail.note || a.detail.reason);
        out += `<div class="log">${a.actor ? FL.avatarHtml(a.actor, 'avatar xs') : `<span class="avatar xs">${I(ic, 14)}</span>`}
          <div style="min-width:0"><p><b>${E(a.actor ? a.actor.full_name : 'System')}</b> ${txt}</p>${note ? `<div class="t-xs">“${E(note)}”</div>` : ''}</div>
          <time datetime="${E(a.created_at)}" title="${E(d.toLocaleString('en-IN'))}">${E(d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }))}</time></div>`;
      }
      $('acList').innerHTML = out || '<div class="empty"><b>Nothing yet</b>Changes made by the admin team will appear here.</div>';
    };
    const load = async (more) => {
      const before = more && rows.length ? rows[rows.length - 1].created_at : null;
      const { data, error } = await sb.rpc('admin_audit_list', { p_limit: 60, p_before: before, p_actor: who || null });
      if (!alive()) return;
      if (error) { $('acList').innerHTML = `<div class="empty">${E(FL.friendly(error))}</div>`; return; }
      const got = data || []; rows = more ? rows.concat(got) : got; render();
      $('acMoreW').hidden = got.length < 60;
    };
    $('acWho').onchange = () => { who = $('acWho').value; load(false); };
    $('acMore').onclick = () => load(true);

      $('rF').innerHTML = [['all', 'All', rules.length], ...RCATS.map(([k, l]) => [k, l, counts[k] || 0])].filter(([k, , c]) => k === 'all' || c)

      const list = rules.filter((r) => rf === 'all' || r.category === rf)
        .sort((a, b) => (sevOrder[a.severity] - sevOrder[b.severity]) || a.category.localeCompare(b.category) || a.pattern.localeCompare(b.pattern));
      $('rMoreW').hidden = list.length <= rShown; $('rMore').textContent = `Show all ${list.length} rules`;

        const k = `data-u="${E(c.user_id)}" data-c="${E(c.course_id)}"`, acts = [];
        if (c.status === 'pending' || c.status === 'rejected') acts.push(c.eligible ? `<button class="pill solid sm" type="button" data-act="approve" ${k}>Approve</button>` : '<span class="sub" title="No passed exam on record">Not eligible yet</span>');
        if (c.status === 'pending') acts.push(`<button class="pill ghost sm" type="button" data-act="reject" ${k}>Request changes</button>`);
        if (c.status === 'approved' || c.status === 'auto_approved') {
          if (c.certificate_url) acts.push(`<a class="pill ghost sm" href="${E(c.certificate_url)}" target="_blank" rel="noopener">View</a>`);
          acts.push(`<button class="pill red-o sm" type="button" data-act="revoke" ${k}>Revoke</button>`);
        }
        if (c.status === 'revoked' && c.eligible) acts.push(`<button class="pill sm" type="button" data-act="restore" ${k}>Restore</button>`);
        return `<div class="lrow"><div class="who">${FL.avatarHtml(c, 'avatar sm')}<div>
            <div class="nm">${can('members') ? `<button class="lnk" type="button" data-member="${E(c.user_id)}">${E(c.full_name)}</button>` : `<b>${E(c.full_name)}</b>`}<span class="st st-${E(c.status)}">${E(CST[c.status] || c.status)}</span></div>
            <div class="sub">${E(c.course_title)} · best score ${c.percentage != null ? Math.round(c.percentage) + '%' : '—'} · <span class="mono">${E(c.unique_id || '')}</span> · ${E(fmt(c.revoked_at || c.reviewed_at || c.issued_at))}</div>
            ${c.review_note ? `<div class="sub">“${E(c.review_note)}”</div>` : ''}</div></div><div class="acts">${acts.join('')}</div></div>`;
      }).join('') : `<div class="empty">${f === 'pending' ? '<b>Nothing to approve</b>Certificates waiting for review appear here.' : 'Nothing here.'}</div>`;
    };
    $('cF').onclick = (e) => { const b = e.target.closest('[data-f]'); if (!b) return; f = b.dataset.f; $('cF').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); load(); };
    $('cList').onclick = async (e) => {
      const mb = e.target.closest('[data-member]'); if (mb) return openMember(mb.dataset.member);
      const b = e.target.closest('[data-act]'); if (!b) return;
      const row = rows.find((c) => c.user_id === b.dataset.u && c.course_id === b.dataset.c); if (!row) return;
      const ids = { p_user_id: row.user_id, p_course_id: row.course_id };
      let fn, args, done;
      if (b.dataset.act === 'approve') { fn = 'approve_certificate'; args = { ...ids, p_certificate_url: null }; done = 'Approved — the certificate is being generated and emailed'; }
      else if (b.dataset.act === 'reject') {
        const r = await askNote({ title: `Request changes · ${row.full_name}`, help: 'They are notified with your note and can be approved later.', okLabel: 'Send back', required: true,
          ph: 'e.g. Assignments for Days 4–6 are missing — please complete them and we\'ll review again.' });
        if (!r) return; fn = 'reject_certificate'; args = { ...ids, p_note: r.note }; done = 'Sent back to the member';
      } else if (b.dataset.act === 'revoke') {
        const r = await askNote({ title: `Revoke certificate · ${row.full_name}`, help: 'The certificate disappears from the public verification page and the hire portal. You can restore it later.', okLabel: 'Revoke', danger: true });
        if (!r) return; fn = 'revoke_certificate'; args = { ...ids, p_note: r.note }; done = 'Certificate revoked';
      } else { fn = 'restore_certificate'; args = ids; done = 'Certificate restored'; }
      FL.busy(b, true, '…');
      const ok = await act(fn, args, done);
      if (b.isConnected) FL.busy(b, false);
      if (ok) load();
    };
    reloadView = load;
    await load();
  };

  // ------------------------------------------------------------------ ANNOUNCEMENTS
  VIEWS.broadcast = async () => {
    const KIND = { info: ['Announcement', 'bell'], launch: ['Course launch', 'courses'], motivation: ['Motivation', 'zap'] };
    $('view').innerHTML = `<div class="layout l-main-side">
      <div class="box"><div class="box-head"><div><h2>Send an announcement</h2><div class="sub">Every member sees it as a pop-up the next time they open The Fit Lab — and as a phone notification if they've switched pop-ups on.</div></div></div>
        <div class="box-pad">
          <div class="field"><label for="bTitle" class="req">Title</label><input id="bTitle" maxlength="120" placeholder="New course launching Monday"></div>
          <div class="field"><label for="bBody">Message</label><textarea id="bBody" maxlength="1000" placeholder="Details…"></textarea></div>
          <div class="row2">
            <div class="field"><label for="bKind">Type</label><select id="bKind"><option value="info">Info</option><option value="launch">Course launch</option><option value="motivation">Motivation</option></select></div>
            <div class="field"><label for="bLink">Link <span class="muted">(optional)</span></label><input id="bLink" placeholder="courses.html"><span class="help">A page on this site, like courses.html or jobs.html</span></div></div>
          <button class="pill solid lg" type="button" id="bSend">${I('send', 16)}Send to everyone</button></div></div>
      <div class="stack"><div class="kgrp" style="margin:0">Preview</div><div class="box bc-prev" id="bPrev"></div>
        <div class="kgrp" style="margin:4px 0 0">On a phone</div><div class="bc-push" id="bPush"></div></div></div>`;
    const okLink = (l) => !l || /^[a-z0-9_-]+\.html([?#][^\s<>"'`]*)?$/i.test(l);
    const prev = () => {
      const t = $('bTitle').value.trim(), b = $('bBody').value.trim(), l = $('bLink').value.trim(), [kl, ki] = KIND[$('bKind').value] || KIND.info;
      $('bPrev').innerHTML = `<div class="bc-k">${I(ki, 15)}${E(kl)}</div><h3>${E(t || 'Your title appears here')}</h3>${b ? `<p>${E(b)}</p>` : ''}
        <div class="acts">${l && okLink(l) ? '<span class="pill solid sm">Open</span>' : ''}<span class="pill ghost sm">Close</span></div>
        ${l && !okLink(l) ? '<p class="err" style="margin:10px 0 0">Links must be a page on this site, like courses.html</p>' : ''}`;
      $('bPush').innerHTML = `<img src="assets/icon-192.png" alt=""><div style="min-width:0"><b>${E(t || 'Your title')}</b><span>${E(b || 'The Fit Lab')}</span></div>`;
    };
    ['bTitle', 'bBody', 'bLink', 'bKind'].forEach((id) => $(id).addEventListener('input', prev)); prev();
    $('bSend').onclick = async () => {
      const title = $('bTitle').value.trim(), link = $('bLink').value.trim();
      if (!title) return FL.toast('Give the announcement a title', 'err');
      if (!okLink(link)) return FL.toast('Links must be a page on this site, like courses.html', 'err');
      if (!(await FL.confirm('Send to every member?', 'It appears as a pop-up for everyone and can\'t be taken back.', 'Send now'))) return;
      const btn = $('bSend'); FL.busy(btn, true, 'Sending…');
      const ok = await act('admin_broadcast', { p_title: title, p_body: $('bBody').value.trim() || null, p_kind: $('bKind').value, p_link: link || null, p_expires: null }, 'Announcement sent to all members');
      FL.busy(btn, false);
      if (ok) { $('bTitle').value = ''; $('bBody').value = ''; $('bLink').value = ''; prev(); }
    };
  };

  // ------------------------------------------------------------------ start
  go();
  if (current !== 'overview') sb.rpc('admin_overview').then(({ data }) => { if (data) applyCounts(data.attention); });
})();
</script>
</body>
</html>
